# --- 入宗路线 ---
入宗路线:
  - 阶段: 散修（蜕凡境）
    描述: 曦和大陆西境，跟随养父种田进山（第1卷 第1-45章）
  - 阶段: 玄天宗外门弟子（蜕凡中期）
    描述: 以散修身份通过测试成为玄天宗外门弟子，分配到后山药园（第1卷 第51章）
  - 阶段: 玄天宗执事堂外门（蜕凡~铭纹境）
    描述: 在玄天宗修炼成长
  - 阶段: 洗劫影会宝库（神藏初期）
    描述: |
      主角神藏初期时，洗劫了影会在梧栖国积攒几百年的外围通货流动库
      宝库位置：梧栖国一个主城商铺后院
      宝库内容：大量钱财、渊石、药材、几部功法（仅外围通货库，未触碰核心重宝区）

      洗劫可行性铺垫（三要素闭环）：
      1. 镇眼兽脉缺失：影会大能被调离时随身带走了宝库核心阵法的"镇眼兽脉"，备用警戒网对主角低阶真元脱敏——阵法仍能探测高阶渊能波动，但对神藏初期的低阶真元反应阈值过高，视为背景噪声忽略
      2. 仅洗外围通货库：主角触碰的仅为"百年外围通货流动库"（日常进出货的流通资金），绝不触碰核心重宝区（核心区另有独立禁制，主角根本无法接近）
      3. 芥子囊补全：缴获包裹中顺手开出前任堂主遗留的"高阶空芥子囊"（容量远超主角自身储物戒），补全负重闭环

      陆九霄（好兄弟）和苏若笙（私定终身）共同帮助主角成功逃走
      被影会追杀，被迫逃到不死洲（天陨阁辖区）
      追杀后续：玄天宗知道影会存在，有意清理曦和大陆内影会势力，对影会追杀进行阻挠拦截，影会被迫暗中收集
      影会暗中收集方式：通过梧栖国收集情报、云垂剑庭出战力、沧汐王朝出人出力、购买窃取或欺压等手段、正常商业经营获取
      玄天宗清理计划：大多数以当地势力按上罪名处决，少部分被暗杀清剿带回玄天宗审问囚禁
      影会残余势力：转移、沉淀、等待命令
      影会在曦和大陆分布：主要在梧栖国，其次在沧汐王朝，最后是云垂剑庭，其它地方也都有渗透
      影会没落状态：被主角清剿过一次后再加上玄天宗的阻挠，影会在曦和大陆已经没落，影响力和势力大不如前，在后面的剧情中基本上不会出现
  - 阶段: 天陨阁炼丹堂外门（神藏中后）
    描述: 以散修身份化名陆沉加入天陨阁丹阁

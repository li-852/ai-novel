# --- 弱点与限制 ---
弱点:
  - 名称: 十倍消耗
    描述: 十倍体质意味着十倍消耗——修炼需要的资源是常人十倍，受伤后恢复需要的丹药也是十倍。穷的时候比普通散修更难熬。
    状态: 存在
  - 名称: 气息波动大
    描述: 体质特殊导致渊能波动比常人强烈，不隐藏时容易被高手察觉。必须依赖隐息衣或后续获得的潜龙诀。
    状态: 已解决（第1卷 第131章获得潜龙诀，第1卷 第143章大成，气息全无）
  - 名称: 战斗经验不足
    描述: 出身种田，没有师父教，实战经验少。靠体质硬扛，技巧不足。
    状态: 改善中（通过杀妖兽和内门大比积累经验）
  - 名称: 丹道全靠摸索
    描述: 没有正式师父教炼丹，全靠自己看丹方摸索，前期成丹率低，浪费材料。
    状态: 存在
  - 名称: 性格太犟
    描述: 认准的事十头牛拉不回来，容易钻牛角尖，也容易得罪人。
    状态: 存在
  - 名称: 巧舌如簧但爱坑人
    描述: 能说会道，擅长忽悠，喜欢坑人（尤其是朋友和对手），有点小梗。容易因为嘴贱得罪人，也容易被人记恨。
    状态: 存在
  - 名称: 进步速度过快
    描述: 三个月从一千五百斤涨到两千七百斤，引起刘执事注意。
    状态: 风险中

# --- 身份潜伏体系 ---
身份潜伏:
  本源印记副卡:
    来源: 陆九霄通过玄天宗西域堂某贪腐长老渠道办理
    原主: 陆沉（已死亡，详见"死间陆沉"）
    寿命: 50年（物理本源印记副卡）
    风险: 高境界底检可能穿帮
  本源印记同化:
    触发条件: 突破道种境凝聚本命图腾时
    机制: 利用上古本源印记的霸道属性，将本源印记副卡彻底吞噬并固化在自身频段
    效果: 物理副卡变为生理印记，永久解决副卡过期问题
    副作用: 同化过程需承受额外的本源震荡，持续三日三夜
  死间陆沉:
    掩护: 原"陆沉"在某次深渊灾厄中死亡，灵魂带本源印记均被"影会"彻底抹除
    效果: 死无对证，任何底查都无法追溯原主
    陆九霄切割: 陆九霄利用的是"玄天宗西域堂某个贪腐长老的渠道"办理凭证
    防火墙: 若被查，该贪腐长老成为完美替罪羊（陆九霄已暗中收集其贪腐证据）
    档案断层: 主角离开后，青岩城废弃矿坑发生"地脉自燃坍塌事故"——渊脉残留能量自燃引发矿道连环坍塌，矿区被岩浆封锁成禁地，所有流民档案、过所凭证均焚毁，追查者面对的是一片焦土
  转场缓冲:
    中转站: 归墟宗
    机制: 主角在玄天宗、天陨阁、炽天宗之间跳槽时，以归墟宗为"合法中转站"与"身份洗白缓冲池"
    流程: 离宗→归墟宗（身份洗白、本源印记重置）→新宗门
    优势: 归墟宗为散修庇护所，对外来者无严格底检，燃灯宗主默许此类操作

# --- 遗物书信 ---
# 芥子坠内的书信，养父沈渊礼留下
沈渊礼书信: |
  小默：

  你看到这封信的时候，我应该已经走了。不要找我。

  芥子坠是给你的。滴血便能打开，里面有些东西，以后你用得上。

  你从小就犟，认准的事十头牛都拉不回来。这点像你爹。

  外面的世界比你想的复杂，也比你想的危险。出门在外，多看多听少说话。能忍的事就忍一忍，活着比什么都重要。

  你体质特殊，切记不可在外人面前暴露。藏好自己，才能活得久。

  照顾好自己。

  沈渊礼

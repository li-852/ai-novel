# 章节校验规则（外置于代码，便于维护，不绑定具体实现）
# 修改本文件即可调整校验关键词，无需改 novel_kb.py
# 说明：物品/伏笔/位置也会从 章节追踪.yaml / 主角状态.yaml 动态派生，
#       本文件仅作为"尚未纳入追踪时的兜底"与"通用词表"。

# 通用状态变更关键词（与具体小说无关，主角/人物状态变化提示）
state_keywords:
  - 突破
  - 修炼
  - 受伤
  - 离开
  - 到达
  - 获得
  - 学会
  - 发现
  - 消失
  - 出现
  - 教导
  - 训练
  - 死亡
  - 失踪

# 境界/修为变更关键词（主角境界交叉校验）
realm_keywords:
  - 蜕凡
  - 凝元
  - 铭纹
  - 归真
  - 天渊
  - 突破
  - 晋级
  - 进阶
  - 修为提升

# 位置归类：追踪位置值 -> 章节中可能出现的方位词（用于位置一致性校验）
location_groups:
  村中:
    - 村子
    - 村里
    - 院子
    - 灶房
    - 家门口
    - 苞谷地
    - 院门
  镇上:
    - 镇上
    - 镇子
    - 街上
    - 铺面
    - 粮铺
    - 杂货铺
  山上:
    - 山上
    - 山梁
    - 山坳
    - 山脊
    - 垭口
    - 松林
  路上:
    - 路上
    - 走了
    - 往回走
    - 出门

# 已知物品兜底（未纳入追踪时仍能检测"新物品出现"）
known_items:
  - 养元丹
  - 疗伤丹
  - 聚气丹
  - 影字令牌
  - 令牌
  - 芥子坠
  - 隐息衣
  - 潜龙诀
  - 粗布

# 伏笔关键词：词 -> 关联描述（出现但未在伏笔追踪中时提示）
hook_keywords:
  薄底靴: 灰袍人/供奉步法
  脚跟不着地: 灰袍人/供奉步法
  养元丹: 沈渊礼认识养元丹
  别问: 沈渊礼的秘密
  供奉: 供奉与灰袍人关联
  灰袍: 灰袍人身份

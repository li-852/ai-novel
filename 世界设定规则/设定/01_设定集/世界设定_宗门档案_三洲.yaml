# 世界设定 - 三洲宗门档案
# 由 世界设定_宗门档案.yaml 拆分

  # ───────── 三洲 ─────────

  归泉宗:
    王朝: 归泉文廷
    关系: 合作
    境界层级: 二流
    宗主: 泉映月
    宗主境界: 道种
    哲学: 泉中有道，丹中有天
    特色: 丹道传承、上古丹方复原、疗愈丹剂炼制
    文化: 宗内弟子以研习丹道为修行，入门须在归泉中阅览上古丹方三日。泉映月泉水般沉静，说话前总要停顿三息，仿佛在等回音。宗内与天陨阁丹阁共建丹道传承堂
    规模: 弟子约五百人，长老四人
    关系详情: 与归泉文廷共建丹道传承堂，共同复原濒危丹方

  暗渊宗:
    王朝: 潜影守廷
    关系: 合作
    境界层级: 二流
    宗主: 影无踪
    宗主境界: 道种
    哲学: 影中藏道，暗中护明
    特色: 隐匿探查术、远距离侦察、秘境守护
    文化: 宗内弟子以隐匿为修行，入门须在永暗裂隙中独处七日。影无踪来去无踪，连本宗弟子都不知道他什么时候在宗门里。宗内与潜影守廷联合组建秘境巡查队
    规模: 弟子约四百人，长老三人
    关系详情: 与潜影守廷联合组建秘境巡查队伍，共享秘境守护成果

  星陨宗:
    王朝: 星锻古朝
    关系: 合作
    境界层级: 二流
    宗主: 锻星河
    宗主境界: 道种
    哲学: 星落为器，器成利民
    特色: 星陨锻造术、法器铸造、城防机关制造
    文化: 宗内弟子以锻造为修行，入门须以陨星矿独立锻成一件器物。锻星河打铁时哼小曲，锤子落点刚好卡在节拍上。宗内与星锻古朝共建器道研习坊
    规模: 弟子约四百五十人，长老三人
    关系详情: 与星锻古朝共建器道研习坊，共同复原古法锻造工艺

  归墟宗:
    王朝: 无（三洲交界，独立宗门）
    关系: 独立
    境界层级: 一流
    宗主: 燃灯
    宗主境界: 开天
    哲学: 来者不问，传承不可断，不留亦不强留
    特色: 散修庇护、传承接引、古法修复
    文化: 三大铁律——来者不问出身、传承不可断、不留亦不强留
    规模: 弟子约八百人（多为散修暂居），无固定长老
    关系详情: 详见 tianyun_continents.归墟宗（完整设定含宗主介绍、铁律细则、与三洲附属势力关系、秘密外交暗线）

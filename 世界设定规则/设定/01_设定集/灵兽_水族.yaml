# 灵兽妖兽体系 - 水族类

灵兽等级:
  幼年期:
    境界范围: 蜕凡~铭纹
    寿命: 150-1000年
    特征: 灵智初开，依赖本能，体型较小
  成年期:
    境界范围: 凝真~神藏
    寿命: 2000-5000年
    特征: 灵智成熟，可建立契约，战力稳定
  壮年期:
    境界范围: 道种~燃灯
    寿命: 10000-17000年
    特征: 血脉觉醒，可统御同族，战力巅峰
  老年期:
    境界范围: 燃灯（后）
    寿命: 17000-25000年
    特征: 灵智极高，可化形，战力衰退但智慧超群


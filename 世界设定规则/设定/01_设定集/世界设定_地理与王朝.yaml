# 军事编制与境界对应
军事层级:
  说明: 多国边境时有摩擦，以下为通用编制标准。各国大同小异，差异体现在装备和功法传承上
  边境冲突:
    频率: 常态化，小规模摩擦每月数起，大规模冲突数年一次
    性质: 多为渊脉资源点争夺、商路控制权、边境村庄归属
    升级: 百人队级摩擦→千人队级对峙→万人队级战争（罕见，需王朝层面批准）
  军衔:
    - 军衔: 百人队长
      境界要求: 蜕凡初期
      备注: 有官身，领朝廷俸禄，是军队最基层的渊者骨干
      月薪: 约20-30渊石（由王朝发放）
      典型年龄: 25-40岁
    - 军衔: 千人队长
      境界要求: 蜕凡中及以上
      备注: 统辖一营，独立执行边境巡逻和小型作战任务
      月薪: 约50-80渊石
      典型年龄: 40-60岁
    - 军衔: 万人队长
      境界要求: 铭纹初期或即将进入铭纹
      备注: 统辖一军，可独当一面镇守边境要塞
      月薪: 约150-300渊石
      典型年龄: 60-100岁
    - 军衔: 十万人统帅
      境界要求: 铭纹中后
      备注: 统辖方面军，镇守一方边境或战略要地
      月薪: 约500-800渊石
      典型年龄: 100-200岁
    - 军衔: 大将军
      境界要求: 凝真初期
      备注: 统辖一国之兵，战时最高军事指挥
      月薪: 约1000-2000渊石
      典型年龄: 200-500岁
    - 军衔: 总将军
      境界要求: 神藏初期
      备注: 全国军事最高长官，仅王朝受到重大威胁时才亲自出手
      月薪: 约3000-5000渊石
      典型年龄: 500岁以上
  征兵:
    来源: 凡人参军为义务制，渊者参军为招募制（丰厚俸禄+渊石供给+功法赏赐）
    留任: 渊者军人服役满二十年可获"军勋渊印"标记，兑换渊石时享受更低抽水（最低可至0.5%）
  装备:
    标准配发: 凡人士兵配发铁制兵器+皮甲；蜕凡队长配发一品法器+灵铜甲
    精锐: 千人队长以上配发二品法器，万人队长以上配发三品法器
    特殊: 大将军以上法器由王朝特供，品阶不固定

# 商队护卫等级
商队:
  - 规模: 小型商队
    货物价值: 通常100大纹以下
    护卫: 武力较高的凡人压队，人数2-5人
    典型路线: 本城到邻城（百里以内）
    风险: 低，主要防小股流寇和野兽
  - 规模: 中型商队
    货物价值: 100-1000大纹
    护卫: 1-2名蜕凡低阶渊者压队，另有凡人护卫5-10人
    典型路线: 跨城（数百里）
    风险: 中等，可能遭遇蜕凡境散修劫匪
  - 规模: 大型商队
    货物价值: 1000大纹以上（含渊石、高阶丹药法器等）
    护卫: 约3名蜕凡高阶或铭纹初期渊者压队，另有蜕凡低阶护卫5-10人（不固定，根据货物价值调整）
    典型路线: 跨域或跨大陆
    风险: 高，需应对劫匪团伙和灵兽袭击
护卫费用:
    参考: 散修护送百里约5-10渊石（蜕凡），20-30渊石（铭纹）
    谈判: 视路线凶险程度、货物价值、预计行程天数而定
商队规则:
    - 商队挂靠渊坊或大商会可获"商旗"标识，劫匪忌惮背后势力不敢轻易动手
    - 跨域商队需在沿途渊坊办理"过境凭证"，缴纳过境税
    - 商队遭遇渊者劫匪时，凡人护卫基本无用，核心依赖渊者压队

# 城铺与拍卖体系
城铺体系:
  结构: 每个大城设一间大铺（通常为该城最大商号或宗门产业），对应势力辖下小城设分铺
  拍卖:
    位置: 仅大铺设有拍卖场所
    频率: 大城每月一场，重大节日加场
    物品: 三品以上丹药、三品以上法器、珍稀灵药、极品渊石、上古残卷、秘境入场资格等
    规则:
      - 入场需缴纳保证金（按拍品底价10%），竞拍不中全额退还
      - 成交后抽取5-10%佣金
      - 匿名竞拍（面具或编号制），保护买家身份
      - 拍品由大铺鉴定师估价，卖家可设定底价，低于底价流拍
    规模: 大城拍卖场可容纳200-500人，顶级拍卖（如王朝级）可超千人
  铺位层级:
    - 层级: 大铺
      位置: 大城（朝都、重镇）
      特点: 拍卖场、高级鉴定师、渊石结算、渊坊过账
      典型库存: 三品以下丹药法器常备，三品以上定期拍卖
    - 层级: 分铺
      位置: 中小城镇
      特点: 普通交易、小额渊石结算
      典型库存: 二品以下丹药法器常备，高阶品需向大铺调货
    - 层级: 坊市摊位
      位置: 各城坊市
      特点: 散修自产自销、地摊交易
      典型库存: 一品以下丹药、灵药原材料、渊烬

# 十倍体质设定
十倍体质:
  名称: 十倍体质
  描述: 先天体质，修炼速度为常人十倍（仅限修炼速度，肉身强度和悟性不享受十倍增幅）
  来源: 沈家是无矩强者后裔，十倍体质为无矩强者传承血脉的稀薄觉醒，需上古本源印记同时激活才显性
  优势:
    - 修炼速度十倍（仅此一项）
  劣势:
    - 天罚强度1-2倍（境界突破时触发，六品及以上丹药成型时触发）
    - 体质特殊，易被觊觎（血脉检测可能暴露）
  隐藏: true  # 必须隐藏，否则招来杀身之祸
  伪装能力:
    - 潜龙诀可隐藏：气息、境界、渊能波动
    - 潜龙诀不能隐藏：血脉检测、本源印记

# 境界序列：蜕凡 → 铭纹 → 凝真 → 神藏 → 道种 → 燃灯 → 开天 → 掌道 → 源初 → 无矩
# SSOT：战力倍率、寿命等核心数值的唯一权威源为核心数值表.yaml
# 本文件中的倍率/寿命为冗余副本，仅作本地描述参考，如有冲突以核心数值表.yaml为准
# 本文件独有字段：本质、战斗特征、失败代价、突破代价（描述性数据，非核心数值）
境界对照:
  - 境界: 蜕凡
    序号: I
    子境界: [初, 中, 后]  # 映射：1-3层=初，4-6层=中，7-9层=后
    战力倍率: 1
    寿命: 500  # 自然老死，因战争算计平均350
    本质: 纯粹肉身潜能激活，无超凡能量溢出
    战斗特征: 单臂掷象，拳碎千斤巨石。凡人军队的顶点，可正面击溃百人精锐
    失败代价: 经脉永久性破损，彻底断绝修炼之路
    突破代价: 经脉爆燃之痛——突破瞬间全身经脉如烈火灼烧，持续七日七夜，期间无法移动，意志崩溃者当场疯癫

  - 境界: 铭纹
    序号: II
    子境界: [初, 中, 后]
    战力倍率: 10
    寿命: 2000  # 自然老死，因战争算计平均1500
    本质: 接引远古神魔残魂为图腾，铭刻于本源印记
    战斗特征: 体质、速度、力量十倍增幅。皮肤可抵御普通刀剑，全力冲刺可踏水而行三十丈
    失败代价: 神智被残魂抹除，沦为只懂杀戮的"活死人"
    突破代价: 夺舍拉锯——铭刻过程中，残魂发起一次完整夺舍冲击。渊者必须在识海中亲手"杀死"残魂。弑魂者终生携带该残魂的濒死诅咒印记

  - 境界: 凝真
    序号: III
    子境界: [初, 中, 后]
    战力倍率: 100
    寿命: 6000
    本质: 能量外放，具象化图腾虚影进行远程攻击
    战斗特征: 图腾虚影实体化攻击，范围百丈。本源印记威压可令下位者战力减损三成。全力一击可摧毁小型城门
    失败代价: 本源印记逆流，五脏六腑被自身能量震成齑粉
    突破代价: 图腾暴走——首次显化时，图腾虚影拥有自主攻击意识，会无差别攻击方圆百丈内一切活物，直至能量耗尽。渊者本人是第一个目标

  - 境界: 神藏
    序号: IV
    子境界: [初, 中, 后]
    战力倍率: 1000
    寿命: 15000
    本质: 肉身局部异化，实现神魔化生理结构改变
    战斗特征: 异化部位硬度堪比陨铁，拳罡可外放十丈。全力状态下肉眼仅能捕捉残影。可正面承受凝真境全力一击而毫发无伤
    失败代价: 人性彻底磨灭，理智崩盘，退化为无意识的凶兽
    突破代价: 器官排异——异化部位在第一个月内，每晚自主激活并反噬其他正常器官，如同体内植入一头饥饿野兽。需以意志压制，撑过三十天完成融合

  - 境界: 道种
    序号: V
    子境界: [初, 中, 后]
    战力倍率: 10000
    寿命: 30000
    本质: 本源印记精粹内部坍缩，凝聚唯一"本命图腾"
    战斗特征: 本命图腾加持下，可引动天地异象。战力是神藏境的十倍。一人可镇一宗，全力交战可改变方圆数里地形。具备开宗立派的最低资格
    失败代价: 命魂破碎，战力永久封顶，无法再进寸步
    突破代价: 旧我之死——本命图腾凝聚瞬间，渊者此前所有记忆、情感、执念被一次性"审判"。不符合自身之"道"的部分将被强制剥离

  - 境界: 燃灯
    序号: VI
    子境界: [初, 中, 后]
    战力倍率: 100000
    寿命: 50000
    本质: 以本命图腾为燃料，点燃生命本源之火
    战斗特征: 神力灌注下，道种境在其面前如婴孩。全力一击可削平小山头。可建立百年宗门
    失败代价: 自身化为永世不灭的"诅咒火域"，千里内生灵灭绝
    突破代价: 燃魂千年——神火种下的瞬间，以渊者剩余寿命为初始燃料。每燃烧一年寿元，可换一日神力。此后需依赖恢复类丹药补充体力与伤势，否则神火倒转吞噬渊者自身

  - 境界: 开天
    序号: VII
    子境界: [初, 中, 后]
    战力倍率: 1000000
    寿命: 80000
    本质: 规则具现，以神火开辟临时神国领域
    战斗特征: 神国领域内战力翻倍，可短暂改写领域内物理规则。领域外战力约为燃灯境的十倍（法则感悟仍在，但失去神国加持）。领域维持时间：前期半盏茶，巅峰一个时辰。全力对撞可夷平城镇。可建立千年宗门
    失败代价: 神国坍塌，自身法则被主世界消化吸收，彻底消失
    突破代价: 神国问心——神国初辟时，渊者必须直面本我。内心深处的执念、恐惧、欲望将化为实体，渊者必须斩断心魔，突破自我，否则被心魔吞噬

  - 境界: 掌道
    序号: VIII
    子境界: [初, 中, 后]
    战力倍率: 10000000
    寿命: 100000  # 自然老死
    本质: 掌控完整权柄，铭刻法则于世界本源
    战斗特征: 完全掌控一条法则，可永久性改写局部规则。不再依赖神国，随手一击蕴含法则之力。全力出手可永久改变百里地貌。可建立万古宗门
    失败代价: 权柄被世界回收，永囚于法则缝隙，世人遗忘其存在
    突破代价: 法则反噬——权柄铭刻成功的那一刻，渊者必须直面法则之力的反噬。法则之力会冲击渊者的神魂与肉身，若无法承受则修为尽废

  - 境界: 源初
    序号: IX
    子境界: [初, 中, 后]
    战力倍率: 100000000
    寿命: 129600  # 取自"一元之数"（邵雍《皇极经世》：1元=129600年）
    本质: 本源印记根源，自身演化为族群文明之母
    战斗特征: 可创造简易生命，自身本源印记可污染或强化一个区域千年。全力一击可蒸发大湖、断开山脉。本体仍可被同境或复数掌道境威胁
    失败代价: 本体陨落，导致整个族群文明出现断层与连锁崩坏
    突破代价: 族群枷锁——成为族群源头的瞬间，该族群所有个体此后的每一次非正常死亡，渊者都将以第一人称视角完整经历。自然老死不触发感知；每次感知后有三日麻木缓冲期。渊者可通过意志力逐步提升承受阈值，但无法完全屏蔽。族群不灭，折磨不止

  - 境界: 无矩
    序号: X
    子境界: []
    战力倍率: 1000000000
    寿命: ∞
    本质: 超越时空与因果，因果物理抹除——天道免疫系统无法定位，非"天道认可"
    战斗特征: 可短暂无视某条世界规则，但每次规避规则都会积累"因果反噬"，超过阈值将触发"梦醒"进程。常态战力与掌道境相当，全力状态下可做出"不可能之事"
    失败代价: 被世界法则从过去到未来彻底删除，不留任何痕迹
    突破代价: 永世囚笼——抵达无矩的瞬间，渊者看到世界的真相：一切皆为某个更高存在的梦。此后永生无法确认自己是否真实存在。每次动用禁忌之力，都在加速"梦醒"的进程
    特殊规则: 屏蔽天机代价——每万年需要沉睡5千年
    沉睡结局锚点:
      机制: 每万年沉睡5000年期间，主角的化身（或留下的一丝潜意识）仍能以普通人身份游历世间
      化身特征: 无修为、无记忆、仅有本能和性格碎片
      游历目的: 体验凡人生活，积累"人性锚点"，防止长期沉睡导致本源异化
      续作铺路: 化身在游历中可能触发新的故事线，为续作留下伏笔
      唤醒条件: 外部重大事件（如族群灭绝危机）或化身自身积累的"人性锚点"达到阈值
    知晓程度:
      公开: 传说级，民间仅知"曾有人抵达无矩"，是否有前中后期之分无人知晓。民间说法称此人"被天道抓取"，真相未知——是死亡还是被天道抓取，本身是悬念
      确认者:
        - 三大宗门现任宗主（根据宗门密档）
        - 三大宗门镇宗老祖（根据宗门密档）
        - 梧栖国国王老祖（暗中收集三宗情报推断确认）
      亲历者:
        人物: 天陨阁即将陨落的源初后老祖（战力最高）
        详情: 幼年时期（约50岁，初入蜕凡）曾被无矩强者指引入门。如今源初后寿元将尽，是当世唯一亲眼见过此人的人
      真相: 「已故」是民间误传，无矩强者只是留下了部分意识
      剧情钩子: 主角遇到这位老祖时，老祖将探查无矩强者留下的意识（后期剧情）
      备注: 自三宗分裂前的初代宗主之后，再无人达到此境界

# 伪装境界规则
伪装规则:
  - 主角使用潜龙诀压制气息，伪装成远低于真实境界的渊者
  - 伪装幅度：
    - 入门：压制30%跨度（如铭纹中期→铭纹初期附近）
    - 小成：压制60%跨度（如铭纹后期→铭纹初期附近）
    - 大成：压制90%跨度（如凝真后期→铭纹后期附近）
  - 第1卷末参考：真实蜕凡后，伪装蜕凡中（配合芥子坠可再微调）
  - 原则：非生死关头绝不暴露真实实力
  - 暴露后必须消灭所有目击者或编造合理解释

世界规则:
  魔法体系: "渊能波动受天道监管，高境界威压会自动引发安全风控"

# 宗门体系
宗门体系:
  # --- 顶层 ---
  宗主: 1人，统摄全宗

  # --- 镇宗老祖 ---
  镇宗老祖:
    小宗门: 无
    中等宗门: 3人
    玄天宗: 6人
    炽天宗: 6人
    天陨阁: 10人

  # --- 两阁 ---
  # 注：长老阁的"炼丹堂"是宗门层面的丹药管理机构，其内部细分为采药堂、炼丹堂（内部）、丹方堂、鉴丹堂、传承堂五堂（详见 炼丹体系.md）
  # 同理，长老阁的"炼器堂"内部细分为采矿堂、炼器堂（内部）、铭纹堂、鉴器堂、传承堂五堂（详见 法器体系.md）
  长老阁:
    描述: 宗门核心战力与传承，下设四堂。每堂设阁主1人（宗门长老）、副阁主1-3人（副长老），统管堂内事务
    堂:
      - 姓名: 修炼堂
        重点: 炼体、练法等基础修炼指导
      - 姓名: 炼丹堂
        重点: 丹药炼制（内部五堂详见 炼丹体系.md）
      - 姓名: 炼器堂
        重点: 法器炼制（内部五堂详见 法器体系.md）
      - 姓名: 御兽堂
        重点: 灵兽驯养与契约
    各堂规模:
      修炼堂: 阁主1人+副阁主1-3人，核心弟子20-30人
      炼丹堂: 阁主1人+副阁主1-3人，核心弟子10-15人（详见 炼丹体系.md）
      炼器堂: 阁主1人+副阁主1-3人，核心弟子10-15人（详见 法器体系.md）
      御兽堂: 阁主1人+副阁主1-2人，核心弟子5-10人（仅灵螟壤域相关宗门设此堂）
    核心弟子选拔: 内门弟子达到神藏境 + 完成独立任务 + 两名长老推荐，方可进入长老阁某堂

  执事堂:
    描述: 宗门运转与秩序管理
    职能:
      - 新生接引（招收弟子）
      - 入阁接引（晋升长老阁各堂）
      - 比接引（组织宗门大比、对外赛事）
      - 规则（宗规制定与执行）
      - 奖赏惩罚（功过记录、赏罚发放）
    规模:
      三大宗门: 执事约50-80人，堂主1人，副堂主1-2人
      王朝宗门: 执事约10-20人，堂主1人
    选拔规则: 外门弟子达到凝真境 + 完成50次基础任务 + 宗规默写考核通过

  # --- 弟子晋升 ---
  弟子晋升:
    普通弟子: 入门即为普通弟子
    晋升路径: 普通弟子 → 通过考核 → 进入长老阁某堂成为核心弟子
    各堂考核:
      修炼堂: 境界考核 + 实战演练，达到凝真境可入堂
      炼丹堂: 辨识灵药 + 独立炼丹考核（详见 炼丹体系.md）
      炼器堂: 辨识矿石 + 独立炼器考核（详见 法器体系.md）
      御兽堂: 灵兽契约 + 驯化考核（仅灵螟壤域相关宗门）

  # --- 资源配给 ---
  # 具体数额详见 货币体系.md"宗门弟子月例"表
  资源分配:
    普通弟子: 基础渊石配给
    核心弟子: 更多渊石 + 堂内资源
    长老: 丰厚供给

# 丹药设定
丹药体系:
  # 万寿丹
  万寿丹:
    名称: 万寿丹
    品阶: 九品（顶级）
    效果: 增加寿命
    使用上限: 3次
    递减:
      - 第1次：+10000年
      - 第2次：+7000年
      - 第3次：+3000年
    备注: 主角对三宗承诺的核心筹码

# 主角与烛阴大陆接触点设计
# 详细设定见 势力补充.md
主角烛阴接触点:
  陵渊守廷:
    接触方式: 主角以炼丹师身份受雇炼制城防丹药，与岩渊宗产生商业合作
    时机: 炽天宗执事堂副堂主阶段
    叙事钩子: 主角的丹道水平震惊岩渊宗长老，但必须控制暴露程度
  赤藤灵廷:
    接触方式: 主角受伤后流落赤藤灵廷境内，被灵藤疗愈体系救治
    时机: 逃离某次危机后
    叙事钩子: 赤藤灵廷的疗愈能力为主角提供恢复支持，但灵藤共生体系可能发现主角体质异常
  灵螟壤域:
    接触方式: 主角执行炽天宗任务时被派往协调御兽宗的灵兽调配
    时机: 炽天宗执事堂副堂主阶段
    叙事钩子: 灵螟壤域的御兽体系为主角提供新的战斗手段
  玄缄古廷:
    接触方式: 主角在炽天宗期间接触到缄石封藏的上古秘闻，发现与身世有关的线索
    时机: 中后期
    叙事钩子: 缄石封藏中可能有关于十倍体质和上古本源印记的记载

# 中间层级势力
# 详细设定见 势力补充.md
中间势力:
  渊散盟:
    类型: 散修联盟
    性质: 松散自治组织，无固定总部，各地散修自发结盟互助
    规模: 各城堂口约两百余处，无固定成员名册
    接触阶段: 散修阶段
  四海商会:
    类型: 跨大陆贸易巨头
    性质: 控制六成以上远洋商路，总舵设于沧汐王朝深海琉璃城
    规模: 约三千人，四大分舵，远洋商船百余艘
    接触阶段: 中期
  渊汇通:
    类型: 大宗交易中介
    性质: 专注于大宗渊石交易撮合，总号设于渊脉联盟总部附近
    规模: 约八百人，分号三十余处
    接触阶段: 后期
  天机阁:
    类型: 情报贩子网络
    性质: 以飞鸟传讯为核心的情报贩子网络，出售各类非核心情报
    规模: 约五百情报贩子，覆盖二陆三洲主要城市
    接触阶段: 全程
  无常楼:
    类型: 暗杀组织
    性质: 接单杀人的暗杀组织，不问缘由，不问目标身份，只看价格
    规模: 估计百余杀手，金牌不超过五人
    接触阶段: 特殊剧情


# 世界设定 - 地理与王朝
# 由 世界设定.yaml 拆分

# 世界设定
# 货币体系（渊能本位制）详见 货币体系.md

世界:
  名称: 二陆三洲
  超大陆:
    - 名称: 曦烛超大陆
      说明: 曦和大陆与烛阴大陆同处一个超级大板块，领土全面接壤，无海洋阻隔
      地脉差异:
        曦和: 地脉温和，多森林湖泊
        烛阴: 地脉狂暴，多荒漠火山
      边境奇观: 阴阳割昏晓——边境一侧青翠草地，一步之遥另一侧赤红焦土
      边境生态:
        - 兽潮平推：烛阴凶兽遭遇渊能枯竭或极端气候时，直接平推进入曦和
        - 边荒集市：漫长边界线滋生三不管地带，由掩体和废弃要塞组成的散修黑市
  大陆:
    - 名称: 曦和大陆
      位置: 东
      统治者: 玄天宗
      区域: [南域, 北域, 中域, 东域, 西域]  # 内部区域划分
    - 名称: 烛阴大陆
      位置: 西偏南
      统治者: 炽天宗
    - 名称: 不死洲
      位置: 北偏西（三洲之南）
      统治者: 天陨阁
    - 名称: 无间洲
      位置: 北偏西（三洲之北）
      统治者: 天陨阁
    - 名称: 铸星洲
      位置: 北偏西（三洲之东）
      统治者: 天陨阁
  # 主角起始位置：曦和大陆西境，临近烛阴大陆，沧阴裂渊附近荒山脚下

  # --- 曦和大陆势力 ---
  曦和王朝:

    曦曜神朝:
      大陆: 曦和大陆
      政体: 神权帝制——最高权力由神授血脉的世袭君主掌控，统治权与宗教信仰、律法深度绑定，君主兼具世俗领袖与精神象征双重身份。民众笃信君主为太阳神金乌嫡系后裔，法令自带神旨公信力，无需强硬镇压便能维系秩序。圣火为神权具象，庇佑疆土民生。继位时须在太阳圣火前割掌立誓，圣火若拒绝灼烧其血，则视为神意不认可，不得继位。历史上曾有三位候选人被圣火拒绝，终身不得踏入神殿
      统治者: 姬昭明
      统治者境界: 开天境
      隐藏老祖:  # 王朝老祖（隐藏，外界不知）
        - 名称: 姬日照
          境界: 掌道初期
          备注: 曦曜初代皇祖，圣火本源觉醒者，已隐世三千年
        - 名称: 姬耀
          境界: 开天后
          备注: 上代神皇，退位后隐入圣火神殿深处
        - 名称: 炎曦
          境界: 开天后
          备注: 圣火祭司始祖，守护圣火本源不灭
      哲学: 圣火调候，执律赈济
      文化: 以太阳圣火为核心图腾，盛行法典诵读与圣火祭祀。贵族与平民皆以恪守公义、帮扶弱小为最高德行，骑士文化浓厚，重荣誉而轻私利
      职责: 执掌大陆公义裁决与四方赈济；圣火可净化瘴气、调和气候；日冕骑士巡疆防灾、援助受困部族，维系全域秩序平稳
      战力: 常规凝真 / 顶级道种
      外貌: 炎阳遗民，因世代受圣火洗礼，发色多为赤金或深褐，瞳色偏琥珀金。部分血脉纯正者在情绪激昂时瞳孔会浮现微弱的金乌虚影，被视为圣火眷顾之兆
      宗门关系:
        扶持:
          - 金乌宗（宗主炎昼，男，开天境）——圣火血脉同源，神朝提供资源与庇护
        合作:
          - 律法宗（宗主钟离衡，男，道种）——为神朝提供律法仲裁与典籍编纂
        同域独立:
          - 烈阳宗（宗主阳破晓，男，凝真）——独立运作，与神朝无隶属关系
          - 炙息宗（宗主赤霞子，女，凝真）——专研圣火余烬疗愈之术，行走各城义诊

    炎铸王庭:
      大陆: 曦和大陆
      政体: 匠王共治——两位掌权者地位平等、分工明确，锻王掌制造生产，战王掌防务防灾，重大事务必须共同商议决策，单方无权独断。候选人各须独立锻造一件"镇邦器"，由全庭工匠投票评判，胜者掌权——锻王候选铸民生器，战王候选铸防御器，以器论才，不看血统
      统治者: 墨焱
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 墨熔
          境界: 掌道初期
          备注: 炎铸开国锻王，地火本源掌控者，沉睡于火山核心
        - 名称: 霍断岳
          境界: 开天后
          备注: 初代战王，以肉身镇压过火山喷发
        - 名称: 铁骨老人
          境界: 开天后
          备注: 王庭最古老的锻师，已铸器万年不辍
      战王: 霍燃
      战王境界: 开天境
      战王性格: 刚猛豪烈，以铁血手腕统领军务，与锻王墨焱性格互补——一个造物，一个守疆
      哲学: 地火锻器，治御岩灾
      文化: 工匠与武士双轨并行，地位平等。每年举办火山锻器大会与武备演练，以技艺精湛、防护得力为荣，重实干、轻浮华
      职责: 依托火山地火打造农用器械、城防护甲、远航构件，无偿支援周边国度建设；善用火脉之力消融山崩、疏导熔岩灾害
      战力: 常规凝真 / 顶级道种
      外貌: 炎铸族人因常年在地火环境中劳作，肤色偏铜红，手掌粗糙厚实，手臂多有火纹烙印。锻王血脉者体温天生高于常人，可徒手握持高温锻件而毫发无伤
      宗门关系:
        扶持:
          - 炎铸宗（宗主铁棠，男，开天境）——地火锻器技艺同源，王庭提供矿脉与火源
        同域独立:
          - 火山宗（宗主熔不归，男，道种）——独立运作，与王庭无隶属关系
          - 耐火宗（宗主陶不裂，男，凝真）——专研耐火材料与窑炉建造，服务周边村镇

    梧栖国:
      大陆: 曦和大陆
      政体: 鸾后垂帘——女性君主靠血脉世袭掌权，治理风格温和怀柔，以礼仪、文化和精神感召力维系秩序，是民众的精神领袖与秩序维护者。鸾后驾崩后，浮空凤巢百禽齐鸣七日，最终落在哪位皇女肩上即为新任鸾后；若百禽不选，则由凤鸣宗宗主代行摄政，直至天命降临
      统治者: 苏云韶（鸾后）
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 苏鸣岐
          境界: 掌道初期
          备注: 梧栖开国鸾后，凤鸣本源觉醒者，居于浮空凤巢最深处
        - 名称: 羽归真
          境界: 开天后
          备注: 凤鸣宗初代宗主，与百禽共寿，已活九千年
        - 名称: 律天音
          境界: 开天后
          备注: 乐律之道登峰造极，一曲可令万物生灵臣服
      哲学: 百禽传讯，乐律宁心
      文化: 全民通晓基础乐律，盛行羽衣乐舞与百禽朝奉仪式；以平和待人、调解纷争为处世准则，是大陆公认的礼仪之邦
      职责: 以浮空凤巢为都，族人通晓百禽言语，飞鸟构成全域情报与预警网；音律可调和心绪、安抚生灵，国土是各族休憩通商、调解矛盾的平和之地
      情报能力: |
        梧栖国是二陆三洲公认的情报最强势力。
        百禽传讯体系覆盖全域——飞鸟不仅是传讯工具，更是移动的情报节点，鸾后血脉可感知百禽所见所闻，实时掌握各地动向。
        情报网络分三层：
        1. 外层——散布各城坊市的百禽耳目，收集公开动向与民间传闻
        2. 中层——驻扎各王朝边境的传讯鸟站，监控势力调动与军事动向
        3. 内层——鸾后亲领的凤鸣暗卫，专司核心机密与高层情报
        各王朝、宗门均默认梧栖国的情报能力，重大事务往往主动通报以示善意。
      战力: 常规凝真 / 顶级道种
      外貌: 梧栖族人发色多为青黑或月白，体态轻盈，嗓音天然悦耳，传说鸾后血脉者啼鸣时可令百鸟朝凤。族人普遍长寿，百岁者容貌仍如中年
      宗门关系:
        合作:
          - 凤鸣宗（宗主羽清商，女，开天境）——鸾后继位需凤鸣宗宗主见证，双方深度协作
        同域独立:
          - 百禽宗（宗主羽千啼，女，道种）——独立运作，与梧栖国无隶属关系
          - 和音宗（宗主律无弦，男，凝真）——独立运作，与梧栖国无隶属关系
          - 栖霞宗（宗主云织锦，女，凝真）——专研羽衣织造与云霞染色，为各族制衣

    云垂剑庭:
      大陆: 曦和大陆
      政体: 剑尊共议——七座浮岛各有一位剑道造诣最高的剑尊，七人地位平等，重大事务集体表决。表决时七位剑尊同时释放剑意，剑意相合者自动结盟，以剑意共鸣强度定胜负，非简单多数票；剑意相斥则视为否决。此机制确保决策必须获得真正的心意相通，而非利益妥协
      统治者: 顾云铮
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 顾无锋
          境界: 掌道初期
          备注: 云垂开国剑尊，七峰剑道创始人，剑意已臻化境
        - 名称: 剑十三
          境界: 开天后
          备注: 第十三代首席剑尊，一生只出过一剑，一剑斩断天灾风暴
        - 名称: 匣中仙
          境界: 开天后
          备注: 剑道隐修，居于剑峰地底剑冢，与万剑共眠
      哲学: 驭剑护道，阵御天祸
      文化: 奉行"剑为护道之器，非杀伐之兵"的准则。七峰剑尊共治，盛行论道比剑、游学护道之风，剑士以游历四方、化解纷争为修行
      职责: 以七座浮空剑峰为根基，剑气可分流云雾、隔断山洪；七峰联动大阵能阻隔天灾风暴，门下剑士游走各地化解族群纷争
      战力: 常规凝真 / 顶级道种
      外貌: 云垂剑士并无统一血统特征，但长期修剑者瞳孔会逐渐浮现剑纹，剑道造诣越深剑纹越完整。七峰剑尊的剑纹各有形态，对应七峰剑道流派
      宗门关系:
        深度绑定:
          - 七峰剑宗（七位剑尊共治，有男有女，开天境）——七峰即七岛，剑尊即统治者，宗门与王朝一体两面
        同域独立:
          - 游剑宗（宗主浪无痕，男，道种）——独立运作，与剑庭无隶属关系
          - 剑鞘宗（宗主匣中鸣，男，凝真）——专研剑鞘铸造与剑气封存，游走四方接活

    苍桢祖庭:
      大陆: 曦和大陆
      政体: 地尊共议——多位地尊集体执掌，以地脉亲和度与治理贡献定地位，不搞世袭，重大事务共同决策，能者居上。首席地尊候选人须赤足立于祖庭中央灵脉节点，地脉自行选择亲和度最高者；其余地尊由首席提名、灵脉复核确认
      统治者: 姜苍垣
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 厚土
          境界: 掌道初期
          备注: 苍桢开国地尊，地脉本源觉醒者，身躯已与大地融为一体
        - 名称: 姜磐
          境界: 开天后
          备注: 上代首席地尊，以一己之力稳固过大陆板块位移
        - 名称: 石心
          境界: 开天后
          备注: 地脉隐修，居于地底灵脉交汇处，万年不出世
      哲学: 地脉固疆，沃土安民
      文化: 以大地灵脉为核心图腾，盛行地脉祭祀与沃土养护文化。全民皆懂基础地脉感知与土地养护知识，奉行资源均分、共生共荣的准则
      职责: 依托贯通千里的大地灵脉立国，可操控地层稳固山川、滋养沃土；构筑大范围地脉防护屏障抵御地动、地裂灾害，统筹大陆土地开发与资源均分
      战力: 常规凝真 / 顶级道种
      外貌: 苍桢族人因世代与地脉共生，瞳孔呈深褐或墨绿色，双足赤足踏地时可感知浅层地脉流动。地尊级别者身躯部分部位出现晶化纹理，被视为地脉认可的象征
      宗门关系:
        合作:
          - 灵枢宗（宗主玄壤，男，开天境）——地脉技术互补，联合开发灵脉资源
        同域独立:
          - 地听宗（宗主谷回声，男，道种）——独立运作，与祖庭无隶属关系
          - 木栖宗（宗主林无涯，男，凝真）——专研灵木培植与树屋建造，守护边陲林地

    沧汐王朝:
      大陆: 曦和大陆
      政体: 鲛皇世袭——最高权力由鲛皇家族血脉传承，君主拥有完整实权，同时掌控水系力量与海洋贸易规则制定权。继承人须在深海渊涡中独自生存七日，以鲛皇血脉共鸣海潮；若无法引发潮汐共鸣，则丧失继承资格，由旁系递补
      统治者: 洛汐澜
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 洛深渊
          境界: 掌道初期
          备注: 沧汐开国鲛皇，海渊本源觉醒者，居于深海琉璃城最底层
        - 名称: 汐无涯
          境界: 开天后
          备注: 海域守护者，可平息万里海啸，已守护海域七千年
        - 名称: 鲛月
          境界: 开天后
          备注: 鲛人族最年长者，记忆着沧汐建国前的海底秘辛
      哲学: 潮汐牧海，护航济民
      文化: 依潮汐节律规划民生与祭祀，盛行牧鲸驯鳌、深海采珠技艺。奉行公平通商、庇护商旅的准则，以守护海域安宁为核心
      职责: 以深海琉璃城为根基，驾驭巨鲸、玄鳌搭建海上通路；掌控水系力量平息海啸，搭建海上驿站庇护远洋商旅与近海渔族
      战力: 常规凝真 / 顶级道种
      外貌: 沧汐鲛人耳后有鳃裂，指间有半透明蹼膜，瞳色为深海蓝或珍珠白。鲛皇血脉者可在深海中自由呼吸且无视水压，尾鳍化腿后蹼膜可完全收回，在陆地上与常人无异
      宗门关系:
        扶持:
          - 潮音宗（宗主汐九渊，男，开天境）——水系力量同源，王朝提供海域管辖权
        合作:
          - 海商宗（宗主潮生财，男，道种）——为王朝管理远洋贸易与海上商路
        同域独立:
          - 航标宗（宗主灯不灭，男，凝真）——专研海上航标与灯塔建造，守护偏远航道

  # --- 烛阴大陆势力 ---
  烛阴王朝:

    陵渊守廷:
      大陆: 烛阴大陆
      政体: 岩尊世袭——岩尊家族世袭统治，君主同时是岩层塑形、地脉导流技艺的最高嫡系传承人，权力与核心工艺深度绑定。继位者须闭目触摸祖庭核心岩壁，岩壁若渗出暖流则认可，若渗出寒流则拒绝；被寒流拒绝者终身不得踏入祖庭，由旁系递补
      统治者: 韩陵川
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 韩磐石
          境界: 掌道初期
          备注: 陵渊开国岩尊，岩层本源觉醒者，肉身已岩化万年不朽
        - 名称: 石不开
          境界: 开天后
          备注: 地底最深处的守岩人，守护岩脉核心已逾八千年
        - 名称: 渊底
          境界: 开天后
          备注: 居于岩渊最深处，据说已触碰到地心本源
      哲学: 岩渊筑造，固山御灾
      文化: 以岩层筑造与地质守护为核心，盛行岩层塑形、地脉导流技艺。每年举办岩造技艺交流与地质防灾研讨大会，以稳固山川、构筑安居屏障为最高德行，崇尚务实坚韧，重技艺传承、轻浮华享乐
      职责: 盘踞巨型层叠岩渊疆域，精通岩层塑形与地脉疏导之术，可引导岩层走势塑造山体、构筑巨型石城与防风岩堤，抵御山崩、地裂、风沙等地质灾害；擅长开辟地下宜居空间与加固大型工事地基，为周边国度提供地质防护与大型建造支持，不断改造烛阴大陆的恶劣岩地环境，拓展宜居疆域
      战力: 常规凝真 / 顶级道种
      外貌: 陵渊族人因常年在地下岩层中作业，体型敦实，肩背宽厚，肤色呈灰白或浅褐。岩尊血脉者双手可感知岩层纹理，闭目触摸石壁即能判断地层结构与矿脉走向
      宗门关系:
        扶持:
          - 岩渊宗（宗主石砚，男，开天境）——岩层塑形技艺同源，守廷提供岩脉资源
        合作:
          - 地脉宗（宗主石听泉，男，道种）——地脉导流技术互补，联合勘测地质
        同域独立:
          - 深窟宗（宗主穴无光，男，凝真）——独立运作，与守廷无隶属关系
          - 石乳宗（宗主滴水婆婆，女，凝真）——专研石钟乳灵液采集与疗伤药剂，居于深洞
          - 石刻宗（宗主刻石翁，男，道种）——专研岩层篆刻与碑文传承，为各族记录族谱
          - 矿脉宗（宗主掘地叟，男，道种）——专研矿脉勘测与伴生矿分辨，行走各地寻矿

    赤藤灵廷:
      大陆: 烛阴大陆
      政体: 藤爵合议——数位藤爵共同执掌，藤爵靠灵藤培育与疗愈技艺的造诣选拔，不世袭，集体决策，权力与灵藤共生能力绑定。表决时各藤爵同时催动共生灵藤，藤蔓生长方向即为投票方向；若藤蔓纠缠不休则视为搁置。藤姥姥的灵藤拥有最终解释权
      统治者: 楚赤薇
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 藤祖
          境界: 掌道初期
          备注: 赤藤开国始祖，灵藤本源觉醒者，肉身已与千年灵藤融为一体
        - 名称: 楚蔓
          境界: 开天后
          备注: 上代藤爵之首，灵藤疗愈之道登峰造极，一藤可续命千年
        - 名称: 绿影
          境界: 开天后
          备注: 灵藤隐修，居于赤藤灵廷最深处的千年藤林中
      哲学: 灵藤疗愈，改良瘠土
      文化: 以灵藤共生与草木疗愈为核心，全民通晓基础灵藤培育与伤痛疗愈知识；奉行互助帮扶准则，以疗愈生灵、滋养水土为核心文化
      职责: 赤灵藤缠绕黑石筑城，灵藤汁液可调和伤痛、滋养水土；藤蔓可编织防护屏障与跨谷吊桥，专门改良贫瘠土地，并向周边输送疗愈灵材
      战力: 常规凝真 / 顶级道种
      外貌: 赤藤族人小臂上多缠有一条活体灵藤，自出生起便与之共生，灵藤随主人年岁增长而延伸。藤爵级别的共生者，灵藤已融入血脉，受伤时藤蔓可自行分泌汁液封合伤口
      宗门关系:
        深度绑定:
          - 灵藤宗（宗主藤姥姥，女，开天境）——藤爵即宗门长老，灵藤共生体系一体两面
        同域独立:
          - 草木宗（宗主药生香，女，道种）——独立运作，与灵廷无隶属关系
          - 织藤宗（宗主经纬娘，女，凝真）——专研灵藤纤维纺织与藤甲编制，手艺闻名诸国
          - 灵药宗（宗主百草仙，女，道种）——专研灵草炮制与药性配伍，为各族调配药剂

    灵螟壤域:
      大陆: 烛阴大陆东侧偏南，与曦和大陆接壤
      地理特征: 没有海，只有河流
      政体: 御尊世袭——中央集权世袭王朝，御尊为全疆域最强御兽师，御兽体系由王庭统一调度。民间非王庭许可不得豢养、携带灵兽，城区与聚居地严格执行"兽不入城"律令，确保民生安定。继位者须在王庭兽魂殿中与上古兽魂建立契约，兽魂若拒绝则下一位候选人递补；谢灵衍的兽魂是上古玄蟒，已传承七代
      统治者: 谢灵衍
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 谢兽神
          境界: 掌道初期
          备注: 灵螟开国御尊，万兽本源觉醒者，可与天地万兽心灵相通
        - 名称: 廉太古
          境界: 开天后
          备注: 最古老的御兽师，统御着一支上古凶兽军团
        - 名称: 蟒魂
          境界: 开天后
          备注: 与上古玄蟒共生八千年，蟒魂已融入其本源印记
      哲学: 御兽冠世，化荒为田
      文化: 以官方御兽体系与壤地养护为核心，崇尚秩序管控，奉行"御兽守土、兽不扰民"。每年举办王庭御兽大典选拔人才入仕。民间重农耕与地力养护，御兽知识仅限王庭体系内传承，普通民众极少接触灵兽
      职责: 拥有大陆最成熟完善的官方御兽体系，综合实力在烛阴大陆诸王朝中最弱，但比小宗门强，可统御多品类灵兽协同执行地脉勘测、荒壤改良、灾患预警、地质灾害治理等复杂任务，已将大片荒芜冻土改造为高产良田。严格执行"兽不入城"律令，王庭灵兽入城也需报备走专属通道。持续优化灵兽培育与契约体系，贴合炽天宗"进化优先"的发展理念
      战力: 常规凝真 / 顶级道种
      外貌: 灵螟族人瞳孔呈竖瞳状，为御兽契约留下的永久印记，竖瞳颜色随契约灵兽的品类而变化。御尊血脉者天生能与灵兽建立心灵链接，无需结契即可感知兽群情绪与动向
      宗门关系:
        扶持:
          - 御兽宗（宗主廉狩，男，开天境）——官方御兽体系核心，王庭提供兽源与契约资源
        合作:
          - 壤地宗（宗主土生金，男，道种）——荒壤改良技术互补，联合治理冻土
        同域独立:
          - 兽语宗（宗主吠无声，男，凝真）——独立运作，与壤域无隶属关系
          - 牧野宗（宗主风吹草，男，凝真）——专研荒野灵草放牧与兽群迁徙引导，散居草原
          - 驯兽宗（宗主铁笼生，男，道种）——专研灵兽行为矫正与野性驯化，为民间处理失控灵兽
          - 虫语宗（宗主鸣蛩子，男，道种）——专研灵虫培育与虫群协作，擅长以虫群勘测地底

    玄缄古廷:
      大陆: 烛阴大陆
      政体: 缄石长老会——资深缄石长老集体掌权，凭封藏技艺、学识资历、古法修复造诣选拔，不世袭，决策风格严谨稳重，兼顾传承守护与从古法中推演新思路。重大决策时长老会共同在缄石上篆刻议题，缄石自行显现纹路走向，纹路即为"石意"；长老会解读石意做出最终裁决。叶缄尘是当代最擅解读石纹者
      统治者: 叶缄尘
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 叶封
          境界: 掌道初期
          备注: 玄缄开国缄石长老，封藏本源觉醒者，已将自身封存于玄石棺中万年
        - 名称: 石中书
          境界: 开天后
          备注: 缄石密室群最初的建造者，记忆着万年来封藏的所有秘辛
        - 名称: 墨石
          境界: 开天后
          备注: 石纹篆刻始祖，指尖石纹可覆盖整座山脉
      哲学: 玄石藏典，镇固灾源
      文化: 以石质封藏技艺与典籍守护为核心，盛行古籍修纂、古物封存、石纹篆刻技艺。每年举办藏典雅集与古法传承交流大会，以守护濒危传承、活化古法技艺为最高追求，崇尚严谨沉淀，重传承内核、轻外在形式
      职责: 以层叠玄岩构筑的缄石密室群为核心都邑，精通石质封藏之术，可将古籍卷宗、珍稀物料封存于特制玄石匣与石室之中，隔绝岁月侵蚀、千年无损。可篆刻石纹阵加固崩裂山体、镇封异动地脉，遏制地质灾害扩散。收纳濒临失传的古法技艺，整理修复后向各族开放传承，同时为各方提供古物封存、灾源镇护的技术支持
      战力: 常规凝真 / 顶级道种
      外貌: 玄缄族人十指指尖有天然的石纹印痕，印痕越繁复者石质封藏技艺越精深。长老级别的缄石师指尖石纹可延伸至手腕，触碰石壁时纹路可自行篆刻封印阵法
      宗门关系:
        深度绑定:
          - 缄石宗（宗主由长老会轮值担任，开天境）——长老会即宗门核心，封藏技艺一体两面
        同域独立:
          - 石纹宗（宗主石纹生，男，道种）——独立运作，与古廷无隶属关系
          - 印刻宗（宗主朱砂引，男，凝真）——专研石印篆刻与封蜡技艺，为商旅刻印鉴
          - 墨痕宗（宗主砚无声，男，道种）——专研石墨调制与拓印技艺，为各族拓印碑文古籍


# 世界设定 - 烛阴大陆宗门档案
# 由 世界设定_宗门档案.yaml 拆分

  # ───────── 烛阴大陆 ─────────

  岩渊宗:
    王朝: 陵渊守廷
    关系: 扶持
    境界层级: 一流
    宗主: 石砚
    宗主境界: 开天
    哲学: 岩为骨，渊为脉，筑造即修行
    特色: 岩层塑形术、巨型石城建造、地脉导流
    文化: 弟子入门须以双手塑岩三日，方可感知岩层纹理。宗内设"千岩殿"，殿内岩壁记载历代岩尊塑形心得。石砚可闭目引导岩层走势，塑造山体
    规模: 弟子约两千人，长老九人
    关系详情: 陵渊守廷提供岩脉资源，岩渊宗为守廷构筑石城与防风岩堤

  地脉宗:
    王朝: 陵渊守廷
    关系: 合作
    境界层级: 二流
    宗主: 石听泉
    宗主境界: 道种
    哲学: 地脉有声，唯静者闻
    特色: 地脉勘测、矿脉定位、地底水流追踪
    文化: 弟子以感知地脉为修行，常趴在地上以耳贴地。石听泉总说"地脉在说话"，别人听不到，他却频频点头回应。宗内设有"地脉沙盘"，可模拟地下百里地质结构
    规模: 弟子约四百五十人，长老三人
    关系详情: 与陵渊守廷地脉导流技术互补，联合勘测地质

  石刻宗:
    王朝: 陵渊守廷
    关系: 同域独立
    境界层级: 二流
    宗主: 刻石翁
    宗主境界: 道种
    哲学: 石上千秋，刀下万世
    特色: 岩层篆刻、碑文传承、石质鉴定
    文化: 宗内弟子以篆刻为修行，每日刻石两个时辰。刻石翁老眼昏花但下刀精准，刻完总要摸三遍才满意。宗内藏有上古碑林，记载烛阴大陆万年历史
    规模: 弟子约三百五十人，长老二人
    关系详情: 独立运作，为各族刻录族谱与重大事件碑文

  矿脉宗:
    王朝: 陵渊守廷
    关系: 同域独立
    境界层级: 二流
    宗主: 掘地叟
    宗主境界: 道种
    哲学: 地下有宝，唯掘者得
    特色: 矿脉勘测、伴生矿分辨、矿洞加固术
    文化: 弟子常年在地底行走，以寻找矿脉为修行。掘地叟走路总低着头看地，跟人说话眼神也往地下飘。宗内设有"矿样阁"，收藏烛阴大陆所有已知矿石标本
    规模: 弟子约三百人，长老二人
    关系详情: 独立运作，矿脉宗的勘测成果常被陵渊守廷采购

  深窟宗:
    王朝: 陵渊守廷
    关系: 同域独立
    境界层级: 三流
    宗主: 穴无光
    宗主境界: 凝真
    哲学: 深渊无光，心自明澈
    特色: 地底生存术、暗视修炼、洞穴探险
    文化: 宗内弟子常年居住在地底深窟中，从不见阳光。穴无光在地下住了三十年，皮肤白到透明，见到阳光就打喷嚏。宗内最深处的洞穴已探至地下三千丈
    规模: 弟子约两百人，无长老
    关系详情: 独立运作，深窟宗常为陵渊守廷探查地下空间

  石乳宗:
    王朝: 陵渊守廷
    关系: 同域独立
    境界层级: 三流
    宗主: 滴水婆婆
    宗主境界: 凝真
    哲学: 滴水穿石，乳润万物
    特色: 石钟乳灵液采集、疗伤药剂炼制、地下水脉养护
    文化: 宗内弟子居于深洞之中，以采集石钟乳灵液为修行。滴水婆婆老态龙钟但记性极好，能记住每一滴石乳的产地。宗内最珍贵的"千年石乳"可续命百载
    规模: 弟子约一百五十人，无长老
    关系详情: 独立运作，石乳宗的疗伤药剂在烛阴大陆颇有名气

  灵藤宗:
    王朝: 赤藤灵廷
    关系: 深度绑定
    境界层级: 一流
    宗主: 藤姥姥
    宗主境界: 开天
    哲学: 藤即我身，我即藤魂
    特色: 灵藤共生术、藤蔓操控、灵藤汁液疗愈
    文化: 弟子入门须与一条灵藤建立共生关系，终生不离。藤爵即宗门长老，灵藤共生体系一体两面。藤姥姥的灵藤已活千年，可自行攻击入侵者
    规模: 弟子约一千五百人，藤爵长老六人
    关系详情: 藤爵即宗门长老，灵藤共生体系一体两面，宗门与王朝不可分割

  草木宗:
    王朝: 赤藤灵廷
    关系: 同域独立
    境界层级: 二流
    宗主: 药生香
    宗主境界: 道种
    哲学: 一草一木皆有灵
    特色: 灵草辨识、草木疗愈、药圃管理
    文化: 宗内弟子以培育灵草为修行，每人管理一片药圃。药生香浑身散发着草药香，走到哪里都有蝴蝶跟着。宗内药圃占地千亩，种植三百余种灵草
    规模: 弟子约五百人，长老三人
    关系详情: 独立运作，草木宗的灵草常被赤藤灵廷采购

  灵药宗:
    王朝: 赤藤灵廷
    关系: 同域独立
    境界层级: 二流
    宗主: 百草仙
    宗主境界: 道种
    哲学: 百草为药，对症为王
    特色: 灵草炮制、药性配伍、药剂炼制
    文化: 宗内弟子以炮制灵草为修行，须熟记三百种灵草药性。百草仙随身携带百种灵草，闻一口便知药性年份。宗内设有"百草谱"，记载烛阴大陆所有已知灵草
    规模: 弟子约四百人，长老三人
    关系详情: 独立运作，灵药宗的药剂配方常被赤藤灵廷引用

  织藤宗:
    王朝: 赤藤灵廷
    关系: 同域独立
    境界层级: 三流
    宗主: 经纬娘
    宗主境界: 凝真
    哲学: 千丝万缕，织就天衣
    特色: 灵藤纤维纺织、藤甲编制、防护织物炼制
    文化: 宗内弟子以织造为修行，每日织布两个时辰。经纬娘手指翻飞织不停，话都在织布声里了。宗内出品的藤甲轻便坚韧，是赤藤灵廷的特产
    规模: 弟子约一百二十人，无长老
    关系详情: 独立运作，织藤宗的藤甲在烛阴大陆颇受欢迎

  御兽宗:
    王朝: 灵螟壤域
    关系: 扶持
    境界层级: 一流
    宗主: 廉狩
    宗主境界: 开天
    哲学: 万兽听令，御者为尊
    特色: 灵兽契约术、兽群统御、灵兽培育
    文化: 弟子入门须与一头灵兽建立契约，方可正式拜师。宗内设"万兽园"，豢养数百种灵兽。廉狩可同时统御百头灵兽协同作战，是烛阴大陆最强御兽师
    规模: 弟子约一千八百人，长老八人
    关系详情: 灵螟壤域官方御兽体系核心，王庭提供兽源与契约资源

  壤地宗:
    王朝: 灵螟壤域
    关系: 合作
    境界层级: 二流
    宗主: 土生金
    宗主境界: 道种
    哲学: 壤中有金，深耕可得
    特色: 荒壤改良、地力养护、冻土治理
    文化: 宗内弟子以改良土地为修行，每人须独立改良一亩荒地方可出师。土生金双手粗糙如树皮，随手一抓就能判断土壤肥力。宗内设有"壤样堂"，收藏各地土壤标本
    规模: 弟子约四百人，长老三人
    关系详情: 与灵螟壤域荒壤改良技术互补，联合治理冻土

  驯兽宗:
    王朝: 灵螟壤域
    关系: 同域独立
    境界层级: 二流
    宗主: 铁笼生
    宗主境界: 道种
    哲学: 驯而不服，不如不驯
    特色: 灵兽行为矫正、野性驯化、失控灵兽处理
    文化: 宗内弟子以驯化灵兽为修行，每人须独立驯化十头灵兽方可出师。铁笼生浑身伤疤全是灵兽抓的，笑着说"这是学费"。宗内设有"驯兽场"，专门处理各地失控灵兽
    规模: 弟子约三百五十人，长老二人
    关系详情: 独立运作，驯兽宗常被灵螟壤域民间求助处理失控灵兽

  兽语宗:
    王朝: 灵螟壤域
    关系: 同域独立
    境界层级: 三流
    宗主: 吠无声
    宗主境界: 凝真
    哲学: 万兽有言，唯心可译
    特色: 灵兽语言翻译、兽群情绪感知、灵兽行为预判
    文化: 宗内弟子以与灵兽交流为修行，入门须闭口三月，只以手势与灵兽沟通。吠无声能与灵兽无声交流，自己反而几乎不说话，用手势比划
    规模: 弟子约一百八十人，无长老
    关系详情: 独立运作，兽语宗的翻译服务常被各方势力借用

  牧野宗:
    王朝: 灵螟壤域
    关系: 同域独立
    境界层级: 三流
    宗主: 风吹草
    宗主境界: 凝真
    哲学: 逐水草而居，随兽群而行
    特色: 荒野灵草放牧、兽群迁徙引导、草原养护
    文化: 宗内弟子散居草原，跟随兽群迁徙，居无定所。风吹草跟着兽群走，想找他得先找到兽群迁徙的方向。宗内没有固定山门，以兽群驻留地为临时营地
    规模: 弟子约一百人，无长老
    关系详情: 独立运作，牧野宗的兽群迁徙信息常被灵螟壤域王庭参考

  虫语宗:
    王朝: 灵螟壤域
    关系: 同域独立
    境界层级: 二流
    宗主: 鸣蛩子
    宗主境界: 道种
    哲学: 虫虽微小，合力通天
    特色: 灵虫培育、虫群协作、地底勘测
    文化: 宗内弟子以培育灵虫为修行，入门须与一只灵虫建立感应。鸣蛩子袖子里永远藏着几只虫，跟虫说话比跟人话多。宗内设有"虫房"，培育三百余种灵虫
    规模: 弟子约三百人，长老二人
    关系详情: 独立运作，虫语宗的虫群勘测能力常被灵螟壤域王庭借用

  缄石宗:
    王朝: 玄缄古廷
    关系: 深度绑定
    境界层级: 一流
    宗主: 长老会轮值
    宗主境界: 开天
    哲学: 石缄万言，不朽不灭
    特色: 石质封藏术、古籍修纂、石纹阵法
    文化: 长老会即宗门核心，封藏技艺一体两面。弟子入门须在缄石上篆刻入门誓言，誓言千年不灭。宗内设"缄石密室群"，封存上古典籍与珍稀物料，千年无损
    规模: 弟子约一千二百人，缄石长老九人
    关系详情: 长老会即宗门核心，封藏技艺一体两面，宗门与王朝不可分割

  石纹宗:
    王朝: 玄缄古廷
    关系: 同域独立
    境界层级: 二流
    宗主: 石纹生
    宗主境界: 道种
    哲学: 纹中有道，刻中见心
    特色: 石纹篆刻、纹路解读、石质鉴别
    文化: 宗内弟子以篆刻石纹为修行，每日刻石两个时辰。石纹生十指布满石纹刻痕，闲下来就忍不住在石头上篆刻。宗内藏有上古石纹碑，据传记载着某种失传的功法
    规模: 弟子约三百五十人，长老二人
    关系详情: 独立运作，石纹宗的篆刻技艺常被玄缄古廷采购

  印刻宗:
    王朝: 玄缄古廷
    关系: 同域独立
    境界层级: 三流
    宗主: 朱砂引
    宗主境界: 凝真
    哲学: 一印千钧，落印无悔
    特色: 石印篆刻、封蜡技艺、印鉴鉴定
    文化: 宗内弟子以篆刻印鉴为修行，入门须刻成百枚印鉴方可出师。朱砂引爱惜印章胜过爱惜自己，手上永远沾着朱砂色。宗内设有"印鉴殿"，收藏历代名印
    规模: 弟子约一百二十人，无长老
    关系详情: 独立运作，为商旅刻印鉴，收取微薄报酬

  墨痕宗:
    王朝: 玄缄古廷
    关系: 同域独立
    境界层级: 二流
    宗主: 砚无声
    宗主境界: 道种
    哲学: 墨落石上，千年不褪
    特色: 石墨调制、拓印技艺、碑文修复
    文化: 宗内弟子以拓印碑文为修行，入门须拓印百通碑文方可出师。砚无声研墨时极其专注，天塌了也不抬头。宗内藏有上古拓片三万卷，是烛阴大陆最完整的碑文档案
    规模: 弟子约三百人，长老二人
    关系详情: 独立运作，为各族拓印碑文古籍，收取微薄报酬

# 灵兽妖兽体系 - 飞禽类

灵兽等级:
  幼年期:
    境界范围: 蜕凡~铭纹
    寿命: 150-1000年
    特征: 灵智初开，依赖本能，体型较小
  成年期:
    境界范围: 凝真~神藏
    寿命: 2000-5000年
    特征: 灵智成熟，可建立契约，战力稳定
  壮年期:
    境界范围: 道种~燃灯
    寿命: 10000-17000年
    特征: 血脉觉醒，可统御同族，战力巅峰
  老年期:
    境界范围: 燃灯（后）
    寿命: 17000-25000年
    特征: 灵智极高，可化形，战力衰退但智慧超群

灵兽:

  # ───────── 飞禽类（60种）─────────

  # --- 常见飞禽（51种）---
  - 名称: 赤羽鸦
    别名: 火鸦、传讯鸦
    类型: 飞禽
    稀有度: 常见
    寿命: {幼年: 30-50年, 成年: 50-150年, 壮年: 150-300年, 老年: 300-500年}
    体型: {幼年: 六寸(20cm), 成年: 一尺二(40cm), 壮年: 一尺半(50cm), 老年: 近两尺(60cm)}
    翼展: 约二尺半
    外貌: "通体赤红羽毛，羽毛边缘泛微光，喙短而尖呈黑色，爪锋利如钩，尾羽三根呈火焰状"
    习性: "群居，每群百只以上，昼行夜栖，善辨方向，以灵虫为食，繁殖力强，每年可产卵2-3次"
    能力: {主要: 传讯、辨方向, 辅助: 小范围引燃（仅限枯枝落叶）, 特殊: 群鸦齐鸣时可预警危险}
    契约: {推荐: 阵法契约, 忠诚度: 中等, 驯化难度: 低}
    栖息地: {地理: 曦和大陆南域丘陵地带, 环境: 偏好温暖湿润，常见于村落附近}
    经济价值: {价格: 成年约50渊石, 用途: 传讯、预警、观赏}
    备注: "梧栖国常用传讯鸟，群居习性使其成为天然预警网，百禽宗有专门的赤羽鸦培育基地"


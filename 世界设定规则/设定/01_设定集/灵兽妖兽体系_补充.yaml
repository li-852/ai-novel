# 灵兽妖兽体系补充设定

# ============================================================
# 一、凶兽体系
# ============================================================

凶兽体系:
  # 凶兽等级划分
  凶兽等级:
    幼年期:
      境界范围: 蜕凡~铭纹
      寿命: 30-150年
      特征: 灵智极低，只有本能，攻击性强
    成年期:
      境界范围: 凝真~神藏
      寿命: 150-1500年
      特征: 灵智低下，无法沟通，破坏力强
    壮年期:
      境界范围: 道种~燃灯
      寿命: 1500-6000年
      特征: 血脉混乱，战力波动大，极危险
    老年期:
      境界范围: 燃灯（后）
      寿命: 6000-12000年
      特征: 灵智略有提升，但仍无法契约

  # 凶兽与灵兽区别
  凶兽与灵兽:
    灵智:
      灵兽: 灵智开化，可沟通
      凶兽: 灵智极低或无，只有本能
    契约:
      灵兽: 可建立契约
      凶兽: 不可契约，只有临时驯化（成功率极低）
    血脉:
      灵兽: 有血脉传承，可进化
      凶兽: 血脉混乱，无法稳定进化
    来源:
      灵兽: 培育繁殖为主
      凶兽: 秘境变异、上古残留、环境污染
    价值:
      灵兽: 战斗、辅助、经济
      凶兽: 无直接价值，只有材料
    战力:
      灵兽: 同境界稳定
      凶兽: 同境界波动大，有时极强
    数量:
      灵兽: 稳定，可繁衍
      凶兽: 稀少，无法稳定繁衍
    攻击性:
      灵兽: 可控制
      凶兽: 极强，无法控制

  # 凶兽来源
  凶兽来源:
    秘境变异:
      比例: 60%
      描述: 试炼秘境、上古遗迹中的灵兽因环境变异
    上古残留:
      比例: 25%
      描述: 上古时代遗留的凶兽，血脉混乱
    环境污染:
      比例: 10%
      描述: 因灵脉污染、天灾等环境因素变异
    人为制造:
      比例: 5%
      描述: 因禁忌功法、实验等人为因素制造

  # 凶兽种类（15种）
  凶兽类型:
    - 名称: 九首鸩
      境界: 燃灯
      特征: 剧毒，不可契约
      稀有度: 传说
      栖息地: 曦和大陆深山老林
      外貌: 通体紫黑色，九个头颅，每个头颅都有剧毒
      能力: 剧毒（毒液可腐蚀灵器）、释放毒雾（范围千丈）
      危险等级: 极高
      备注: 见之即逃，不可力敌

    - 名称: 墨蛟
      境界: 燃灯
      特征: 上古血脉，战力强
      稀有度: 传说
      栖息地: 曦和大陆深水
      外貌: 通体漆黑，鳞片坚硬如甲，头有双角
      能力: 上古血脉、释放黑光（范围百丈）、缠绕型
      危险等级: 极高
      备注: 上古凶兽，极难对付

    - 名称: 噬灵兽
      境界: 道种
      特征: 吞噬渊能，极危险
      稀有度: 罕见
      栖息地: 灵脉丰富地底
      外貌: 通体漆黑，体型巨大，可吞噬渊能
      能力: 吞噬渊能（范围一丈）、危险
      危险等级: 高
      备注: 可吞噬渊能，极危险

    - 名称: 狂暴熊
      境界: 神藏
      特征: 狂暴化，攻击性强
      稀有度: 稀有
      栖息地: 各域山地森林
      外貌: 通体灰黑色，体型巨大，狂暴化后眼睛发红
      能力: 狂暴化（攻击力翻倍）、肉身坚硬
      危险等级: 中高
      备注: 狂暴化后极难控制

    - 名称: 嗜血狼
      境界: 凝真
      特征: 嗜血，群居
      稀有度: 常见
      栖息地: 各域森林
      外貌: 通体灰白色，眼睛发红，嗜血成性
      能力: 嗜血（攻击力随吸血量提升）、群居
      危险等级: 中
      备注: 群居型凶兽，数量多时极危险

    - 名称: 毒蛛
      境界: 凝真
      特征: 剧毒，暗杀型
      稀有度: 常见
      栖息地: 各域阴暗处
      外貌: 通体漆黑，八条腿，可释放毒丝
      能力: 剧毒（毒液可腐蚀灵器）、暗杀型
      危险等级: 中
      备注: 暗杀型凶兽，夜间极危险

    - 名称: 石魔
      境界: 神藏
      特征: 肉身坚硬，防御强
      稀有度: 稀有
      栖息地: 各域山地
      外貌: 通体灰黑色，由岩石构成，肉身坚硬如甲
      能力: 肉身坚硬（可抵御灵器攻击）、防御强
      危险等级: 中高
      备注: 防御型凶兽，极难击杀

    - 名称: 幽魂蝶
      境界: 凝真
      特征: 幻术，迷惑型
      稀有度: 常见
      栖息地: 各域阴暗处
      外貌: 通体半透明，翅膀泛幽光，可释放幻术
      能力: 幻术（可迷惑敌人）、迷惑型
      危险等级: 中
      备注: 幻术型凶兽，可迷惑敌人

    - 名称: 骨蛇
      境界: 凝真
      特征: 剧毒，缠绕型
      稀有度: 常见
      栖息地: 各域地底
      外貌: 通体白色，由骨骼构成，可释放毒液
      能力: 剧毒（毒液可腐蚀灵器）、缠绕型
      危险等级: 中
      备注: 缠绕型凶兽，极难挣脱

    - 名称: 血蝙蝠
      境界: 凝真
      特征: 吸血，群居
      稀有度: 常见
      栖息地: 各域洞穴
      外貌: 通体漆黑，翅膀宽大，可吸血
      能力: 吸血（可吸取敌人精血）、群居
      危险等级: 中
      备注: 群居型凶兽，数量多时极危险

    - 名称: 腐尸虫
      境界: 蜕凡
      特征: 腐蚀，群居
      稀有度: 常见
      栖息地: 各域地底
      外貌: 通体灰绿色，体型微小，可腐蚀灵物
      能力: 腐蚀（可腐蚀灵物）、群居
      危险等级: 低
      备注: 群居型凶兽，数量多时有威胁

    - 名称: 暗影豹
      境界: 凝真
      特征: 暗杀型，夜行
      稀有度: 常见
      栖息地: 各域密林
      外貌: 通体漆黑，可在黑暗中隐藏气息
      能力: 暗杀型、夜行、隐藏气息
      危险等级: 中
      备注: 暗杀型凶兽，夜间极危险

    - 名称: 烈焰兽
      境界: 神藏
      特征: 释放火系渊能，攻击性强
      稀有度: 稀有
      栖息地: 火山地带
      外貌: 通体赤红色，可释放火系渊能
      能力: 释放火系渊能（范围十丈）、攻击性强
      危险等级: 中高
      备注: 火山地带的危险凶兽

    - 名称: 寒冰兽
      境界: 神藏
      特征: 耐寒，攻击性强
      稀有度: 稀有
      栖息地: 雪原地带
      外貌: 通体雪白，耐寒，攻击性强
      能力: 耐寒、攻击性强
      危险等级: 中高
      备注: 雪原地带的危险凶兽

    - 名称: 雷电兽
      境界: 神藏
      特征: 释放雷系渊能，攻击性强
      稀有度: 稀有
      栖息地: 雷电频发地带
      外貌: 通体灰白色，可释放雷系渊能
      能力: 释放雷系渊能（范围十丈）、攻击性强
      危险等级: 中高
      备注: 雷电频发地带的危险凶兽

# ============================================================
# 二、灵兽来源说明
# ============================================================

灵兽来源:
  # 来源比例
  来源比例:
    培育繁殖:
      比例: 70%
      描述: 灵兽养殖场、宗门灵兽园、世家培育
    野生捕获:
      比例: 25%
      描述: 荒野、山脉、海域，需要驯化
    秘境产出:
      比例: 5%
      描述: 试炼秘境、上古遗迹，品质最高但极危险

  # 培育繁殖详细说明
  繁殖详情:
    灵兽养殖场:
      描述: 专业培育灵兽，品质稳定
      规模: 各域灵兽市场
      品质: 稳定
      价格: 中等
    宗门灵兽园:
      描述: 宗门内部培育，品质较高
      规模: 御兽宗、百禽宗
      品质: 较高
      价格: 较高
    世家培育:
      描述: 世家传承培育，品质极高
      规模: 各域世家
      品质: 极高
      价格: 极高
    野生繁殖:
      描述: 野生灵兽自然繁殖，品质不稳定
      规模: 各域荒野
      品质: 不稳定
      价格: 较低

  # 野生捕获详细说明
  野外捕捉详情:
    低难度:
      描述: 常见灵兽，易驯化
      成功率: 80%
      示例: 赤羽鸦、银翎鸽
    中难度:
      描述: 稀有灵兽，需技巧
      成功率: 50%
      示例: 玄铁鹰、青羽鹤
    高难度:
      描述: 罕见灵兽，需耐心
      成功率: 20%
      示例: 雷翼鹏、岩甲龟
    极高难度:
      描述: 传说灵兽，极难驯化
      成功率: 5%
      示例: 金翅鹏、九首鸩

  # 秘境产出详细说明
  秘境详情:
    试炼秘境:
      描述: 宗门试炼场所
      品质: 较高
      示例: 焚天渊、进化谷
    上古遗迹:
      描述: 上古时代遗留
      品质: 极高
      示例: 各域上古遗迹
    天然秘境:
      描述: 天然形成的秘境
      品质: 较高
      示例: 各域天然秘境
    人工秘境:
      描述: 人工开辟的秘境
      品质: 一般
      示例: 各域人工秘境

# ============================================================
# 三、契约规则详细说明
# ============================================================

契约规则:
  # 契约类型
  契约类型:
    阵法契约:
      描述: 以阵法为媒，建立主从关系
      优势: 稳固，灵兽难以反抗
      劣势: 灵兽忠诚度低，战力受限
      适用场景: 宗门批量契约，战兽
    通灵契约:
      描述: 以通灵功法建立心灵链接
      优势: 灵兽忠诚度高，战力全开
      劣势: 需要特殊功法，门槛高
      适用场景: 御兽宗，世家传承
    血契:
      描述: 以精血为媒，建立生命共享
      优势: 最稳固，可共享感知
      劣势: 渊者寿元受损，灵兽死亡渊者重伤
      适用场景: 生死相托，极少数情况
    平等契约:
      描述: 双方自愿，无主从关系
      优势: 灵兽完全配合
      劣势: 无法强制灵兽，依赖感情
      适用场景: 灵智极高的灵兽

  # 阵法契约详细规则
  阵法契约规则:
    基础契约阵:
      描述: 最基础的契约阵法
      要求: 低级灵石，简单阵图
      成功率: 90%
      适用灵兽: 常见灵兽
    中级契约阵:
      描述: 中等难度的契约阵法
      要求: 中级灵石，复杂阵图
      成功率: 70%
      适用灵兽: 稀有灵兽
    高级契约阵:
      描述: 高难度的契约阵法
      要求: 高级灵石，精密阵图
      成功率: 50%
      适用灵兽: 罕见灵兽
    顶级契约阵:
      描述: 最高难度的契约阵法
      要求: 顶级灵石，上古阵图
      成功率: 30%
      适用灵兽: 传说灵兽

  # 通灵契约详细规则
  灵兽契约规则:
    基础通灵术:
      描述: 最基础的通灵功法
      要求: 凝真境，基础功法
      成功率: 80%
      适用灵兽: 常见灵兽
    中级通灵术:
      描述: 中等难度的通灵功法
      要求: 神藏境，中级功法
      成功率: 60%
      适用灵兽: 稀有灵兽
    高级通灵术:
      描述: 高难度的通灵功法
      要求: 道种境，高级功法
      成功率: 40%
      适用灵兽: 罕见灵兽
    顶级通灵术:
      描述: 最高难度的通灵功法
      要求: 燃灯境，上古功法
      成功率: 20%
      适用灵兽: 传说灵兽

  # 血契详细规则
  血契规则:
    寿元损耗:
      描述: 渊者寿元损耗10%
      限制: 灵兽死亡渊者重伤
      适用场景: 生死相托
    精血损耗:
      描述: 渊者精血损耗20%
      限制: 灵兽死亡渊者重伤
      适用场景: 生死相托
    渊能损耗:
      描述: 渊者渊能损耗30%
      限制: 灵兽死亡渊者重伤
      适用场景: 生死相托

  # 平等契约详细规则
  平等契约规则:
    灵智要求:
      描述: 灵兽灵智达到一定水平
      限制: 无法强制灵兽
      适用场景: 灵智极高的灵兽
    自愿要求:
      描述: 灵兽自愿契约
      限制: 依赖感情
      适用场景: 灵智极高的灵兽
    信任要求:
      描述: 双方建立信任
      限制: 无法强制灵兽
      适用场景: 灵智极高的灵兽

  # 契约数量限制
  契约数量限制:
    蜕凡:
      最大: 1
      描述: 基础契约能力
    铭纹:
      最大: 2
      描述: 契约能力提升
    凝真:
      最大: 3
      描述: 契约能力提升
    神藏:
      最大: 5
      描述: 契约能力提升
    道种:
      最大: 8
      描述: 契约能力提升
    燃灯:
      最大: 12
      描述: 契约能力提升
    开天:
      最大: 20
      描述: 契约能力提升
    掌道:
      最大: 30
      描述: 契约能力提升
    源初:
      最大: 50
      描述: 契约能力提升
    无矩:
      最大: 无限制
      描述: 契约能力极致

# ============================================================
# 四、寿命与境界对应调整
# ============================================================

寿命境界对照:
  幼年期:
    境界范围: 蜕凡~铭纹
    渊者寿命: 500~2000年
    灵兽寿命: 150~1000年
    比率: 1/3
    描述: 灵兽寿命约为渊者1/3
  成年期:
    境界范围: 凝真~神藏
    渊者寿命: 6000~15000年
    灵兽寿命: 2000~5000年
    比率: 1/3
    描述: 灵兽寿命约为渊者1/3
  壮年期:
    境界范围: 道种~燃灯
    渊者寿命: 30000~50000年
    灵兽寿命: 10000~17000年
    比率: 1/3
    描述: 灵兽寿命约为渊者1/3
  老年期:
    境界范围: 燃灯（后）
    渊者寿命: 50000年
    灵兽寿命: 17000~25000年
    比率: 1/2
    描述: 灵兽寿命约为渊者1/2
    机制解释: |
      灵兽进入老年期后，血脉活性降低，进入【蛰伏龟息态】。
      在此状态下，灵兽新陈代谢大幅减缓，生命活动降至最低，
      从而延长了相对寿元比率。这是灵兽独特的生存策略，
      与渊者的修炼体系不同，属于生物学层面的适应机制。

# 五、元素分类修正

元素分类修正:
  规则:
    - '灵兽能力统一使用"可释放火系渊能"或"可释放雷系渊能"'
    - '与宗门功法和秘境体系保持一致，消除文本撕裂'

# 六、稀有度比例调整

稀有度调整:
  原始比例:
    常见: 80%
    稀有: 10.7%
    罕见: 4.7%
    传说: 4.7%

  目标比例:
    常见: 80%
    稀有: 10%
    罕见: 7%
    传说: 3%

  调整方案:
    飞禽类:
      - 减少1种传说（金翅鹏改为罕见）
      - 增加1种罕见（新增一种罕见飞禽）
    走兽类:
      - 减少1种传说（银鬃狼改为罕见）
      - 增加2种罕见（新增两种罕见走兽）
    水族类:
      - 保持不变
    虫类:
      - 保持不变

# ============================================================
# 七、能力设定平衡 【已执行】
# ============================================================

能力平衡:
  调整规则:
    - 避免重复能力（如多种灵兽都有"可释放雷系渊能"）
    - 避免能力过于强大（如噬灵虫可吞噬渊能）
    - 避免能力过于弱小（如火蚁只能焚烧杂物）


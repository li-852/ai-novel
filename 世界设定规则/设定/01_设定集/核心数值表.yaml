# === 天道法则 ===
天道:
  本质: 无自我意识的宇宙免疫系统
  天罚本质: 对逆天者的本能清除反应，不含意志碎片
  无矩境_天道盲区: |
    世人可传其名，天道无其因果。
    无矩者超越天道免疫系统的定位精度，天道无法"看见"其存在。
    三大宗门老祖知晓无矩，靠的是上古"避天残卷"中残留的极少记忆碎片。
  避天残卷_来源: |
    《避天残卷》为无矩始祖在"尚未突破无矩、仍处源初境巅峰时"亲手剥离封存的因果日志。
    源初境者的因果仍在天道索引范围内，因此这些日志可正常留存于主世界。
    一旦突破无矩，其突破后的任何新因果均无法在主世界留痕——天道免疫系统对无矩者彻底失效。
  源初境_族群边界: |
    族群 = 共享同一本源印记波段的同源血脉后裔。
    非"人类"泛族，非"同修炼体系"，严格锁死为血脉波段匹配者。
    主角的感知范围仅锁死在"沈家觉醒血脉群"——即沈家后裔中本源印记已觉醒的个体。
    未觉醒血脉的沈家凡人后裔不触发感知。
  无矩境_因果单向渗透: |
    化身处于"法则盲区投影态"：主世界法则能记录化身的客观行为，
    但因果线在追溯至化身本体时会"凭空断裂"——天道能看见轨迹，却找不到源头坐标。
    化身积累的人性锚点以"无主因果"形式存留，当锚点密度达到阈值时，
    本体可凭此逆向定位自身，实现唤醒。


# === 秘境加速代价 ===
秘境加速:
  寿元透支比例: 0.5  # 秘境内1年 = 透支外界0.5年寿元
  渊石消耗_每倍率每日: 1  # 2:1加速每日额外消耗1渊石
  神魂疲劳阈值_日: 30  # 连续停留超过30日（秘境内时间）神魂开始衰退

# === 燃灯神力池 ===
神力池:
  自然温养_每十年: 1  # 每十年自然温养可储蓄1日极境神力
  十倍体质_每十年: 10  # 十倍修炼速度→每十年10日（即每年约1日）
  上限_年数: 30  # 最大可储蓄30年温养量
  地脉加成倍率: [3, 5]  # 在主大陆地脉核心或顶阶渊坊闭关，充能倍率3~5倍
  优先级: 先消耗神力池存量，耗尽后才燃烧寿元

# === 十倍体质（SSOT）===
十倍体质:
  修炼速度倍率: 10  # 仅限修炼速度
  肉身强度倍率: 1  # 不享受增幅
  悟性倍率: 1  # 不享受增幅
  单次输出倍率: 1  # 真元密度与常人一致，不享受增幅
  真元总储量倍率: 10  # 续航优势
  周天恢复速度倍率: 10  # 续航优势
  战力来源: 十倍续航+蛮力饱和式轰炸  # 非密度碾压

# 核心数值表（SSOT - 唯一真相源）
# 所有核心数值以此文件为准，其他文档仅作文字描述和引用
# 修改此处即修改全局数值

# === 境界体系 ===
# 倍率铁律：跨大境界 ×10（基准预估值，实际战力受功法、丹药、技巧、体质等因素影响）
# 所有境界统一三期制（初/中/后）
# 潜龙诀压制规则：跨度压制（入门压30%，小成压60%，大成压90%）
境界:
  - 名称: 蜕凡
    序号: I
    子境界: [初, 中, 后]  # 映射：1-3层=初，4-6层=中，7-9层=后
    战力倍率: 1
    寿元: 500
    月耗渊石: [2, 5]  # [最低, 满负荷]

  - 名称: 铭纹
    序号: II
    子境界: [初, 中, 后]
    战力倍率: 10
    寿元: 2000
    月耗渊石: [5, 10]

  - 名称: 凝真
    序号: III
    子境界: [初, 中, 后]
    战力倍率: 100
    寿元: 6000
    月耗渊石: [10, 20]

  - 名称: 神藏
    序号: IV
    子境界: [初, 中, 后]
    战力倍率: 1000
    寿元: 15000
    月耗渊石: [30, 50]

  - 名称: 道种
    序号: V
    子境界: [初, 中, 后]
    战力倍率: 10000
    寿元: 30000
    月耗渊石: [80, 150]

  - 名称: 燃灯
    序号: VI
    子境界: [初, 中, 后]
    战力倍率: 100000
    寿元: 50000
    月耗渊石: [200, 500]

  - 名称: 开天
    序号: VII
    子境界: [初, 中, 后]
    战力倍率: 1000000
    寿元: 80000
    月耗渊石: [1000, 2000]

  - 名称: 掌道
    序号: VIII
    子境界: [初, 中, 后]
    战力倍率: 10000000
    寿元: 100000
    月耗渊石: [3000, 5000]

  - 名称: 源初
    序号: IX
    子境界: [初, 中, 后]
    战力倍率: 100000000
    寿元: 129600
    月耗渊石: [5000, 10000]

  - 名称: 无矩
    序号: X
    子境界: []
    战力倍率: 1000000000
    寿元: -1  # 永生
    月耗渊石: 0  # 超越修炼

# === 货币体系 ===
# 1渊石 = 凡人四口之家约20年基本嚼用（佃农标准，10万铜子）
# 灵气守恒：渊烬经数百年沉积重新凝结为渊脉；渊者施法/散功/陨落时90%以上能量瞬间回归天地地脉（鲸落反哺）
货币:
  兑换关系:
    铜子_小纹: 100    # 100铜子 = 1小纹
    小纹_大纹: 10     # 10小纹 = 1大纹
    大纹_渊石: 1000   # 1000大纹 = 1渊石
  总等式:
    渊石_铜子: 100000  # 1渊石 = 100,000铜子
    渊石_小纹: 1000   # 1渊石 = 1000小纹
    渊石_大纹: 1000   # 1渊石 = 1000大纹
  购买力锚点:
    1铜子: 1个烧饼
    1大纹: 凡人壮劳力约十日工钱
    1渊石: 佃农家庭约20-25年支出（100000铜子）
  凡人经济分层:
    # 支出为一家四口（两个孩子一男一女）的年开销
    佃农:
      年支出: [3000, 5000]  # 铜子
      结余率: 0.10
    自耕农:
      年支出: [4000, 6000]
      结余率: 0.10
    小城百姓:
      年支出: [5000, 7000]
      结余率: 0.10
    乡下地主:
      年支出: [8000, 10000]
      结余率: 0.15
    小商户:
      年支出: [8000, 10000]
      结余率: 0.20
    中商户:
      年支出: 100000
      结余率: 0.25
    大商户:
      年支出: 1000000
      结余率: 0.30
  凡人物价锚点:
    粗盐_斤: 10       # 1斤粗盐 = 10铜子（战乱时50铜子）
    粗布_匹: 300      # 粗布（麻布、葛布）= 300铜子
    细布_匹: 1000     # 细布（绢、绸、缎）= 1000铜子
  渊烬:
    1枚渊烬_大纹: 1    # 1枚渊烬 = 1大纹（渊石消耗完渊能后的残骸，外形同渊石，磨粉可种灵药）
  抽水:
    最低: 0.05  # 5%
    最高: 0.15  # 15%
    调整周期: 每季


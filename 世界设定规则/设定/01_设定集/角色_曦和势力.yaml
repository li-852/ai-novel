  - 编号: C010
    姓名: 姬昭明
    官名: 君主
    称呼:
      朋友: ["昭明", "姬兄"]  # 极少数至交
      敌人: ["太阳老儿", "曦曜老鬼"]  # 敌人/对手的蔑称
      长辈: ["君主陛下", "姬君主"]  # 晚辈/臣民的尊称
      正式: ["君主", "姬君主", "陛下"]  # 正式场合
    身份: 曦曜神朝君主
    宗门: 曦曜神朝
    境界: 开天境
    年龄: 约25000岁（正值壮年，执政已逾万年）
    动机: 守护曦曜神朝，维护圣火传承，确保神权正统
    背景: 太阳神金乌嫡系后裔，兼具世俗领袖与精神象征双重身份。自幼接受严格的帝王教育，精通律法与圣火祭祀
    性格: 威严仁厚，公正无私，对臣民如子女般爱护，但对亵渎圣火者绝不姑息
    外貌: 炎阳遗民，发色赤金或深褐，瞳色偏琥珀金，情绪激昂时瞳孔会浮现微弱金乌虚影
    技能: [圣火调候, 执律赈济]
    与主角关系: 潜在盟友（圣火可能与主角体质共鸣）
    首次出场: 第2卷
    状态: 存活
    备注: |
      神权帝制，君权神授
      圣火可净化瘴气、调和气候
      同域宗门：金乌宗（扶持）、律法宗（合作）、烈阳宗（独立）、炙息宗（独立）
      暗中与炽天宗有进化圣火技术交换


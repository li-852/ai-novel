  # --- 云垂剑庭影会代表 ---
  - 编号: C048
    姓名: 剑归尘
    官名: 剑尊
    称呼:
      朋友: ["归尘", "剑兄"]
      敌人: ["老剑人", "归尘老怪"]
      长辈: ["剑尊前辈", "归尘前辈"]
      正式: ["剑尊", "归尘剑尊"]
    身份: 云垂剑庭七峰剑尊之一，影会代表
    宗门: 云垂剑庭
    境界: 道种中
    年龄: 约25000岁
    动机: 维护云垂剑庭利益，借影会平台提升剑庭地位
    背景: |
      云垂剑庭七峰剑尊之一，主修"归尘剑道"——剑出如风，收剑无痕。
      早年游历四方化解纷争，后被剑庭派驻影会，代表云垂剑庭行使表决权。
      暗中想借影会平台让剑庭与炽天宗平起平坐。
    性格: 沉稳内敛，话不多但每句切中要害。对剑道极为执着，认为剑道即人道。表面恭敬炽天宗，实则野心勃勃。
    外貌: 身材修长，面容清癯，双目如剑。常穿云垂剑庭制式白衣，腰悬长剑，行走间剑意隐隐。瞳孔有完整剑纹，剑道造诣极高。
    技能: [归尘剑诀, 剑意共鸣, 七峰联动阵]
    与主角关系: 影会代表之一，与主角无直接冲突
    首次出场: 待定（影会相关剧情）
    状态: 存活
    备注: |
      云垂剑庭在影会的代表，负责战力输出。
      对炽天宗态度最好，但暗中想与炽天宗平起平坐，可能反噬。


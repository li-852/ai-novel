# 世界设定 - 烛阴大陆势力
# 由 世界设定_地理与王朝.yaml 拆分

  # --- 烛阴大陆势力 ---
  烛阴王朝:

    陵渊守廷:
      大陆: 烛阴大陆
      政体: 岩尊世袭——岩尊家族世袭统治，君主同时是岩层塑形、地脉导流技艺的最高嫡系传承人，权力与核心工艺深度绑定。继位者须闭目触摸祖庭核心岩壁，岩壁若渗出暖流则认可，若渗出寒流则拒绝；被寒流拒绝者终身不得踏入祖庭，由旁系递补
      统治者: 韩陵川
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 韩磐石
          境界: 掌道初期
          备注: 陵渊开国岩尊，岩层本源觉醒者，肉身已岩化万年不朽
        - 名称: 石不开
          境界: 开天后
          备注: 地底最深处的守岩人，守护岩脉核心已逾八千年
        - 名称: 渊底
          境界: 开天后
          备注: 居于岩渊最深处，据说已触碰到地心本源
      哲学: 岩渊筑造，固山御灾
      文化: 以岩层筑造与地质守护为核心，盛行岩层塑形、地脉导流技艺。每年举办岩造技艺交流与地质防灾研讨大会，以稳固山川、构筑安居屏障为最高德行，崇尚务实坚韧，重技艺传承、轻浮华享乐
      职责: 盘踞巨型层叠岩渊疆域，精通岩层塑形与地脉疏导之术，可引导岩层走势塑造山体、构筑巨型石城与防风岩堤，抵御山崩、地裂、风沙等地质灾害；擅长开辟地下宜居空间与加固大型工事地基，为周边国度提供地质防护与大型建造支持，不断改造烛阴大陆的恶劣岩地环境，拓展宜居疆域
      战力: 常规凝真 / 顶级道种
      外貌: 陵渊族人因常年在地下岩层中作业，体型敦实，肩背宽厚，肤色呈灰白或浅褐。岩尊血脉者双手可感知岩层纹理，闭目触摸石壁即能判断地层结构与矿脉走向
      宗门关系:
        扶持:
          - 岩渊宗（宗主石砚，男，开天境）——岩层塑形技艺同源，守廷提供岩脉资源
        合作:
          - 地脉宗（宗主石听泉，男，道种）——地脉导流技术互补，联合勘测地质
        同域独立:
          - 深窟宗（宗主穴无光，男，凝真）——独立运作，与守廷无隶属关系
          - 石乳宗（宗主滴水婆婆，女，凝真）——专研石钟乳灵液采集与疗伤药剂，居于深洞
          - 石刻宗（宗主刻石翁，男，道种）——专研岩层篆刻与碑文传承，为各族记录族谱
          - 矿脉宗（宗主掘地叟，男，道种）——专研矿脉勘测与伴生矿分辨，行走各地寻矿

    赤藤灵廷:
      大陆: 烛阴大陆
      政体: 藤爵合议——数位藤爵共同执掌，藤爵靠灵藤培育与疗愈技艺的造诣选拔，不世袭，集体决策，权力与灵藤共生能力绑定。表决时各藤爵同时催动共生灵藤，藤蔓生长方向即为投票方向；若藤蔓纠缠不休则视为搁置。藤姥姥的灵藤拥有最终解释权
      统治者: 楚赤薇
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 藤祖
          境界: 掌道初期
          备注: 赤藤开国始祖，灵藤本源觉醒者，肉身已与千年灵藤融为一体
        - 名称: 楚蔓
          境界: 开天后
          备注: 上代藤爵之首，灵藤疗愈之道登峰造极，一藤可续命千年
        - 名称: 绿影
          境界: 开天后
          备注: 灵藤隐修，居于赤藤灵廷最深处的千年藤林中
      哲学: 灵藤疗愈，改良瘠土
      文化: 以灵藤共生与草木疗愈为核心，全民通晓基础灵藤培育与伤痛疗愈知识；奉行互助帮扶准则，以疗愈生灵、滋养水土为核心文化
      职责: 赤灵藤缠绕黑石筑城，灵藤汁液可调和伤痛、滋养水土；藤蔓可编织防护屏障与跨谷吊桥，专门改良贫瘠土地，并向周边输送疗愈灵材
      战力: 常规凝真 / 顶级道种
      外貌: 赤藤族人小臂上多缠有一条活体灵藤，自出生起便与之共生，灵藤随主人年岁增长而延伸。藤爵级别的共生者，灵藤已融入血脉，受伤时藤蔓可自行分泌汁液封合伤口
      宗门关系:
        深度绑定:
          - 灵藤宗（宗主藤姥姥，女，开天境）——藤爵即宗门长老，灵藤共生体系一体两面
        同域独立:
          - 草木宗（宗主药生香，女，道种）——独立运作，与灵廷无隶属关系
          - 织藤宗（宗主经纬娘，女，凝真）——专研灵藤纤维纺织与藤甲编制，手艺闻名诸国
          - 灵药宗（宗主百草仙，女，道种）——专研灵草炮制与药性配伍，为各族调配药剂

    灵螟壤域:
      大陆: 烛阴大陆东侧偏南，与曦和大陆接壤
      地理特征: 没有海，只有河流
      政体: 御尊世袭——中央集权世袭王朝，御尊为全疆域最强御兽师，御兽体系由王庭统一调度。民间非王庭许可不得豢养、携带灵兽，城区与聚居地严格执行"兽不入城"律令，确保民生安定。继位者须在王庭兽魂殿中与上古兽魂建立契约，兽魂若拒绝则下一位候选人递补；谢灵衍的兽魂是上古玄蟒，已传承七代
      统治者: 谢灵衍
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 谢兽神
          境界: 掌道初期
          备注: 灵螟开国御尊，万兽本源觉醒者，可与天地万兽心灵相通
        - 名称: 廉太古
          境界: 开天后
          备注: 最古老的御兽师，统御着一支上古凶兽军团
        - 名称: 蟒魂
          境界: 开天后
          备注: 与上古玄蟒共生八千年，蟒魂已融入其本源印记
      哲学: 御兽冠世，化荒为田
      文化: 以官方御兽体系与壤地养护为核心，崇尚秩序管控，奉行"御兽守土、兽不扰民"。每年举办王庭御兽大典选拔人才入仕。民间重农耕与地力养护，御兽知识仅限王庭体系内传承，普通民众极少接触灵兽
      职责: 拥有大陆最成熟完善的官方御兽体系，综合实力在烛阴大陆诸王朝中最弱，但比小宗门强，可统御多品类灵兽协同执行地脉勘测、荒壤改良、灾患预警、地质灾害治理等复杂任务，已将大片荒芜冻土改造为高产良田。严格执行"兽不入城"律令，王庭灵兽入城也需报备走专属通道。持续优化灵兽培育与契约体系，贴合炽天宗"进化优先"的发展理念
      战力: 常规凝真 / 顶级道种
      外貌: 灵螟族人瞳孔呈竖瞳状，为御兽契约留下的永久印记，竖瞳颜色随契约灵兽的品类而变化。御尊血脉者天生能与灵兽建立心灵链接，无需结契即可感知兽群情绪与动向
      宗门关系:
        扶持:
          - 御兽宗（宗主廉狩，男，开天境）——官方御兽体系核心，王庭提供兽源与契约资源
        合作:
          - 壤地宗（宗主土生金，男，道种）——荒壤改良技术互补，联合治理冻土
        同域独立:
          - 兽语宗（宗主吠无声，男，凝真）——独立运作，与壤域无隶属关系
          - 牧野宗（宗主风吹草，男，凝真）——专研荒野灵草放牧与兽群迁徙引导，散居草原
          - 驯兽宗（宗主铁笼生，男，道种）——专研灵兽行为矫正与野性驯化，为民间处理失控灵兽
          - 虫语宗（宗主鸣蛩子，男，道种）——专研灵虫培育与虫群协作，擅长以虫群勘测地底

    玄缄古廷:
      大陆: 烛阴大陆
      政体: 缄石长老会——资深缄石长老集体掌权，凭封藏技艺、学识资历、古法修复造诣选拔，不世袭，决策风格严谨稳重，兼顾传承守护与从古法中推演新思路。重大决策时长老会共同在缄石上篆刻议题，缄石自行显现纹路走向，纹路即为"石意"；长老会解读石意做出最终裁决。叶缄尘是当代最擅解读石纹者
      统治者: 叶缄尘
      统治者境界: 开天境
      隐藏老祖:
        - 名称: 叶封
          境界: 掌道初期
          备注: 玄缄开国缄石长老，封藏本源觉醒者，已将自身封存于玄石棺中万年
        - 名称: 石中书
          境界: 开天后
          备注: 缄石密室群最初的建造者，记忆着万年来封藏的所有秘辛
        - 名称: 墨石
          境界: 开天后
          备注: 石纹篆刻始祖，指尖石纹可覆盖整座山脉
      哲学: 玄石藏典，镇固灾源
      文化: 以石质封藏技艺与典籍守护为核心，盛行古籍修纂、古物封存、石纹篆刻技艺。每年举办藏典雅集与古法传承交流大会，以守护濒危传承、活化古法技艺为最高追求，崇尚严谨沉淀，重传承内核、轻外在形式
      职责: 以层叠玄岩构筑的缄石密室群为核心都邑，精通石质封藏之术，可将古籍卷宗、珍稀物料封存于特制玄石匣与石室之中，隔绝岁月侵蚀、千年无损。可篆刻石纹阵加固崩裂山体、镇封异动地脉，遏制地质灾害扩散。收纳濒临失传的古法技艺，整理修复后向各族开放传承，同时为各方提供古物封存、灾源镇护的技术支持
      战力: 常规凝真 / 顶级道种
      外貌: 玄缄族人十指指尖有天然的石纹印痕，印痕越繁复者石质封藏技艺越精深。长老级别的缄石师指尖石纹可延伸至手腕，触碰石壁时纹路可自行篆刻封印阵法
      宗门关系:
        深度绑定:
          - 缄石宗（宗主由长老会轮值担任，开天境）——长老会即宗门核心，封藏技艺一体两面
        同域独立:
          - 石纹宗（宗主石纹生，男，道种）——独立运作，与古廷无隶属关系
          - 印刻宗（宗主朱砂引，男，凝真）——专研石印篆刻与封蜡技艺，为商旅刻印鉴
          - 墨痕宗（宗主砚无声，男，道种）——专研石墨调制与拓印技艺，为各族拓印碑文古籍

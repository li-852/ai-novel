# 王朝地域内宗门等级标准（独立于三大宗门）
# 王朝与宗门无隶属关系，仅存在以下关系类型：
#   扶持 — 王朝提供资源/庇护，宗门为王朝效力（1-2个）
#   合作 — 双方技术/利益互补，平等协作（0-1个）
#   深度绑定 — 宗门与王朝一体两面（如云垂剑庭与七峰剑宗、赤藤灵廷与灵藤宗）
#   同域独立 — 同处一域但无任何关系
王朝宗门层级:
  统治者: 开天境（主大陆）/ 开天初期（三洲附属）
  一流宗门宗主: 开天境
  二流宗门宗主: 道种
  三流宗门宗主: 凝真

冲突核心: 三个命题无法同时成立——秩序压制进化，进化瓦解传承，传承固化秩序


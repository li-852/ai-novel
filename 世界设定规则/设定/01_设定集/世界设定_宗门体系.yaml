# 世界设定 - 宗门体系
# 由 世界设定.yaml 拆分

宗门起源:
  创始者: 无矩强者（民间误传"已故"，实则只是留下了部分意识；死亡还是被天道抓取是悬念，民间说法称"被天道抓取"）
  历史: 三宗最初由一位无矩强者创建，后此人消失，三宗从强者分裂而出
  秘法: 秘法被分为三分残卷，分别由三宗保管
  目的: 主角集合三分残卷，验证新理论——达到无矩境界后仍可留存世间

# 三宗冲突：不是善恶之战，而是三个无法同时成立的命题
宗门:
  - 姓名: 玄天宗
    领地: 曦和大陆
    哲学: 秩序优先
    宗主: 姜道玄
    宗主境界: 掌道后
    宗主性格: 铁腕治宗，不怒自威，行事一板一眼，最恨破坏规矩之人
    规模: 弟子约五千人，镇宗老祖六人
    特色: 天罡正法——以天地正气为根基，修炼者气息浩然，威压堂堂正正，克制一切邪祟
    文化: 宗规严明，等级分明，弟子每日晨起诵宗规三条。宗内设有"执法堂"，违规者绝不姑息
    内部势力:
      分堂体系:
        - 南域堂（驻使监管曦曜神朝、炎铸王庭渊石配额）
        - 北域堂（驻使监管梧栖国渊石配额）
        - 中域堂（驻使监管云垂剑庭、苍桢祖庭渊石配额）
        - 东域堂（驻使监管沧汐王朝渊石配额）
        - 西域堂（驻使监管曦和大陆西境散修区域）
      直属堂口:
        - 修炼堂（基础修炼指导）
        - 炼丹堂（丹药炼制与储备）
        - 炼器堂（法器炼制与储备）
        - 执法堂（宗规执行与跨域纠纷仲裁）
      渊脉巡查队: 巡查曦和大陆渊脉开采秩序，查处私采滥挖

  - 姓名: 炽天宗
    领地: 烛阴大陆
    哲学: 进化优先
    宗主: 厉无极
    宗主境界: 掌道后
    宗主性格: 狂热激进，崇尚弱肉强食，认为停滞即死亡，进化才是天道正途
    规模: 弟子约四千人，镇宗老祖六人
    特色: 焚天进化术——以极端环境淬炼肉身，强制激发潜能，修炼过程凶险但突破极快
    文化: 宗内崇尚竞争，弟子之间可自由切磋甚至挑战长老，胜者取而代之。每年举办"进化试炼"，淘汰者降级
    内部势力:
      试炼秘境:
        - 焚天渊（火系淬炼秘境，温度随深入递增，最深处可熔化陨铁）
        - 进化谷（潜能激发秘境，谷内充斥狂暴灵气，强制激活渊者沉睡血脉）
        - 弱肉原（生存淘汰秘境，投放大量凶兽，渊者须在其中存活三十日）
      直属堂口:
        - 进化堂（进化术研究与传授）
        - 炼体堂（极端环境淬炼肉身）
        - 征伐堂（对外征战与威慑）
        - 驯兽堂（灵兽契约与兽群统御）
      进化使体系: 四王朝各设进化使一名（道种境），推广进化术并筛选天赋异禀者入宗

  - 姓名: 天陨阁
    领地: 不死洲、无间洲、铸星洲
    哲学: 传承优先
    宗主: 沈沧溟
    宗主境界: 源初初期
    宗主性格: 沉稳内敛，城府极深，对外不露锋芒，对内铁面无私。对弟弟沈渊之死耿耿于怀，但身为阁主不得不以大局为重
    规模: 弟子约六千人，镇宗老祖十人（含1位源初后即将陨落）
    特色: 万法归源——以渊脉本源为根基，修炼者可兼容百家之长，不拘泥于单一功法，但修炼速度略慢
    文化: 重视传承延续，弟子入门须立誓守护宗门传承。宗内设有"传承殿"，封存历代先辈功法与秘术
    历史:
      - 事件: 执事堂堂主沈渊上古本源印记觉醒，遭诸派忌惮联手施压
        内因: 执事堂前任堂主沈溯安（沈渊堂兄）嫉妒沈渊本源印记觉醒，暗中向玄天宗泄露消息
        外因: 玄天宗联合炽天宗施压，炽天宗知晓后强行加入联合
        后果: 天陨阁倾力一战落败，被迫交出沈渊（阁主亲弟弟）
        余波: 沈渊之子（沈默，时年两岁半）被秘法冻结生机，由沈渊礼带走远遁
        叛徒: 沈溯安——执事堂前任堂主，沈渊堂兄，因嫉妒而出卖堂弟。第9卷末被主角击杀，身份揭露
    内部势力:
      三堂体系:
        - 丹阁（与归泉文廷合作，详见 tianyun_halls）
        - 执事堂（与潜影守廷合作，详见 tianyun_halls）
        - 器阁（与星锻古朝合作，详见 tianyun_halls）
      驻廷使体系: 三洲各设驻廷使一名，与附属势力对接日常事务
      核心殿阁:
        - 传承殿（封存历代功法与秘术）
        - 渊脉殿（管理三洲渊石资源分配）

# --- 天陨阁三洲势力 ---
天陨三洲:

    # 不死洲
    归泉文廷:
      大陆: 不死洲
      统治者称号: 泉主
      统治者姓名: 文归泉
      统治者境界: 开天初期
      政体: 泉主世袭——泉主家族世代血脉传承，泉主同时是归泉的守护者与知识传承的核心代表人，统治权与知识传承权限深度绑定。继位者须入归泉深处触碰"始祖泉眼"，泉眼若涌出温热泉水则认可，若泉水冰冷则拒绝；被拒者终身不得再入泉心
      哲学: 归泉承智，传续学识
      文化: 以归泉承智与知识共享为核心，盛行泉域观学与经验传承仪式。全民皆可阅览先辈学识，重教育、轻门第，以传承智慧为最高德行。与天陨阁丹阁常年开展学识交流与丹道研讨，形成了"以文载道、以丹利民"的文化氛围
      职责: 地底归泉承载历代族群的经验与智慧，族人可入泉阅览工程、治水、造器等学识，新生代在此传承先辈智慧。与天陨阁丹阁深度绑定，以归泉封存的上古丹道典籍为根基，结合丹阁古法炼制技艺，共同复原濒危丹方、研制惠民疗愈丹剂与防灾备用丹品。双方共建丹道传承堂，向全大陆开放基础丹方知识与疗伤丹剂的普及推广，共同守护丹道传承不致断绝
      战力: 常规凝真 / 顶级道种
      宗门关系:
        深度绑定:
          - 归泉宗（宗主泉映月，女，道种）——丹道传承核心，与文廷共建丹道传承堂
      外貌: 归泉族人因世代居于地底归泉之畔，发色呈灰白或墨黑，瞳色偏暗蓝，肌肤在归泉荧光映照下泛淡青光泽。族人性情沉静寡言，记忆力远超常人，自幼便能通过归泉阅览先辈遗留的学识片段
      合作堂口: 丹阁
      合作详情:
        - 归泉封存上古丹道典籍 → 丹阁提供古法炼制技艺 → 双方共同复原濒危丹方
        - 共建丹道传承堂，向全大陆开放基础丹方知识与疗伤丹剂的普及推广
        - 共同守护丹道传承不致断绝

    # 无间洲
    潜影守廷:
      大陆: 无间洲
      统治者称号: 影皇
      统治者姓名: 夜潜影
      统治者境界: 开天初期
      政体: 影皇独尊——最高权力完全集中在影皇一人手中，影皇为绝对领袖，指令统一、决策执行力极强，整个势力的运作高度保密，不对外暴露内部层级。影皇继位时须独自穿越永暗裂隙最深处的"寂灭之渊"，活着走出来即为新任影皇；走不出则由影卫统领暂代，直至有人成功穿越
      哲学: 潜影守护，预险示警
      文化: 奉行"隐于暗处，护于光明"的准则，盛行隐匿守护、秘境巡查技艺。重责任、轻声名，以提前预警天灾、守护秘境为最高使命。与天陨阁执事堂常年开展巡查技艺与值守经验交流，形成了"协同巡守、共护传承"的行事准则
      职责: 以永暗裂隙为居所，族人擅长隐匿守护与秘境巡查，四处探查潜在天灾隐患并提前通报各族避险，以隐匿之能守护秘境古物。与天陨阁执事堂深度合作，共享秘境遗存探查成果与上古史料，联合组建秘境巡查队伍，共同值守上古遗存、排查灾患隐患。潜影守廷提供隐匿巡查技术支持，执事堂提供传承千年的秘境规制与值守体系，双方协同构建全域灾患预警与秘境守护网络
      战力: 常规凝真 / 顶级道种
      宗门关系:
        深度绑定:
          - 暗渊宗（宗主影无踪，男，道种）——隐匿巡查核心，与守廷联合组建秘境巡查队
      民众称呼: 影戍  # "以影为甲，戍守光明"
      民众称呼说明: 外界极少知晓此名，多以"潜影者"或"暗渊之人"代称
      外貌: 影戍族人因世代居于永暗裂隙，瞳孔呈暗银色夜视特征，皮肤在光线下泛微弱的暗纹。他们不善言辞，重视责任远胜于声名，认为被外界记住名字是一种失职。影戍族人天生具备短距离暗影穿梭能力，但每次使用会消耗大量体力
      合作堂口: 执事堂
      合作详情:
        - 共享秘境遗存探查成果与上古史料
        - 联合组建秘境巡查队伍，共同值守上古遗存、排查灾患隐患
        - 潜影守廷提供隐匿巡查技术支持，执事堂提供传承千年的秘境规制与值守体系
        - 双方协同构建全域灾患预警与秘境守护网络

    # 铸星洲
    星锻古朝:
      大陆: 铸星洲
      统治者称号: 锻王
      统治者姓名: 萧星锻
      统治者境界: 开天初期
      政体: 锻王世袭——锻王家族世代传承，锻王同时是星陨锻造技艺的最高嫡系传承人，权力与核心锻造工艺绑定。继位者须以天外陨星矿独立锻造一件"星魂器"，器成时若引动星辰共鸣则认可；若器碎则丧失资格，由旁系递补
      哲学: 星陨锻器，造物利民
      文化: 以星陨锻造与造物利民为核心，盛行星辰器具锻造、地火控温技艺。每年举办星锻大会与锻造技艺互通交流，重匠心、轻功利。与天陨阁器阁常年开展技法研讨与工艺共创，形成了"匠心传续、造物共研"的文化氛围
      职责: 以天外陨星矿为原料，借温和地火锻造星辰器具，器物自带安定防护星力，用于打造护城机关、防灾器械，与各方互通锻造技艺，专注造物利民。与天陨阁器阁深度绑定合作，共享星陨锻造秘法与上古器道传承技艺，联合研发城防机关、防灾器械与民生造物。双方共建器道研习坊，共同复原失传的古法锻造工艺，推动全大陆锻造技术迭代升级，以器道传承造福民生
      战力: 常规凝真 / 顶级道种
      宗门关系:
        深度绑定:
          - 星陨宗（宗主锻星河，男，道种）——星陨锻造核心，与古朝共建器道研习坊
      外貌: 星锻族人因常年接触陨星矿与地火，手掌与手臂上浮现细密的星芒纹路，锻造技艺越精深者纹路越明亮。族人体魄强韧，耐高温，部分高阶锻师可在不借助工具的情况下徒手感知矿脉纯度
      合作堂口: 器阁
      合作详情:
        - 共享星陨锻造秘法与上古器道传承技艺
        - 联合研发城防机关、防灾器械与民生造物
        - 共建器道研习坊，共同复原失传的古法锻造工艺
        - 推动全大陆锻造技术迭代升级，以器道传承造福民生

    # 三洲交界 · 独立宗门
    归墟宗:
      位置: 铸星洲与不死洲、无间洲交界的三岔地带
      类型: 散修庇护与传承接引宗门
      备注: 天陨阁疆域内唯一的散修庇护宗门
      宗主: 燃灯
      宗主境界: 开天境
      宗主简介: 来历不明，常年提一盏古旧铜灯，据传灯火中封存着某种濒危的上古传承火种。实力开天境，极少出手，与其交过手的人仅描述"灯火亮起时，胜负已分"。其真实身份至今无人知晓，有人说他是上古时代某支灭绝宗门的末裔，有人说他本身就是一道被封存的传承化为人形
      规则:
        - "其一，来者不问出身——无论是被放逐的剑修、断了传承的丹师、逃离秘境的守门人，甚至是身负污名的罪人，只要携带古老传承的碎片，归墟宗皆不拒之门外"
        - "其二，传承不可断——入院者必须将自身所持的古法、技艺、典籍碎片登记在册，由归墟宗协助整理修复，绝不让任何一项传承在此断绝"
        - "其三，不留亦不强留——散修修复自身传承后，可自行离开寻找新的归属。归墟宗只做驿站，不做终站"
      与大陆关系:
        - 归泉文廷每年向归墟宗捐赠一批复刻的通用典籍，作为散修基础教材
        - 潜影守廷的巡查队偶尔护送迷途散修至宗门，但不承认此事有任何官方记录
        - 星锻古朝为归墟宗提供一处小型温和地火炉，供散修中的锻造师研究星辰器具的残方
        - '三洲形成默契：归墟宗的存续是天陨阁"传承优先"理念的最后一道安全网——如果某一王朝的传承不幸中断，归墟宗中或许还留有一枚火种'
      秘密关系:
        - 归墟宗偶尔接收从曦和大陆逃出的"不稳定因素"，这些人的存在暗影议会心知肚明，但因归墟宗地处天陨阁腹地，不在暗影议会执行范围内
        - 炽天宗的部分散落在外的进化术碎片，也曾通过归墟宗流入天陨阁的学术视野
        - "宗主燃灯本人与梧栖国凤鸣宗宗主羽清商有旧交，偶尔通过飞鸟交换情报，是天陨阁与玄天宗之间一条非正式的沟通暗线"
      势力边界: |
        归墟宗虽在天陨阁疆域内，但保持独立性：
        1. 天陨阁无权要求归墟宗交出任何散修——"来者不问"是铁律
        2. 天陨阁无权审查归墟宗的传承档案——"传承不可断"是铁律
        3. 天陨阁无权阻止散修离开归墟宗——"不留亦不强留"是铁律
        但归墟宗也不会主动对抗天陨阁：不接收天陨阁明确通缉的叛徒，不泄露天陨阁核心机密。
        双方维持微妙平衡：天陨阁默许归墟宗的存在，归墟宗不触碰天陨阁的核心利益。

# --- 暗影议会（影会） ---
# 多势力联合组织，非三宗机构
暗影议会:
  名称: 暗影议会（简称"影会"）
  性质: 多势力联合组织，不对外公开，无固定议事场所。与玄天宗、天陨阁无关。
  成员:
    - 炽天宗代表（执法堂副阁主，道种后，最终拍板）
    - 云垂剑庭代表（剑尊，道种中）
    - 梧栖国代表（太傅，道种中）
    - 沧汐王朝代表（长老，道种中）
    - 灵螟壤域代表（掌域使，道种中）
  基层: 各境界都有，以底层居多
  管辖: 曦和大陆及周边地区的非正式事务协调
  权力:
    - 协调跨势力冲突，避免全面战争
    - 对"不稳定因素"（叛逃者、异端、危险传承持有者）进行非正式追捕
  秘密: 暗影议会的存在本身是秘密，普通渊者甚至不知道有这个机制
  与玄天宗关系: 无关系。玄天宗不参与影会。
  与天陨阁关系: 无关系。天陨阁不参与影会。
  主角关联: |
    主角在玄天宗期间洗劫了影会在烛阴大陆积攒几百年的宝库
    宝库位置：梧栖国一个主城商铺后院
    宝库内容：大量钱财、渊石、药材、几部功法
    逃亡协助：陆九霄（好兄弟）和苏若笙（私定终身）共同帮助主角成功逃走
    被影会追杀，被迫逃到不死洲（天陨阁辖区），以散修身份化名陆沉加入天陨阁丹阁
    追杀后续：
    - 玄天宗趁机清理留在曦和大陆的影会势力
    - 影会被迫暗中收集，具体方式：
      1. 通过梧栖国收集情报
      2. 云垂剑庭出战力
      3. 沧汐王朝出人出力
      4. 购买、窃取或欺压等手段获取资源
      5. 正常商业经营获取
    - 玄天宗清理影会势力的具体计划：
      1. 大多数以当地势力按上罪名处决
      2. 少部分被暗杀清剿带回玄天宗审问囚禁
    - 影会被清理后的残余势力：
      1. 转移——转移到其他地区或势力范围
      2. 沉淀——潜伏下来，隐藏身份
      3. 等待命令——保持联络，等待重新集结的命令
    - 影会在曦和大陆的分布：
      1. 主要在梧栖国
      2. 其次在沧汐王朝
      3. 最后是云垂剑庭
      4. 其它地方也都有渗透
    - 影会没落状态：被主角清剿过一次后再加上玄天宗的清理，影会在曦和大陆已经没落，影响力和势力大不如前，在后面的剧情中基本上不会出现


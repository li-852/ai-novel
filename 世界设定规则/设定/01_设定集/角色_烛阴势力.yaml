    年龄: 约28000岁
    动机: 维护炽天宗铁律，清除一切威胁宗门秩序的因素
    背景: |
      出身炽天宗执法堂底层杂役，凭借铁腕手段和过人天赋一路攀升。
      执法万年，从未失手，堂内堂外闻其名而色变。
      被宗门派驻影会，代表炽天宗行使最终裁决权。
    性格: 铁面无私，冷酷果断，对违规者绝不姑息。表面不近人情，实则对炽天宗忠心耿耿，一切以宗门利益为先。
    外貌: 身材高大，面容冷峻，双目如电。常穿炽天宗执法堂制式黑红长袍，腰悬执法令剑，行走间自带肃杀之气。
    技能: [焚天进化术（执法堂秘传变体）, 执法剑诀, 审讯秘术]
    与主角关系: 影会最高决策者，主角洗劫影会宝库的主要对手
    首次出场: 待定（影会相关剧情）
    状态: 存活
    备注: |
      影会中炽天宗的代表，拥有最终拍板权。
      与其余四方代表保持微妙平衡，但绝不容忍任何挑战炽天宗权威的行为。
      执法风格：先审后杀，不留活口。


    宗门: 炎铸王庭
    境界: 开天境
    年龄: null
    动机: null
    背景: 匠王共治，战王掌防务防灾
    性格: 刚猛豪烈，以铁血手腕统领军务，与锻王墨焱性格互补
    外貌: 炎铸族人，体型魁梧，手臂火纹烙印比常人更深，常年披甲
    技能: [防务统御, 岩灾治理]
    与主角关系: null
    首次出场: 第2卷
    状态: 存活
    备注: |
      匠王共治——锻王掌制造生产，战王掌防务防灾
      暗中与炽天宗达成军事互助协议

  - 编号: C091

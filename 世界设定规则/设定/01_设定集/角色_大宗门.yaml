    背景: 出身烛阴大陆底层散修，凭天赋与狠辣一路攀升至宗主之位，是炽天宗历史上出身最低的宗主
    性格: 狂热激进，崇尚弱肉强食，认为停滞即死亡，进化才是天道正途。对弱者不屑一顾，对强者惺惺相惜
    外貌: 身材精瘦，眼神如鹰，皮肤上有进化术留下的灼烧疤痕，被视为"进化勋章"
    技能: [焚天进化术, 进化法则]
    与主角关系: null
    首次出场: 第4卷
    状态: 存活
    备注: |
      进化优先的狂热信徒
      暗中与曦曜神朝、炎铸王庭、沧汐王朝有跨大陆暗通
      对主角的十倍体质尚不知情，但一旦知晓必将疯狂追逐

  - 编号: C093

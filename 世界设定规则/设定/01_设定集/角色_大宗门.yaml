      正式: ["堂主", "沈堂主"]  # 正式场合
    身份: 天陨阁执事堂堂主
    宗门: 天陨阁
    境界: 燃灯后
    年龄: 约5000岁（沈渊事件时修为尚浅，亲眼目睹堂叔被交出却无能为力）
    动机: 追查沈溯安的叛徒证据，为堂叔沈渊讨回公道
    背景: 沈渊的堂侄，沈渊事件时修为尚浅，亲眼目睹堂叔被交出却无能为力。成年后凭实力升任执事堂堂主
    性格: 沉默务实，不善言辞，但执行力极强。对下属严厉但公正，对叛徒绝不姑息
    外貌: 体型敦实，面容刚毅，双手布满老茧，常年穿执事堂制式黑袍
    技能: [秘境巡查, 秩序维护]
    与主角关系: 堂兄（沈渊堂侄，尚不知沈默存活）
    首次出场: 第3卷
    状态: 存活
    备注: |
      执事堂堂主，接替沈渊之位
      暗中追查沈溯安的叛徒证据
      与潜影守廷影皇有交情（影皇对沈渊有救命之恩）


    境界: 源初初期
    年龄: 约15000岁（沈渊的亲哥哥，比沈渊年长约300岁）
    动机: 守护天陨阁传承，等待时机为弟弟沈渊讨回公道
    背景: 沈渊的亲哥哥，天陨阁阁主。沈渊事件时被迫做出交出弟弟的决定，此后二十八年再未展露笑容
    性格: 沉稳内敛，城府极深，对外不露锋芒，对内铁面无私。对弟弟之死耿耿于怀，但身为阁主不得不以大局为重
    外貌: 面容清瘦，眼神深邃如渊，常年穿灰色阁主袍，不戴任何饰物
    技能: [万法归源, 传承法则]
    与主角关系: 伯父（沈渊的亲哥哥，尚不知沈默存活）
    首次出场: 第3卷
    状态: 存活
    备注: |
      传承优先的坚定守护者
      对沈渊事件的态度：被迫之举，但心中有愧
      暗中追查沈溯安的叛徒证据
      发现沈默存在后的态度变化将是重要剧情线

  - 编号: C094

    宗门: 玄天宗
    境界: 掌道后
    年龄: 约8000岁（玄天宗历代宗主中最年轻的一位）
    动机: 维护三宗平衡，确保秩序不被打破
    背景: 玄天宗历代宗主中最年轻的一位，以铁腕手段整顿宗规，将玄天宗从松散联盟变为铁板一块
    性格: 铁腕治宗，不怒自威，行事一板一眼，最恨破坏规矩之人。说话从不废话，一个字就是一个命令
    外貌: 面如冠玉，鬓角微霜，常年穿玄色宗袍，腰悬天罡剑
    技能: [天罡正法, 秩序法则]
    与主角关系: null
    首次出场: 第2卷
    状态: 存活
    备注: |
      秩序优先的坚定践行者
      对天陨阁沈渊事件的态度：维护秩序的必要之举
      对炽天宗的扩张深感忧虑

  - 编号: C092
    姓名: 厉无极
    官名: 宗主
    称呼:
      朋友: ["无极", "厉兄"]  # 极少数至交
      敌人: ["疯子", "炽天老魔", "进化狂人"]  # 敌人/对手的蔑称

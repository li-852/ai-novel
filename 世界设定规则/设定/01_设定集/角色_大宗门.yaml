    官名: 宗主
    称呼:
      朋友: ["道玄", "姜兄"]  # 极少数至交
      敌人: ["老匹夫", "玄天老狗"]  # 敌人/对手的蔑称
      长辈: ["宗主", "姜宗主"]  # 晚辈的称呼

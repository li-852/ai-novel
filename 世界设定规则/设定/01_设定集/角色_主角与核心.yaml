# 角色档案 - 主角与核心关联人物
# 由 角色档案.yaml 拆分

角色:
  # --- 主角 ---
  - 编号: C001
    姓名: 沈默
    别名: 小默
    官名: null  # 散修，无官名
    称呼:
      朋友: ["小默", "默哥", "沈兄弟", "陆兄"]  # 朋友/亲近人的昵称
      敌人: ["废物", "蝼蚁", "臭小子", "不知死活的东西", "狂妄小儿"]  # 敌人/对手的蔑称
      长辈: ["小子", "沈小子", "后生"]  # 长辈的称呼
      正式: ["沈公子", "陆公子", "这位渊者"]  # 正式/陌生场合
      自称: ["在下", "晚辈", "小人"]  # 主角对上位者的自称
    身份: 无宗门，随沈渊礼隐居
    宗门: 无
    境界:
      真实: 凡人（出场时）→ 蜕凡初期（养父消失前）
      伪装: null  # 出场时无伪装，修炼后才需要
    年龄: 约30（故事开始时，养父消失）
    动机: "前期求存 → 中期发现真相转向复仇 → 后期承担更大使命"
    背景: |
      天陨阁执事堂堂主沈渊之子，两岁半时被秘法冻结生机，由沈渊礼带走隐姓埋名。
      从2.5岁起跟随养父在曦和大陆西境荒山脚下种田进山，过普通生活。
      20岁时在集市买粮食，偶遇蜕凡强者，见其享受官府发放的待遇福利，萌生变强念头，被养父拒绝。
      20-25岁期间偷偷尝试修炼，但无功法指导，进展甚微。
      25岁时在山上捡到被追杀的黑衣人掉落的包裹，内有养元丹和一枚刻有"影"字的令牌（关联潜影守廷）。
      养父视为造化，不再拒绝，开始为主角打基础（体力、耐力、精神力）。
      主角以基础为主，利用十倍体质优势，4年修至蜕凡初期（29岁），1年修至蜕凡中（30岁）。
      蜕凡中后养父突然消失，主角独自生活，主动外出寻找机缘。
    性格: 深谋远虑，思维灵活，有些许梗，稍微坑普通朋友，重点坑作对的人，对朋友极好
    外貌: 平庸无奇，路人脸，融入人群即消失
    技能:
      - 潜龙诀（隐藏气息）
      - 丹道（来源：天陨阁丹阁50%、自己收集25%、梧栖国继承人25%）
        - 恢复类：止血散（一品）、化瘀丹（一品）、养元丹（一品）、回气丹（一品）、疗伤丹（二品）、接骨丹（二品）、聚气丹（二品）、润脉丹（二品）、补血丹（二品）、清毒丹（二品）、续脉丹（三品）、生肌丹（三品）、养神丹（三品）、静心丹（三品）、固元丹（四品）、凝真丹（四品）、聚灵丹（四品）、清灵丹（四品）、化毒丹（四品）、回春丹（五品）、神藏丹（五品）、归元丹（五品）、延寿丹（五品）、塑魂丹（六品）、道种丹（六品）、净毒丹（六品）、天心丹（七品）、燃灯丹（七品）、逆命丹（七品）、续命丹（八品）、开天丹（八品）、万毒丹（八品）、万寿丹（九品，残方需修复）
        - 强化类：聚力丹（一品）、强骨丹（二品）、护体丹（二品）、壮筋丹（三品）、疾风丹（三品）、洗髓丹（四品）、通窍丹（四品）、狂暴丹（四品）、破境丹（五品）、铸体丹（五品）、嗜血丹（五品）、锻魂丹（六品）、战意丹（六品）、天罡丹（七品）、地煞丹（七品）、绝息丹（七品）
        - 辅助类：驱虫丹（一品）、清心丹（二品）、明目丹（二品）、传讯丹（二品）、驯兽丹（二品）、迷心丹（二品）、顺风丹（三品）、铭纹丹（三品）、聚火丹（三品）、易容丹（三品）、安胎丹（三品）、避水丹（三品）、育兽丹（三品）、幻影丹（三品）、隐息丹（四品）、破阵丹（四品）、避火丹（四品）、聚灵丹（四品）、御兽丹（四品）、摄魂丹（四品）、定风丹（五品）、遁形丹（五品）、兽心丹（五品）、幻境丹（五品）、万兽丹（六品）、万幻丹（六品）、兽皇丹（七品）、真幻丹（七品）
        - 特殊类：聚财丹（一品）、定神丹（三品）、噬灵丹（五品）、爆元丹（六品）、通灵丹（六品）、夺舍丹（七品）、化形丹（七品）、返祖丹（八品）、同归丹（八品）、改命丹（九品）
    与主角关系: 自身
    首次出场: 第1章
    状态: 存活
    备注: |
      十倍体质，上古本源印记觉醒者之子，必须隐藏身份
      丹道能力来源（总计100%）：
        - 天陨阁丹阁50%：
          - 私下学习、偷师、坑骗等非正规手段获取20%
          - 被阁主沈渊澈传承10%（阁主不知主角身份，仅因天赋赏识）
          - 在藏书阁中获得20%
        - 自己收集25%：散修阶段通过二道贩子网络、散修交流、自行摸索
        - 梧栖国继承人25%：苏若笙（私情终身）将梧栖国国库中的丹道典籍带给主角
      化名：陆沉（青岩城少城主陆沉所赠，详见"剧情_化名由来_青岩城.md"）
      化名由来：
        - 青岩城少城主陆沉（蜕凡初期）在迷雾林生死战后，将一份黑市"散修路引"赠予沈默
        - 路引为无头户籍，填有"陆沉"之名，极其珍贵
        - 沈默借用此名，以"散修陆沉"之名行走天下
        - 此举既是隐藏身份，也背负着青岩城的期望
      化名使用规则：
        1. 在宗门内部用真名，在宗门外部用化名
        2. 与可能认识沈家的人接触时用化名
        3. 执行需要隐藏身份的任务时用化名
        4. 在坊市/渊坊交易时用化名
      入宗路线：散修 → 玄天宗执事堂外门 → 天陨阁炼丹堂外门 → 炽天宗执事堂副堂主
      入宗过渡剧情：
        - 在玄天宗期间，主角洗劫了影会在烛阴大陆积攒几百年的宝库
        - 宝库位置：梧栖国一个主城商铺后院
        - 宝库内容：大量钱财、渊石、药材、几部功法
        - 逃亡协助：陆九霄（好兄弟）和苏若笙（私定终身）共同帮助主角成功逃走
        - 被影会追杀，被迫逃到不死洲（天陨阁辖区）
        - 以散修身份化名陆沉加入天陨阁丹阁
        - 追杀后续：玄天宗知道影会存在，有意清理曦和大陆内影会势力，对影会追杀进行阻挠拦截，影会被迫暗中收集
        - 影会暗中收集方式：通过梧栖国收集情报、云垂剑庭出战力、沧汐王朝出人出力、购买窃取或欺压等手段、正常商业经营获取
        - 玄天宗清理计划：大多数以当地势力按上罪名处决，少部分被暗杀清剿带回玄天宗审问囚禁
        - 影会残余势力：转移、沉淀、等待命令
        - 影会在曦和大陆分布：主要在梧栖国，其次在沧汐王朝，最后是云垂剑庭，其它地方也都有渗透
        - 影会没落状态：被主角清剿过一次后再加上玄天宗的阻挠，影会在曦和大陆已经没落，影响力和势力大不如前，在后面的剧情中基本上不会出现

      # 早期经历时间线
      2.5岁：被秘术冻结生机，沈渊礼带走
      2.5-20岁：跟随养父种田进山，普通生活
      20岁：集市偶遇蜕凡强者，萌生变强想法，被养父拒绝
      20-25岁：偷偷尝试修炼，无功法指导，进展甚微
      25岁：捡到黑衣人包裹（养元丹 + 影字令牌），开始正式修炼
      29岁：修至蜕凡初期（4年）
      30岁：修至蜕凡中（1年），养父突然消失
      蜕凡后：进入梧栖国武将选拔
      铭纹初期：以外门弟子身份加入天陨阁

      # 关键物品
      - 养元丹：温养经脉、补充精气，适合凡人打基础
      - 影字令牌：黑衣人遗留，关联潜影守廷
      - 芥子坠：养父沈渊礼消失后留下的储物法器，三品，空间五丈见方，外观如普通灰石。空间深处有封印，打不开。

  # --- 核心关联人物 ---
  - 编号: C002
    姓名: 沈渊
    官名: 堂主
    称呼:
      朋友: ["渊兄", "沈兄"]  # 至交好友
      敌人: ["沈家孽种", "天陨阁余孽"]  # 敌人/对手的蔑称
      长辈: ["沈渊", "渊儿"]  # 长辈的称呼
      正式: ["堂主", "沈堂主"]  # 正式场合
    身份: 天陨阁执事堂堂主
    宗门: 天陨阁
    境界:
      真实: 刚入开天（上古本源印记觉醒前为燃灯后，觉醒后暴涨突破开天）
      伪装: null
    年龄: 约50000岁（一万年前去世，比沈渊澈年长约2000岁）
    动机: 守护天陨阁传承，保护妻儿
    背景: |
      天陨阁阁主沈沧溟的亲弟弟，执事堂堂主，本已是一方豪强。
      上古本源印记意外觉醒后实力暴涨，天陨阁势力随之水涨船高。
      玄天宗与炽天宗同时感到威胁——若天陨阁再多一位开天境强者，三足鼎立的平衡将被打破。
      沈溯安（堂弟）暗中觊觎其血脉力量，向玄天宗泄露情报，导致三方联手施压。
      天陨阁倾力一战落败，被迫交出沈渊。
      沈渊以秘法冻结两岁半儿子（沈默）的生机，托付给最信任的堂弟沈渊礼。
      最终以秘术保全沈默后消散。
    性格: 沉稳刚毅，重情重义，对家人极为爱护，对宗门忠心耿耿
    外貌: 与沈默有几分相似但更有气势，眉宇间有一道淡淡的本源印记纹路
    技能: [执事堂秘术, 上古本源印记, 战斗法则]
    与主角关系: 生父
    首次出场: 回忆/背景
    状态: 已故（完成孩子秘术后自行消散）
    备注: |
      阁主亲弟弟，上古本源印记意外觉醒，遭诸派联手施压，天陨阁战败后被交出。
      最终以秘术保全沈默后消散。
      沈默的十倍体质和上古本源印记均来自沈渊血脉。
      沈渊之死是三宗冲突的核心导火索，也是沈默身世线的起点。

  - 编号: C003
    姓名: 沈渊礼
    官名: 管事
    称呼:
      朋友: ["渊礼", "老沈"]  # 至交好友
      敌人: ["沈家余孽", "老东西"]  # 敌人/对手的蔑称
      长辈: ["渊礼叔", "沈叔"]  # 晚辈的称呼
      正式: ["沈管事"]  # 正式场合
    身份: 天陨阁执事堂后勤管事
    宗门: 原天陨阁，现隐姓埋名于玄天宗边缘地带
    境界:
      真实: 燃灯中
      伪装: 凡人气息（常年压制境界，避免暴露）
    年龄: 约45000岁（比沈渊略小，一万年前正值壮年）
    动机: 完成堂兄遗愿，保护沈默成长，追查沈渊被出卖的真相
    背景: |
      天陨阁执事堂后勤管事，非战斗岗位，负责宗门物资调配与后勤保障。
      沈渊最信任的堂弟，两人自幼一起长大，情同手足。
      一万年前沈渊被交出前，将两岁半的沈默托付给他。
      沈渊礼连夜带沈默远遁曦和大陆西境，在远古三宗大战场附近荒山脚下隐姓埋名。
      一万年来以普通猎户身份生活，将沈默视如己出，从不提及身世。
      主角修至蜕凡中后突然消失，外出追查沈渊被出卖的真相。
    性格: 沉默寡言，心思缜密，对沈默视如己出，外表普通但内心坚如磐石
    外貌: 普通路人相貌，刻意低调，常年穿着粗布衣裳，双手粗糙如猎户
    技能: [后勤管理, 隐匿气息, 基础战斗术]
    与主角关系: 堂叔（养父）
    首次出场: 回忆/背景
    状态: 存活，隐居（主角出新手村后将外出追查沈渊被出卖真相）
    备注: |
      沈渊最信任的堂弟，带两岁半的沈默连夜远遁，在曦和大陆西境远古三宗大战场附近荒山脚下隐居。
      主线任务：追查沈渊最终被谁出卖。
      与沈溯安同为沈渊堂弟，但非亲兄弟——沈渊礼是沈渊母系堂弟，沈溯安是沈渊父系堂弟。
      沈玄策（C094）是沈渊礼之子，沈溯安的堂侄。

# 后续角色按出场顺序追加：
  - 编号: C004
    姓名: 沈溯安
    官名: 长老
    称呼:
      朋友: ["溯安", "沈兄"]  # 表面亲近
      敌人: ["叛徒", "白眼狼", "沈家逆贼"]  # 敌人/对手的蔑称
      长辈: ["溯安叔", "沈师叔"]  # 晚辈的称呼
      正式: ["沈长老"]  # 正式场合
    身份: 天陨阁长老（叛徒）
    宗门: 天陨阁
    境界:
      真实: 刚入开天
      伪装: null
    年龄: 约60000岁（比沈渊略大，渊者角度正值壮年）
    动机: |
      窃取沈渊血脉力量，突破自身瓶颈。
      沈溯安修炼万法归源数万年，卡在源初后无法寸进。
      他发现无矩血脉是万法归源体系的终极缺失——唯有融合无矩血脉，才能真正"归源"。
      沈渊的上古本源印记觉醒让他看到了这条路，但天陨阁将沈渊视为"传承之子"重点保护，拒绝分享血脉研究。
      沈溯安认为宗门"传承优先"的理念是愚忠——传承若不能为己所用，守护它毫无意义。
      玄天宗暗中许诺：交出沈渊，配合研究血脉，事成后助其突破。沈溯安权衡后选择背叛。
    背景: |
      沈渊堂弟
      比沈渊、沈渊澈年长
      天陨阁长老
      当年为窃取沈渊血脉，邀请玄天宗合作，后被炽天宗知晓强行介入，导致沈渊被交出
    性格: 阴险狡诈，城府极深，表面温文尔雅，实则心狠手辣。善于伪装，擅长在暗处布局，等待时机一击致命
    外貌: 面容清秀，常带微笑，眼神却冷如蛇蝎。手指修长如玉，实则暗藏杀机。常年穿白色长袍，与叛徒身份形成反差
    技能: []
    与主角关系: 堂叔（父亲堂弟，叛徒）
    首次出场: 待定（身世线揭露时）
    状态: 存活（第9卷末被主角击杀）
    备注: |
      第9卷末，主角（源初境）以雷霆手段镇压击杀，暴露身份。三宗相互制约达成默契收场。
      与沈渊礼同为沈渊堂弟，但非亲兄弟——沈溯安是沈渊父系堂弟，沈渊礼是沈渊母系堂弟。
      沈玄策（C094）是沈渊礼之子，沈溯安的堂侄。

  - 编号: C005
    姓名: 陆九霄
    官名: 核心弟子
    称呼:
      朋友: ["九霄", "陆大哥", "老陆"]  # 朋友/亲近人的昵称
      敌人: ["陆家小子", "伪君子", "多管闲事的"]  # 敌人/对手的蔑称
      长辈: ["陆小子", "后生"]  # 长辈的称呼
      正式: ["陆公子", "陆师兄"]  # 正式场合
    身份: 玄天宗核心弟子
    宗门: 玄天宗
    境界: 始终与主角同境界（前期先晋升，后期晚晋升）
    年龄: 30（出场时）
    动机: 行侠仗义，维护弱小，追求武道巅峰
    背景: 第一卷中与主角相识，因行侠仗义结缘，成为挚友
    性格: 初始敦厚老实 → 前期被主角坑还感谢 → 中期反应过来提防 → 后期与主角相互资助
    外貌: 身形挺拔，面容端正，眉宇间自带一股正气。常穿玄天宗制式青衫，腰悬长剑，行走间步伐沉稳
    技能:
      - 潜龙诀（隐藏气息，玄天宗中级身法，后赠予主角）
      - 天罡正法（玄天宗正统功法，浩然正气）
      - 丹道（炼制万寿丹，辅修）
    与主角关系: 兄弟（挚友）
    首次出场: 第1卷
    状态: 存活
    备注: |
      性格成长线：
      - 前期：敦厚老实，被主角多次坑还要感谢主角
      - 中期：反应过来提防主角，被少坑
      - 后期：和主角相互资助

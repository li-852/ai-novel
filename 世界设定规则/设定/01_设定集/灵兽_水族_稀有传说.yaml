# 灵兽妖兽体系 - 水族类（稀有与传说）

灵兽:

  # ───────── 水族类（稀有5种）─────────

  - 名称: 珊瑚灵龟
    别名: 珊瑚龟、导航龟
    类型: 水族
    稀有度: 稀有
    寿命: {幼年: 300-500年, 成年: 500-1500年, 壮年: 1500-4000年, 老年: 4000-8000年}
    体型: {幼年: 二尺(70cm), 成年: 四尺(130cm), 壮年: 六尺(200cm), 老年: 八尺(270cm)}
    外貌: "通体珊瑚红色，龟壳坚硬如甲，厚约二寸，边缘泛金光"
    习性: "独居，昼行，以水中灵草为主"
    能力: {主要: 寿命长、记忆海域（可记忆千里海域路线）, 辅助: 导航型, 特殊: 可在深海中自由活动}
    契约: {推荐: 通灵契约, 忠诚度: 高, 驯化难度: 高}
    栖息地: {地理: 沧汐王朝深海, 环境: 偏好深海，常栖息于珊瑚礁}
    经济价值: {价格: 成年约100000渊石, 用途: 导航、深海探索}
    备注: "导航型，沧汐王朝镇国灵兽，珊瑚灵龟可记忆千里海域路线"

  - 名称: 碧波鲸
    别名: 碧鲸、驮鲸
    类型: 水族
    稀有度: 稀有
    寿命: {幼年: 300-500年, 成年: 500-1500年, 壮年: 1500-4000年, 老年: 4000-8000年}
    体型: {幼年: 三丈(1000cm), 成年: 五丈(1670cm), 壮年: 八丈(2670cm), 老年: 十丈(3330cm)}
    外貌: "通体翠绿色，皮肤光滑，边缘泛金光"
    习性: "独居或成对，昼行，以水中灵虫为主"
    能力: {主要: 体型巨大、可驮运（可负重十万斤）, 辅助: 可在深海中自由游动, 特殊: 战斗时皮肤会泛金光}
    契约: {推荐: 通灵契约, 忠诚度: 高, 驯化难度: 极高}
    栖息地: {地理: 沧汐王朝深海, 环境: 偏好深海，常栖息于深海}
    经济价值: {价格: 成年约500000渊石, 用途: 驮运、深海探索}
    备注: "驮运型，沧汐王朝镇国灵兽，碧波鲸可驮运万吨货物远洋航行"

  - 名称: 碧眼鲸王
    类型: 水族
    稀有度: 稀有
    备注: "辅助型，灵智极高，可引导远洋船队"

  - 名称: 珊瑚蟒
    类型: 水族
    稀有度: 稀有
    备注: "珊瑚礁守护者，沧汐王朝海域特产"

  # ───────── 水族类（传说）─────────

  - 名称: 墨蛟
    别名: 黑蛟、蛟龙
    类型: 水族
    稀有度: 传说
    寿命: {幼年: 500-800年, 成年: 800-2000年, 壮年: 2000-5000年, 老年: 5000-10000年}
    体型: {幼年: 五丈(1670cm), 成年: 十丈(3330cm), 壮年: 二十丈(6670cm), 老年: 三十丈(10000cm)}
    外貌: "通体漆黑，鳞片坚硬如甲，边缘泛金光，头顶有一独角"
    习性: "独居，昼行，以灵兽为主，领地意识极强"
    能力: {主要: 上古血脉、战力极强（壮年时可抗衡源初境）, 辅助: 可操控水流（范围千丈）, 特殊: 战斗时鳞片会泛金光，威压可令下位者战力减损五成}
    契约: {推荐: 无（不可契约）, 忠诚度: 无, 驯化难度: 不可能}
    栖息地: {地理: 沧汐王朝深海, 环境: 偏好深海，常栖息于万丈深渊}
    经济价值: {价格: 无价, 用途: 战斗、威慑}
    备注: "传说型，上古血脉，墨蛟是传说中的神兽"

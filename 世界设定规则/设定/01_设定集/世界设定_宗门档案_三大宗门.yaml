# 世界设定 - 三大宗门档案
# 由 世界设定_宗门档案.yaml 拆分

  # ───────── 三大宗门 ─────────

  玄天宗:
    王朝: 曦和大陆（主宰）
    关系: 主宰
    境界层级: 超一流
    宗主: 姜道玄
    宗主境界: 掌道后
    哲学: 天罡正法，秩序为纲
    特色: 天罡正法体系（以天地正气为根基，气息浩然，克制邪祟）、秩序法则铭刻、大陆治安巡查
    文化: 宗规严明，等级分明，弟子每日晨起诵宗规三条。设有执法堂，违规者绝不姑息。长老阁下设修炼堂、炼丹堂、炼器堂、执法堂四堂
    规模: 弟子约五千人，镇宗老祖六人，长老阁长老二十余人
    关系详情: |
      曦和大陆主宰势力，辖下六王朝均受其渊石配额管控。
      各域设驻使一名（道种境），名义上是联络官，实际监控王朝动向并分配渊石配额。
      玄天宗的秩序法则深入大陆每一个角落——渊坊坊主由总坊任命，渊脉开采须经玄天宗审批。
      内部稳定但暗流涌动：六位镇宗老祖中有两位即将陨落，宗门势力格局面临剧变。
    堂口:
      修炼堂:
        堂主: 正阳
        堂主境界: 开天后
        副堂主:
          - 姓名: 清风
            境界: 开天后
          - 姓名: 明月
            境界: 开天后
      炼丹堂:
        堂主: 丹阳
        堂主境界: 掌道初期
        副堂主:
          - 姓名: 药尘
            境界: 开天后
          - 姓名: 炉心
            境界: 开天后
      炼器堂:
        堂主: 铁玄
        堂主境界: 掌道初期
        副堂主:
          - 姓名: 百锻
            境界: 开天后
          - 姓名: 锻星
            境界: 开天后
      执法堂:
        堂主: 律无情
        堂主境界: 掌道初期
        副堂主:
          - 姓名: 铁面
            境界: 开天后
          - 姓名: 寒刃
            境界: 开天后

  炽天宗:
    王朝: 烛阴大陆（主宰）
    关系: 主宰
    境界层级: 超一流
    宗主: 厉无极
    宗主境界: 掌道后
    哲学: 焚天进化术，弱肉强食
    特色: 焚天进化术体系（以极端环境淬炼肉身，强制激发潜能，凶险但突破极快）、进化试炼、潜能强制激发
    文化: 崇尚竞争，弟子之间可自由切磋甚至挑战长老，胜者取而取之。每年举办"进化试炼"，淘汰者降级。宗内设进化堂、炼体堂、征伐堂、驯兽堂
    规模: 弟子约四千人，镇宗老祖六人，长老阁长老十余人
    关系详情: |
      烛阴大陆主宰势力，影响范围内的四王朝受其进化术资源牵引。
      各王朝设"进化使"一名（道种境），推广进化术并筛选天赋异禀者入宗。
      炽天宗持续扩张，暗中联合曦曜神朝、炎铸王庭、沧汐王朝，试图打破玄天宗主导的秩序。
      三大试炼秘境（焚天渊、进化谷、弱肉原）是烛阴大陆渊者的噩梦与机遇之地。
    堂口:
      进化堂:
        堂主: 焚天老祖
        堂主境界: 掌道初期
        副堂主:
          - 姓名: 烈焰
            境界: 开天后
          - 姓名: 灼心
            境界: 开天后
      炼体堂:
        堂主: 铁骨魔尊
        堂主境界: 掌道初期
        副堂主:
          - 姓名: 铜皮
            境界: 开天后
          - 姓名: 铁臂
            境界: 开天后
      征伐堂:
        堂主: 血屠
        堂主境界: 掌道初期
        副堂主:
          - 姓名: 战狂
            境界: 开天后
          - 姓名: 杀生
            境界: 开天后
      驯兽堂:
        堂主: 万兽老人
        堂主境界: 开天后
        副堂主:
          - 姓名: 兽心
            境界: 开天后
          - 姓名: 驯龙
            境界: 开天后
    # 执事堂：宗门运转机构，独立于长老阁四堂
    执事堂:
      职能: 任务分配、资源调度、弟子考核、赏罚记录、对外交涉、秘境管理
      堂主: 待定
      堂主境界: 待定
      副堂主:
        - 姓名: 待定
          境界: 待定

  天陨阁:
    王朝: 不死洲、无间洲、铸星洲（主宰）
    关系: 主宰
    境界层级: 超一流
    宗主: 沈沧溟
    宗主境界: 源初初期
    哲学: 万法归源，传承为本
    特色: 万法归源体系（以渊脉本源为根基，兼容百家之长，不拘泥于单一功法，但修炼速度略慢）、渊脉本源修炼、传承封存
    文化: 重视传承延续，弟子入门须立誓守护宗门传承。设有传承殿封存历代功法与秘术。三堂体系（丹阁、执事堂、器阁）各有专精，互不统属
    规模: 弟子约六千人，镇宗老祖十人（含1位源初后即将陨落），长老阁长老三十余人
    关系详情: |
      三洲主宰势力，与归泉文廷（丹阁合作）、潜影守廷（执事堂合作）、星锻古朝（器阁合作）深度绑定。
      一万年前因沈渊事件元气大伤，至今未复。叛徒长老沈溯安（刚入开天）仍逍遥法外。
      传承最完整、底蕴最深厚，但封闭性使其在三宗冲突中处于守势。
      归墟宗是天陨阁"传承优先"理念的最后一道安全网。


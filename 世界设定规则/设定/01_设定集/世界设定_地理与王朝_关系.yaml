# 世界设定 - 王朝间关系
# 由 世界设定_地理与王朝.yaml 拆分

# ============================================================
# 王朝间关系
# ============================================================
王朝间关系:
  # --- 曦和大陆 ---
  # 历史：梁王朝约50年前（断渊之盟后约150年）因国力衰退被苍桢祖庭与曦曜神朝联合吞并，遗民散布两国境内，详见 货币体系.md "断渊之盟"
  曦和关系:
    - 类型: 竞争
      相关方: [曦曜神朝, 炎铸王庭]
      详情: 争夺中域资源带，边境摩擦频繁
    - 类型: 世仇
      相关方: [沧汐王朝, 陵渊守廷]
      详情: 海域与陆地边界冲突三百年，互不通商。但沧汐可通过海路与烛阴大陆其他王朝（灵螟壤域、赤藤灵廷等）通商
    - 类型: 暗盟
      相关方: [梧栖国, 赤藤灵廷]
      详情: "乐律+藤蔓联合祭祀传统，百年不断，跨大陆暗线"
    - 类型: 师承
      相关方: [云垂剑庭, 苍桢祖庭]
      详情: 剑庭初代剑尊出身祖庭，两庭有师承渊源，遇大事互相通气
    - 类型: 通商
      相关方: [沧汐王朝, 梧栖国]
      详情: 海路贸易伙伴，沧汐提供海产与航路，梧栖提供情报与预警
    - 类型: 冷淡
      相关方: [曦曜神朝, 云垂剑庭]
      详情: 神权帝制与剑道共议理念不合，双方互不干涉
    - 类型: 通商
      相关方: [曦曜神朝, 苍桢祖庭]
      详情: 圣火与地脉技术互补，边境互市繁荣
    - 类型: 通商
      相关方: [曦曜神朝, 沧汐王朝]
      详情: 圣火祭品换取海产与航路支持
    - 类型: 通商
      相关方: [炎铸王庭, 梧栖国]
      详情: 锻造器具换取灵禽传讯服务
    - 类型: 通商
      相关方: [炎铸王庭, 云垂剑庭]
      详情: 锻造器具换取剑道护卫
    - 类型: 通商
      相关方: [炎铸王庭, 苍桢祖庭]
      详情: 锻造器具换取地脉矿产开采权
    - 类型: 通商
      相关方: [炎铸王庭, 沧汐王朝]
      详情: 锻造器具换取海路运输
    - 类型: 冷淡
      相关方: [梧栖国, 苍桢祖庭]
      详情: 无直接利益交集，偶有灵禽误入祖庭领空引发小摩擦
    - 类型: 冷淡
      相关方: [云垂剑庭, 沧汐王朝]
      详情: 剑道与海商无交集，双方互不往来

  # --- 烛阴大陆 ---
  烛阴关系:
    - 类型: 互助
      相关方: [陵渊守廷, 玄缄古廷]
      详情: 岩层建造+封藏技术互补，联合开发地下宜居空间
    - 类型: 竞争
      相关方: [灵螟壤域, 赤藤灵廷]
      详情: 御兽vs灵藤，争夺荒壤改造主导权
    - 类型: 冷淡
      相关方: [玄缄古廷, 赤藤灵廷]
      详情: 理念不合——一个主张封存古法，一个主张活化培育
    - 类型: 通商
      相关方: [陵渊守廷, 赤藤灵廷]
      详情: 岩层建材换取灵藤疗愈服务
    - 类型: 竞争
      相关方: [陵渊守廷, 灵螟壤域]
      详情: 争夺地下矿脉与冻土改造主导权
    - 类型: 互助
      相关方: [灵螟壤域, 玄缄古廷]
      详情: 御兽帮助开辟地下空间，缄石封藏技术保存兽类标本
    - 类型: 通商
      相关方: [赤藤灵廷, 玄缄古廷]
      详情: 虽理念不合但灵藤纤维与缄石匣存在实际贸易需求

  # --- 跨大陆暗通（炽天宗联合线）---
  跨大陆秘密:
    - 相关方: [炽天宗, 曦曜神朝]
      详情: 进化圣火技术交换，强化曦曜神权正统性
    - 相关方: [炽天宗, 炎铸王庭]
      详情: 火山地火进化改造技术，锻造更高品质法器
    - 相关方: [炽天宗, 沧汐王朝]
      详情: 烛阴大陆沿海港口使用权，换取远洋贸易通道
    - 相关方: [炽天宗, 梧栖国]
      详情: 情报换资源，炽天宗以烛阴大陆独家情报换取梧栖国的曦和大陆情报，少量进化术碎片流入梧栖
    - 相关方: [梧栖国, 归墟宗]
      详情: 凤鸣宗宗主羽清商与燃灯旧交，飞鸟传讯暗线
    - 相关方: [沧汐王朝, 灵螟壤域]
      详情: 海产换灵兽皮革，远洋贸易延伸至烛阴大陆腹地
    - 相关方: [四海商会, 陵渊守廷]
      详情: 碧渊海峡堵塞后，四海商会开辟绕行航路，与陵渊守廷建立地下走私通道
    - 相关方: [归泉文廷, 赤藤灵廷]
      详情: 无直接交集——归泉文廷专注丹道传承，赤藤灵廷专注灵藤疗愈，两者疗愈体系不同源，无技术交流

# 军事编制与境界对应
军事层级:
  说明: 多国边境时有摩擦，以下为通用编制标准。各国大同小异，差异体现在装备和功法传承上
  边境冲突:
    频率: 常态化，小规模摩擦每月数起，大规模冲突数年一次
    性质: 多为渊脉资源点争夺、商路控制权、边境村庄归属
    升级: 百人队级摩擦→千人队级对峙→万人队级战争（罕见，需王朝层面批准）
  军衔:
    - 军衔: 百人队长
      境界要求: 蜕凡初期
      备注: 有官身，领朝廷俸禄，是军队最基层的渊者骨干
      月薪: 约20-30渊石（由王朝发放）
      典型年龄: 25-40岁
    - 军衔: 千人队长
      境界要求: 蜕凡中及以上
      备注: 统辖一营，独立执行边境巡逻和小型作战任务
      月薪: 约50-80渊石
      典型年龄: 40-60岁
    - 军衔: 万人队长
      境界要求: 铭纹初期或即将进入铭纹
      备注: 统辖一军，可独当一面镇守边境要塞
      月薪: 约150-300渊石
      典型年龄: 60-100岁
    - 军衔: 十万人统帅
      境界要求: 铭纹中后
      备注: 统辖方面军，镇守一方边境或战略要地
      月薪: 约500-800渊石
      典型年龄: 100-200岁
    - 军衔: 大将军
      境界要求: 凝真初期
      备注: 统辖一国之兵，战时最高军事指挥
      月薪: 约1000-2000渊石
      典型年龄: 200-500岁
    - 军衔: 总将军
      境界要求: 神藏初期
      备注: 全国军事最高长官，仅王朝受到重大威胁时才亲自出手
      月薪: 约3000-5000渊石
      典型年龄: 500岁以上
  征兵:
    来源: 凡人参军为义务制，渊者参军为招募制（丰厚俸禄+渊石供给+功法赏赐）
    留任: 渊者军人服役满二十年可获"军勋渊印"标记，兑换渊石时享受更低抽水（最低可至0.5%）
  装备:
    标准配发: 凡人士兵配发铁制兵器+皮甲；蜕凡队长配发一品法器+灵铜甲
    精锐: 千人队长以上配发二品法器，万人队长以上配发三品法器
    特殊: 大将军以上法器由王朝特供，品阶不固定

# 商队护卫等级
商队:
  - 规模: 小型商队
    货物价值: 通常100大纹以下
    护卫: 武力较高的凡人压队，人数2-5人
    典型路线: 本城到邻城（百里以内）
    风险: 低，主要防小股流寇和野兽
  - 规模: 中型商队
    货物价值: 100-1000大纹
    护卫: 1-2名蜕凡低阶渊者压队，另有凡人护卫5-10人
    典型路线: 跨城（数百里）
    风险: 中等，可能遭遇蜕凡境散修劫匪
  - 规模: 大型商队
    货物价值: 1000大纹以上（含渊石、高阶丹药法器等）
    护卫: 约3名蜕凡高阶或铭纹初期渊者压队，另有蜕凡低阶护卫5-10人（不固定，根据货物价值调整）
    典型路线: 跨域或跨大陆
    风险: 高，需应对劫匪团伙和灵兽袭击
护卫费用:
    参考: 散修护送百里约5-10渊石（蜕凡），20-30渊石（铭纹）
    谈判: 视路线凶险程度、货物价值、预计行程天数而定
商队规则:
    - 商队挂靠渊坊或大商会可获"商旗"标识，劫匪忌惮背后势力不敢轻易动手
    - 跨域商队需在沿途渊坊办理"过境凭证"，缴纳过境税
    - 商队遭遇渊者劫匪时，凡人护卫基本无用，核心依赖渊者压队

# 城铺与拍卖体系
城铺体系:
  结构: 每个大城设一间大铺（通常为该城最大商号或宗门产业），对应势力辖下小城设分铺
  拍卖:
    位置: 仅大铺设有拍卖场所
    频率: 大城每月一场，重大节日加场
    物品: 三品以上丹药、三品以上法器、珍稀灵药、极品渊石、上古残卷、秘境入场资格等
    规则:
      - 入场需缴纳保证金（按拍品底价10%），竞拍不中全额退还
      - 成交后抽取5-10%佣金
      - 匿名竞拍（面具或编号制），保护买家身份
      - 拍品由大铺鉴定师估价，卖家可设定底价，低于底价流拍
    规模: 大城拍卖场可容纳200-500人，顶级拍卖（如王朝级）可超千人
  铺位层级:
    - 层级: 大铺
      位置: 大城（朝都、重镇）
      特点: 拍卖场、高级鉴定师、渊石结算、渊坊过账
      典型库存: 三品以下丹药法器常备，三品以上定期拍卖
    - 层级: 分铺
      位置: 中小城镇
      特点: 普通交易、小额渊石结算
      典型库存: 二品以下丹药法器常备，高阶品需向大铺调货
    - 层级: 坊市摊位
      位置: 各城坊市
      特点: 散修自产自销、地摊交易
      典型库存: 一品以下丹药、灵药原材料、渊烬

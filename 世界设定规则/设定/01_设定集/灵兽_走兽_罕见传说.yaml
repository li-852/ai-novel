# 灵兽妖兽体系 - 走兽类（罕见与传说）

灵兽:

  # ───────── 走兽类（罕见4种）─────────

  - 名称: 岩甲龟
    别名: 岩龟、重装龟
    类型: 走兽
    稀有度: 罕见
    寿命: {幼年: 200-300年, 成年: 300-800年, 壮年: 800-2000年, 老年: 2000-5000年}
    体型: {幼年: 三尺(100cm), 成年: 五尺(170cm), 壮年: 七尺(230cm), 老年: 九尺(300cm)}
    外貌: "通体灰褐色，龟壳坚硬如甲，厚约三寸"
    习性: "独居，昼行，以灵草为主"
    能力: {主要: 防御极强（龟壳可抵御灵器攻击）、寿命长, 辅助: 可负重千斤, 特殊: 战斗时会缩入龟壳，几乎无敌}
    契约: {推荐: 通灵契约, 忠诚度: 高, 驯化难度: 中}
    栖息地: {地理: 曦和大陆各域山地, 环境: 偏好干燥，常栖息于岩石地带}
    经济价值: {价格: 成年约50000渊石, 用途: 防御、驮运}
    备注: "防御型战兽，岩甲龟的龟壳是制作重甲的上等材料"

  - 名称: 烈焰狮
    别名: 火狮王、统御狮王
    类型: 走兽
    稀有度: 罕见
    寿命: {幼年: 150-200年, 成年: 200-500年, 壮年: 500-1200年, 老年: 1200-3000年}
    体型: {幼年: 五尺(170cm), 成年: 八尺(270cm), 壮年: 一丈二(400cm), 老年: 一丈五(500cm)}
    外貌: "通体赤红色，鬃毛呈深红色，边缘泛金光"
    习性: "群居五十至百只，昼行，以灵兽为主"
    能力: {主要: 统御型（可统御大型兽群）、战力强, 辅助: 可释放火系渊能（范围百丈）, 特殊: 战斗时鬃毛会泛金光，威压可令下位者战力减损三成}
    契约: {推荐: 通灵契约, 忠诚度: 极高, 驯化难度: 极高}
    栖息地: {地理: 曦和大陆南域火山地带, 环境: 偏好炎热，常栖息于火山口附近}
    经济价值: {价格: 成年约200000渊石, 用途: 战斗、统御}
    备注: "统御型战兽，炽天宗镇宗灵兽，烈焰狮可统御大型兽群"

  - 名称: 玄蟒
    别名: 黑蟒王、巨蟒王
    类型: 走兽
    稀有度: 罕见
    寿命: {幼年: 200-300年, 成年: 300-800年, 壮年: 800-2000年, 老年: 2000-5000年}
    体型: {幼年: 三丈(1000cm), 成年: 五丈(1670cm), 壮年: 八丈(2670cm), 老年: 十丈(3330cm)}
    外貌: "通体漆黑，鳞片坚硬如甲，边缘泛微光"
    习性: "独居，夜行，以灵兽为主"
    能力: {主要: 上古血脉、缠绕型（可缠绕敌人致死）, 辅助: 可喷射毒液（范围十丈）, 特殊: 战斗时鳞片会泛微光}
    契约: {推荐: 通灵契约, 忠诚度: 中等, 驯化难度: 极高}
    栖息地: {地理: 灵螟壤域深山老林, 环境: 偏好阴暗潮湿，常栖息于地底洞穴}
    经济价值: {价格: 成年约300000渊石, 用途: 战斗、缠绕}
    备注: "上古血脉，战力极强，玄蟒是灵螟壤域的镇域灵兽"

  - 名称: 赤鬃狮王
    类型: 走兽
    稀有度: 罕见
    备注: "统御型，炽天宗镇宗灵兽之一"

  # ───────── 走兽类（传说2种）─────────

  - 名称: 碧眼狐
    别名: 碧狐神、幻狐神
    类型: 走兽
    稀有度: 传说
    寿命: {幼年: 200-300年, 成年: 300-800年, 壮年: 800-2000年, 老年: 2000-5000年}
    体型: {幼年: 二尺(70cm), 成年: 三尺(100cm), 壮年: 四尺(130cm), 老年: 五尺(170cm)}
    外貌: "通体灰白色，毛发柔软光滑，边缘泛金光"
    习性: "独居，夜行，以灵虫为主"
    能力: {主要: 上古血脉、幻术极强, 辅助: 可迷惑敌人, 特殊: 幻术范围可达千丈}
    契约: {推荐: 通灵契约, 忠诚度: 极高, 驯化难度: 极高}
    栖息地: {地理: 曦和大陆各域森林, 环境: 偏好阴暗，常栖息于古树洞穴}
    经济价值: {价格: 无价, 用途: 幻术、迷惑}
    备注: "上古血脉，幻术极强，碧眼狐是传说中的幻狐神"

  - 名称: 玄铁犬
    别名: 铁犬神、护卫犬神
    类型: 走兽
    稀有度: 传说
    寿命: {幼年: 300-500年, 成年: 500-1500年, 壮年: 1500-4000年, 老年: 4000-8000年}
    体型: {幼年: 四尺(130cm), 成年: 六尺(200cm), 壮年: 八尺(270cm), 老年: 一丈(330cm)}
    外貌: "通体漆黑，毛发坚硬如甲，边缘泛金光"
    习性: "独居，昼行，以灵兽为主"
    能力: {主要: 上古血脉、战力极强（壮年时可抗衡开天境）, 辅助: 可释放金光（范围百丈）, 特殊: 战斗时毛发会泛金光，威压可令下位者战力减损三成}
    契约: {推荐: 通灵契约, 忠诚度: 极高, 驯化难度: 极高}
    栖息地: {地理: 曦和大陆各域城镇, 环境: 偏好温暖，常栖息于人类居所附近}
    经济价值: {价格: 无价, 用途: 战斗、护卫}
    备注: "传说型，上古血脉，玄铁犬是传说中的护卫犬神"

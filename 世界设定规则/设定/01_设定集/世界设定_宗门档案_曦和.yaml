# 世界设定 - 曦和大陆宗门档案
# 由 世界设定_宗门档案.yaml 拆分

宗门档案:

  # ───────── 曦和大陆 ─────────

  金乌宗:
    王朝: 曦曜神朝
    关系: 扶持
    境界层级: 一流
    宗主: 炎昼
    宗主境界: 开天
    哲学: 圣火铸魂，金乌涅槃
    特色: 圣火修炼法、火焰操控术、净化瘴气之术
    文化: 弟子入门须在圣火前立誓，修至凝真方可离宗游历。宗内设"金乌台"，每逢日食举办祭火大典，全宗弟子以渊能共燃圣火，火柱冲天可达百丈
    规模: 弟子约三千人，长老十二人
    关系详情: 曦曜神朝提供圣火祭坛与火脉资源，金乌宗为神朝培养日冕骑士与圣火祭司。每逢神朝征战，金乌宗必遣长老随军

  律法宗:
    王朝: 曦曜神朝
    关系: 合作
    境界层级: 二流
    宗主: 钟离衡
    宗主境界: 道种
    哲学: 以律明道，以法安民
    特色: 律法编纂、契约篆刻、因果推演术
    文化: 宗内藏有曦和大陆最完整的法典碑林，共三千六百碑，记载历代判例。弟子每日晨起诵律三条，违者抄律百遍
    规模: 弟子约八百人，长老五人
    关系详情: 为曦曜神朝提供律法仲裁与典籍编纂，神朝重大判决须有律法宗长老见证

  烈阳宗:
    王朝: 曦曜神朝
    关系: 同域独立
    境界层级: 三流
    宗主: 阳破晓
    宗主境界: 凝真
    哲学: 烈日当空，万物皆明
    特色: 日光淬体术、阳炎掌、光遁术
    文化: 弟子以日出为号起修，日落收功，从不夜间修炼。宗主阳破晓口头禅"日出即焚"，意为日出之后一切阴暗无所遁形
    规模: 弟子约三百人，长老二人
    关系详情: 独立运作，偶尔与金乌宗论道切磋，但无从属关系

  炙息宗:
    王朝: 曦曜神朝
    关系: 同域独立
    境界层级: 三流
    宗主: 赤霞子
    宗主境界: 凝真
    哲学: 圣火余烬亦可暖人
    特色: 圣火余烬疗愈术、火毒祛除、经脉温养
    文化: 弟子皆须习得基础疗愈之术方可出宗。赤霞子常领弟子走街串巷义诊，不收诊金，只求一顿热饭。民间称炙息宗弟子为"暖手郎中"
    规模: 弟子约两百人，无长老，宗主一人统管
    关系详情: 独立运作，与曦曜神朝无来往，但神朝百姓多受其惠

  炎铸宗:
    王朝: 炎铸王庭
    关系: 扶持
    境界层级: 一流
    宗主: 铁棠
    宗主境界: 开天
    哲学: 千锤百炼，器成通神
    特色: 地火锻造术、灵矿冶炼、法器铸造
    文化: 弟子入门须独立锻成一件铁器，否则不得拜师。宗内设"百锻崖"，弟子每日在崖上以地火锻体，体魄远超同境渊者
    规模: 弟子约两千五百人，长老十人
    关系详情: 炎铸王庭提供火山地火与矿脉资源，炎铸宗为王庭打造城防护甲与农用器械

  火山宗:
    王朝: 炎铸王庭
    关系: 同域独立
    境界层级: 二流
    宗主: 熔不归
    宗主境界: 道种
    哲学: 与火共生，以岩为家
    特色: 火山勘测、岩浆导流、耐火材料研制
    文化: 弟子常年驻守火山口观测岩浆动向，为周边村落预警火山灾害。熔不归常年蹲在火山口研究岩浆，衣服烧了大半也不在乎
    规模: 弟子约五百人，长老三人
    关系详情: 独立运作，但火山预警服务惠及炎铸王庭全境

  耐火宗:
    王朝: 炎铸王庭
    关系: 同域独立
    境界层级: 三流
    宗主: 陶不裂
    宗主境界: 凝真
    哲学: 千度不裂，万火不侵
    特色: 耐火砖窑建造、高温材料炼制、窑炉控温术
    文化: 宗内弟子以建造窑炉为修行，每人须独立建成三座不同用途的窑炉方可出师。陶不裂口头禅"这窑不行"，对窑炉品质要求极高
    规模: 弟子约一百五十人，无长老
    关系详情: 独立运作，为周边村镇建造窑炉，收取微薄报酬

  凤鸣宗:
    王朝: 梧栖国
    关系: 合作
    境界层级: 一流
    宗主: 羽清商
    宗主境界: 开天
    哲学: 凤鸣九天，百鸟朝宗
    特色: 百禽御使术、音律攻击、凤鸣传讯
    文化: 宗内弟子皆通晓百禽言语，可同时驱使数十只灵禽。鸾后继位须凤鸣宗宗主见证，宗主以凤鸣为号，百鸟齐鸣即为天命认可
    规模: 弟子约一千八百人，长老八人
    关系详情: 鸾后继位需凤鸣宗宗主见证，双方深度协作。宗主羽清商与归墟宗燃灯有旧交，是天陨阁与玄天宗之间非正式沟通暗线

  百禽宗:
    王朝: 梧栖国
    关系: 同域独立
    境界层级: 二流
    宗主: 羽千啼
    宗主境界: 道种
    哲学: 万物有灵，百禽皆友
    特色: 灵禽驯养、鸟语通译、飞羽传书
    文化: 宗内养有三百余种灵禽，弟子各选一种灵禽为伴，终生不离。羽千啼能同时与三十只鸟对话，说话时习惯性夹杂鸟鸣
    规模: 弟子约六百人，长老四人
    关系详情: 独立运作，但百禽宗的灵禽传讯网络常被梧栖国借用

  和音宗:
    王朝: 梧栖国
    关系: 同域独立
    境界层级: 三流
    宗主: 律无弦
    宗主境界: 凝真
    哲学: 大音希声，以心听道
    特色: 音律疗愈、心绪安抚、渊能共鸣术
    文化: 弟子入门须闭目三日，以心感知音律。宗主律无弦双耳失聪，靠感知渊能波动辨别音律，反而比常人更敏锐。宗内从不大声喧哗，交流多用手势
    规模: 弟子约两百人，无长老
    关系详情: 独立运作，和音宗的疗愈音律常被各方势力借用

  栖霞宗:
    王朝: 梧栖国
    关系: 同域独立
    境界层级: 三流
    宗主: 云织锦
    宗主境界: 凝真
    哲学: 织霞为衣，裁云作裳
    特色: 羽衣织造、云霞染色、防护织物炼制
    文化: 宗内弟子以织造为修行，每日织布两个时辰。云织锦手艺精湛但脾气古怪，只给看顺眼的人做衣服。宗内出品的羽衣轻如蝉翼却坚韧如铁
    规模: 弟子约一百八十人，无长老
    关系详情: 独立运作，但栖霞宗羽衣是梧栖国对外贸易的重要商品

  七峰剑宗:
    王朝: 云垂剑庭
    关系: 深度绑定
    境界层级: 一流
    宗主: 七位剑尊共治
    宗主境界: 开天
    哲学: 七峰七道，殊途同归
    特色: 七种剑道流派（快剑、重剑、柔剑、阵剑、意剑、气剑、驭剑）
    文化: 七座浮岛各有一位剑尊，各峰剑道流派不同。弟子入门选峰拜师，一生只修一脉。七峰联动大阵可阻隔天灾风暴。重大事务以剑意共鸣表决
    规模: 弟子约两千人，剑尊七人
    关系详情: 七峰即七岛，剑尊即统治者，宗门与王朝一体两面

  游剑宗:
    王朝: 云垂剑庭
    关系: 同域独立
    境界层级: 二流
    宗主: 浪无痕
    宗主境界: 道种
    哲学: 剑在四方，道在脚下
    特色: 游历剑法、轻功身法、野外生存术
    文化: 弟子不设固定山门，以游历为修行。每三年在某处集合一次，交流见闻与剑道心得。浪无痕居无定所，宗门事务全靠飞剑传书遥控，十年不回宗一次
    规模: 弟子约四百人，长老二人
    关系详情: 独立运作，游剑宗弟子行走四方化解纷争，与七峰剑宗互不干涉

  剑鞘宗:
    王朝: 云垂剑庭
    关系: 同域独立
    境界层级: 三流
    宗主: 匣中鸣
    宗主境界: 凝真
    哲学: 剑在鞘中鸣，意在鞘外生
    特色: 剑鞘铸造、剑气封存、剑器养护
    文化: 宗内弟子以铸鞘为修行，每人须为十柄不同品质的剑配鞘方可出师。匣中鸣听剑鸣便知鞘合不合，闭眼摸鞘即断品质。宗内藏有三百年前某位剑尊的佩剑残鞘，是镇宗之宝
    规模: 弟子约一百二十人，无长老
    关系详情: 独立运作，但七峰剑尊的剑鞘多出自剑鞘宗

  灵枢宗:
    王朝: 苍桢祖庭
    关系: 合作
    境界层级: 一流
    宗主: 玄壤
    宗主境界: 开天
    哲学: 地脉为枢，万物为机
    特色: 地脉操控术、灵脉勘测、地层塑形
    文化: 弟子入门须赤足立于灵脉节点三日，感知地脉流动方可入门。宗内设"灵脉图"，记载曦和大陆全部已知灵脉走向
    规模: 弟子约一千五百人，长老七人
    关系详情: 与苍桢祖庭地脉技术互补，联合开发灵脉资源

  地听宗:
    王朝: 苍桢祖庭
    关系: 同域独立
    境界层级: 二流
    宗主: 谷回声
    宗主境界: 道种
    哲学: 地有千言，侧耳可闻
    特色: 地脉异动侦测、地震预警、地底声波解析
    文化: 弟子常年趴在地上修行，以耳贴地感知百里外地脉异动。谷回声常年灰头土脸，但对地脉异动的判断从未出错。宗内设有"地听鼓"，可放大地底声波
    规模: 弟子约四百人，长老三人
    关系详情: 独立运作，但地听宗的预警信息常被苍桢祖庭采纳

  木栖宗:
    王朝: 苍桢祖庭
    关系: 同域独立
    境界层级: 三流
    宗主: 林无涯
    宗主境界: 凝真
    哲学: 以树为家，与林共生
    特色: 灵木培植、树屋建造、林地养护
    文化: 宗内弟子皆住在树屋中，从不落地居住。林无涯在树上住惯了，到平地反而站不稳。宗内最大的灵木已活三千年，树冠可遮蔽半座山
    规模: 弟子约一百六十人，无长老
    关系详情: 独立运作，守护苍桢祖庭边陲林地

  潮音宗:
    王朝: 沧汐王朝
    关系: 扶持
    境界层级: 一流
    宗主: 汐九渊
    宗主境界: 开天
    哲学: 潮起潮落，皆是道音
    特色: 水系操控术、潮汐功法、海啸平息术
    文化: 弟子入门须在深海中闭气三日，以心感知潮汐节律。宗内设"听潮阁"，弟子每日在阁中聆听潮声修炼。汐九渊可同时操控九道海潮
    规模: 弟子约一千二百人，长老六人
    关系详情: 沧汐王朝提供海域管辖权，潮音宗为王朝平息海啸、守护航路

  海商宗:
    王朝: 沧汐王朝
    关系: 合作
    境界层级: 二流
    宗主: 潮生财
    宗主境界: 道种
    哲学: 商通四海，利济万民
    特色: 海路勘测、贸易法术、远洋导航
    文化: 宗内弟子以经商为修行，每人须独立完成一次远洋贸易方可出师。潮生财精打细算到极致，宗门账本比功法秘籍还厚。宗内设有"海图殿"，收藏全海域最完整的航海图
    规模: 弟子约五百人，长老三人
    关系详情: 为沧汐王朝管理远洋贸易与海上商路，王朝税收三成来自海商宗

  航标宗:
    王朝: 沧汐王朝
    关系: 同域独立
    境界层级: 三流
    宗主: 灯不灭
    宗主境界: 凝真
    哲学: 一灯如豆，可照万里
    特色: 航标建造、灯塔术法、海雾驱散术
    文化: 宗内弟子分散驻守各处灯塔，维护航标运行。灯不灭守灯塔守出执念，灯灭一刻就浑身难受。宗内最古老的灯塔已燃八百年，从未熄灭
    规模: 弟子约一百人，无长老，分散驻守
    关系详情: 独立运作，但航标宗守护的航道是沧汐王朝海上贸易的命脉

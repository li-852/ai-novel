# 世界地图 - 二陆三洲
# 坐标系：100x100 平面网格，原点左下角
# 数据源：AI 读写此文件，人通过 HTML 查看

map:
  width: 100
  height: 100
  background: "#0a0a1a"

# 地形图例
terrain:
  water:    { char: "~", color: "#1a3a5c", name: "水域" }
  plain:    { char: ".", color: "#2a4a2a", name: "平原" }
  forest:   { char: "*", color: "#1a5c1a", name: "森林" }
  mountain: { char: "^", color: "#4a4a4a", name: "山脉" }
  highland: { char: "#", color: "#6a6a6a", name: "高山" }
  desert:   { char: "o", color: "#5c4a1a", name: "沙漠" }
  swamp:    { char: "≈", color: "#2a4a3a", name: "沼泽" }
  ice:      { char: "◇", color: "#8ab4f8", name: "冰原" }
  volcano:  { char: "▲", color: "#8b0000", name: "火山" }
  ruins:    { char: "□", color: "#5a5a5a", name: "遗迹" }
  river:    { char: "-", color: "#2a5a8a", name: "河流" }
  lake:     { char: "○", color: "#1a4a6c", name: "湖泊" }


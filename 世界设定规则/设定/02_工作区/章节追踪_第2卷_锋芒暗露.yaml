- 章节: 第1卷 第265章
  时间: 离宗前夜至次日南门
  摘要: 芥子坠第二层自解半指，滑出一枚老写法旧铜牌（背面「沈渊」，第三字缺一笔）与书信第一行「若你已站在玄天宗山下，就当我死在了外面」；沈默确认父亲来过玄天宗，铜牌缝进棉袄左胸；南门告示有左手拇指旧印，商队车里有人喊「沈公子，小默」
- 章节: 第001章
  时间: 离山第三日至第五日（西道，离山四十里至回丰栈外）
  摘要: 沈默不追车，在窄口缝鞋底等价车赶上；以干粗活抵一碗糖水，随队两天被唤「补鞋的」；帘后老人验其右手茧位——「茧的位置对，掌根不对」，自陈三十年前在糊册子铺里见过这只手；告知永泉驿寄存物三日前被人持同齿口令牌取走，牌上凿的是「沈」字；同路已死三人，第三个是周砚，伤在背上「肩头进腰眼出」；车队不住回丰栈，老人以左拧拇指印作保不报名；临别留话「桥是新的，桥墩是旧的」，沈默独行道上多出一枚孤零零的马蹄印
- 章节: 第007章
  时间: 离山第六日至第七日（过桥、永泉驿、空窑一夜）
  摘要: 先看桥墩——九个墩六个錾痕收势同往左带，桥面新木铺旧墩；道边翻货车泥未干；永泉驿只剩壳，柜上十二个钉眼十一个钉，第十一个位置木头抠得发白；「沈渊」旧铜牌边沿对得上柜面凹弧却按不动，据此推出当年按柜的人左手托卷；井台石条下压一枚「永」字钱、背面新锉；起开柜后第三块活砖，得两遍蜡的纸卷——一截新麻绳头与半页焦纸，草字与药园领货单同路数，落款一笔横钩起手重往左带（与第1卷 第210章副堂主落款同源），跟养父那一挑收法两样；井绳桩上绕两圈且带水，他自己只绕一圈；窑洞老人耳朵背、剥柳条皮按月卖，一句「下雪天收皮的不走西道」把翻车日子戳漏；夜里井那边响三下又一下，石盖挪开两指、绳空垂而桶浮；天亮老人不见，石盖复位、绳改成他的绕法
- 章节: 第013章
  时间: 离山第七日晌午（桥头石匠棚下，半个时辰）
  摘要: 邵伯验麻绳头——顺股、东城麻，西道三十里无人编绳；看桥墩錾痕即断「拿錾的人左手缺半根食指」，摊自己的手自证（他缺的是右手指，使不了錾，改教人）；锉去铸钱监名的钱与凿上名字去查牌是一桩活的两种做法；焦纸右下角那道横钩是刀尖划的，划的人右手腕有劲指头短；桥板上沿三道痕是「数人头」不是数日子，底下那一点是刻号；沈默搬三块垫脚石藏力，被邵伯凭地上白痕与落脚深浅点破「你是渊者」「你伤没好利索就上路」，教他用杠省法，拿一把炒米抵眼看；邵伯自陈錾子四年前腊月被一个结巴、立皮领、往西过桥的人借走三个铜子不还；沈默把錾子塞进靴筒最底（与当年焦纸卷同位），錾杆「永」字下多一个小米点，是左手按杆右手下刀刻的；邵伯说明日替人抹平桥墩六处錾口——抹过的石头不认人
- 章节: 第019章
  时间: 离山第八日至第九日（桥西土地祠一夜、桥东往南岔口）
  摘要: 沈默替邵伯按了半刻灰桶，眼看桥墩六处錾口被稠石灰抹平；东归商队傍晚并上来，他喝了那碗水却没上车，换来一句「周砚也宿随便」；宿桥西二里土地祠，睡前在匣盖缝压一根三寸麻线、把「永」字钱字面朝上压在草铺左角、錾子布退折成两道；夜半有人脚掌先落进祠，翻得极规矩——麻绳头举到月光下看过再按原角搁回、纸一页一页地翻，在他草铺三步外站住，沈默把气压到第四息，用「晒苍术站下风口」的老法子把气从鼻子外头散出去；天亮东西全复位，只有那枚钱翻成锉面朝上，抖草铺抖出桥头那种稠石灰；墙豁口外一枚薄底脚印，比他的草鞋小半寸、脚跟不落全——第五回量这个大小，他用脚扫平；桥头跛腿骑手递来一张墨拓：「沈渊」旧铜牌缺角，缺口沿上一圈极细凿点，是有人拿小錾把那一笔起掉后又抹平的，「我们先生只拓两样：账，和别人欠账的凭据」；跛腿传话叫他别走南岔口——「那条他走过，桥上有人数人头」；茶棚两人说先生给三个死人都烧过纸、烧的时候不问姓；南岔口旧石碑东侧添了第四道刻痕、底下一样点了米，痕斜指西南，碑前新扫过的路面没有一个脚印
- 章节: 第025章
  时间: 离山第十日（碑指西南、干河沟、烧塌砖窑，当日出沟往南）
  摘要: 沈默沿西南干河沟寻到一座烧塌砖窑：窑壁錾口起手重收势往左带（结巴在此修过錾），窑门石上杠痕最深；窑内横两块从桥上拆下的旧桥板，板上沿四道刻痕（三道等距、第四道离得远、底下同样点米），第四道新刻、绕开钉眼；火塘边一块石头叫人坐得发亮，摆正一双布鞋——前掌磨平、脚跟几乎没磨；桥板下压着一沓三十六张窄条，写的不是货而是牌：记斤两一栏、记齿一栏（牌一齿三／牌二齿二），末三张「牌」栏空着、补一行抖笔小字辨出「待」「名」；三年前腊月一张「牌一，齿二，寄存，沈」，十月一张「牌一，齿二，取讫，沈」，中间一张只有「周」、纸角被钝器压出圆凹；他取领夹中焦纸并上去，撕口一根一根咬住——那半页是从这本册子上撕下的，抬头「回丰栈」，底下三个铺名，第三个铺名后多两字「东巷」；他用邵伯的錾把「南域」关防木牌槽里自己报过的两个字起掉，起完拿指腹抹平，抹法与那张墨拓上铜牌缺口的抹法一模一样；窑口来了东巷那个抱炭条的孩子，自陈昨夜翻包袱的是两个人——一个翻、一个看着他，并叫他描石头上钱压的角与面朝哪边，天亮那人把描过的纸收了；孩子转话：「先生说你见了拓就会往这头走，说你走对了；这一趟你要没走对，明年开春他也得自己跑一趟」；又说「先生的手不是拿来认人的，是拿来记账的，对不住你这一回」；沈默三十六张一张没抽，只留下自己本来就有的那一角，出沟二里在土坎下坐了一刻，把包袱绳重打一遍结，往南
- 章节: 第031章
  时间: 离山第十一日（出干河沟往南过两道卡，夜宿土地庙）
  摘要: 哨卡验关防，牌上无名被扣半个时辰；吏用针在槽里挑出一星铜屑——凿名的刀先凿过铜再凿这块木，那天凿名的人手边不止一块牌；吏写一旬纸押手印放行，说第二卡起要上探渊器，又说起他见过四块无名牌、头一块的主人后来叫人抬回去、身上无伤只是不动；卡外一抱孩子的妇人牌上有名、名上一道后描墨杠被驳回，她说"我没名，牌上有"；塌方路段他用邵伯教的长别杠法翻下青石，工头认出"邵瘸子的杠法"、说邵自己就是叫西道上的人办走的，拒他帮工；第二卡探渊器贴掌，针往右跳两格即停，管器吏说上回跳两格的是个背人的、背到半路人死了；道旁六车封蜡缸，缸外缠麻、辕上烙着笔画往两边撇的不识字、第三车蜡裂渗出一线不反光的黑；夜宿土地庙遇一说话利索的男人，自称走这条道三十年、认得錾上"我的号"，开口先问井台底下那枚铜钱；沈默谎称没见过、右手往袖口挪了半寸又收回；那人说錾是他三十年前给邵伯的、"使到最后会刻在拿它的人手上"，怀里纸角三字中为"回"末为"栈"，末了叫沈默天亮前把錾丢在卡上案头，别送到他手里
- 章节: 第037章
  时间: 离山第十二日晨至午后（大车店、脚线上岭、第二道梁）
  摘要: 他天亮前回到卡上把錾压回案头，走三步又回来收回，"不丢了"；大车店把头要他换麻底（四十文，剪银找铜子、添十四文凑四十），他把草鞋摆正在门槛泥地不带走；过岭价十五文或顶半程，他选顶，另要一个鸡蛋；规矩是押牌凭烙饼印取、三天为限，徒弟小满从槽里刮出那星铜，问木牌为何有铜，他把话推给师父；他看出第三辆车辐条裂，把头敲下铁箍咬住裂口，说"捆药材的眼睛看不得车"；他认出崖下翻车旁石上挂着一只布鞋——鞋尖朝外、前掌磨平脚跟不磨、帮上顺股麻线补过，正是窑里那双的另一只，他把它挂回同一个角；把头讲渊兽今年下岭是因为南边渊眼抽水、沟干了；第二道梁他把人按在石壁上，要他"数你的呼吸"，说三十年每回停两回、他起伏如平地，又断定他是"身上不敢带钱又不能不带粮的人"；石壁新鲜五道抓痕里嵌着一片顺股麻布
- 章节: 第043章
  时间: 离山第十二日午后（第二道梁凹地、岭口）
  摘要: 前兆：头车骡子拉稀冒白气、拨稀三堆、鸟不落、风从下吹不动枝；兽从道内侧凹地出，第七辆车上讨饭跟走的孩子脚卡进裂开的铁箍缝；沈默放开真元，只三息——第一息把邵伯的錾弹进兽鼻梁鳞缝咬进一分弹开，第二息拧出孩子的脚（脚背豁口、血烫手），第三息抱孩子摔向道内侧松石、自己背撞突石凹进一块；三息后他把十倍吸纳按死，起不来那半刻里先隔棉袄按左胸十一针（牌在）、再掐背心知疼、拧腰拧不动，第二数到十九就停因为有人来了；右肘筋跳、小指抖，錾落地崩一个极小微豁；兽抬头往岭上去了；把头不看他的脸先看背上破口与石粉，逐息拆他步法（一息手腕内拧、二息肩下压、三息横着走），说杀猪的杀一头要四步，他第三息是往怀里收不是往外推；岭口少三辆车；井台被十一个老人围着，抱柴的说"井是我们挖的"，把头把烙铁正放在井栏中间，说回来取牌取完就走不喝一口水；老人看他破口里露出的灰布上干血，问"你的衣裳"，他说"是别人的"；小满提前把牌还他，"你今日替他挡了一回"；岭口蹲着等的人站起一个，前掌落地、脚跟不落
- 章节: 第049章
  时间: 离山第十二日傍晚（岭口、井台、火边）
  摘要: 岭口站起的那人正是土地庙那位；把头以"口内三十步我拿刀"隔开双方，两人在口外说话：他自陈不是邵伯錾子的原主、就是邵伯口中那个"结巴"（邵看人不看嘴），承认昨夜井边是他、翻包的不是他、"我只会把你那枚钱翻个面"，说永泉驿那枚钱是替放钱的人收钱、绳绕两圈是这一路的绕法、跛腿收他二十文传话；他劝沈默别走南岔道；沈默去井台，守井老人说跑过七回、第七回不跑，水线三指未补，拒绝沈默那二十文并把他的手指一根根合上；小满送面汤，说是把头自己扒拉的蛋；回程他把烙铁接下，柄上旧铜磨剩半个"影"字，那人说"一副牌拆成两半，走到哪儿都有人来收"，又留一句：三日之后三台册上多出的那个名字不是他挑的，"挑的人背着一口井"；小满找回草鞋，鞋底里那张他自己炭描的"专呈"五字小纸露出来，他把纸塞进烙铁铜缝；火边守井老人最后警告"你在三台别烙活人"
- 章节: 第055章
  时间: 离山第十三日至十四日（三台渊坊、侧门换册前、洛霞市东巷回字铺）
  摘要: 三台一城一坊：坊门探渊器按枚给价，女人八枚被裁定七枚、一颗颗捡回筐里；侧门"外放历练关防伪册一年一换"，桌后的人闻纸上烙字、问"谁家铁"，给一个只有两字号的少年补烙第三个字；沈默想过两夜，报"沈默"要让三个死人中的一个背他的名、报"补鞋的"又多一块无名牌，于是在车马行卸一天货，托行里往东巷送九个字"回字铺的槽，我来取答案"；次日走城墙根夹道进东巷，招牌回字新漆贴反；老汉掀帘看街、压石，带他进装订房（三张案板两只石滚，一个手粗的孩子拿锥子当刀使）；抽出中页被裁的册：只剩薄薄一层皮，透着半个"永"和一个偏旁，老汉说用他黑牌那次账发出去第三天有人来对账、不对他的账、专抽这页，按案板那只手"指头短、腕子有劲"，与焦纸落款同判；原页三行行行有"牌"，头一行"牌一，齿二"；沈默留下自己一问（按纸的手与裁纸的手是不是同一只），老汉答不了；沈默教他"裁两页"——短两页只像穿线错一张，还举药园领货单每月撕一张不怪、撕两张就要被问的例子；老汉用钝刀裁两页，薄的那张在门槛外石头上蹭成絮、一半进阴沟，厚的那张给沈默；沈默把纸插进烙铁铜缝（袖内层已满）；问到坐门槛的孩子，老汉说那不是他的门槛、这一巷十一家他一天坐三家、炭条是自己的字帖不是；老汉应下替他去三台说一回，叫他出门往东别往北
- 章节: 第061章
  时间: 离山第十五日（井台、车马行、夹道口认手、柴棚）
  摘要: 老汉以"替他把三台的事说一回"为价，摆三只手叫他挑外行；他先看肩膀再挑，判中间那只，理由是"干过活的手放在桌上就是放在桌上"、伤口贴草纸不推血、黑手那位的亮皮是松香掺油烤的；事后自承只对一半——中间那只是练过握刀的"藏"，不是外行，他没揭；钉掌的说三台防伪册一年一换、揭旧页当街烧、"看灰的人一半等死一半找等死的"；车马行伙计带回一句"这话说得不急"；夜宿柴棚，三更一个前掌落地脚跟不落的绕棚二十息，天亮柴堆被抽走一捆，绑腿布里的何小乙六字纸条连纸角指印不见，第二捆抖出半截沾稠石灰的布条；短褂人再来，出价每日二十文请他到镇东坐著替人看手，实为"你替我们挨这一试"，并亮出布袋角=他拿走的布条；沈默掉头不去镇东，把绑腿重新缠紧
- 章节: 第067章
  时间: 离山第十五日至十六日（洛霞市口界石面摊，三碗面）
  摘要: 摊主点出"石头里头三张桌有人等一个从东巷出来的人"；第一碗王二（药园旧人、如今在市口替库房采买）：劝他别在洛霞过夜（名还在山上，山脚过夜叫回来），并带三件事——聂长老退了（"条文我背得完，人不背得完"）、韦副堂主往主峰去且把西边卷宗整车带走不上秤（"不出库就上车，这叫不是东西"）、陆九霄家法十九遍加到三十遍、那十一遍是他自己讨的，出来后卖掉青骓换十一斤麻绳；第二碗小满代把头送来，嘱咐"跟他一样把碗底喝干"；第三碗自称"陆沉"的北边人：拱手太干净、指根是握笔磨的、鞋帮青苔是永泉驿井台石缝的，说名字是先生给的、三年前有个陆沉死在西边、路引烧了尸首没找着；他提议互换——后天三台侧门揭旧页时"你报陆沉，我报沈默"，理由"你的名字已经在册上了，册上的名字不能见灰"，又拿小臂上渊脉压出的旧痕为凭、说是"还一碗炒米"；摊主两句：陆沉三天前才到、头一天也点三碗一碗没吃；昨夜见一个走路不出声、双手拢袖的人进了东巷第二家钉掌铺——镇上拢袖走路的只有两个，头一个就是北边来的
- 章节: 第073章
  时间: 离山第十六日辰时至日头挪二格（镇东"收皮"铺）
  摘要: 铺里一杆药秤（铜盘象牙杆、星花磨剩一半），短褂人要他看六只手、看完上一秤记数；杀猪的手三个月没动刀（虎口茧在退）、接生的拇指内侧有压痕、抄契的中指有茧、第四只拿碱水洗过手他不看、第五只是七八岁娃娃替大人挨看的，他叫短褂人把那道擦掉；他由秤盘底摸薄的垢断出这杆秤先年在鱼市、后在药材行；短褂人自陈"数手不数人"，也数过他在桥心站两回、左手在袖里张开又合上；门外驴子一轻一重的蹄铁是故意牵来遮话的；第六只手他先不看指头，看腕上绳印、松皮、秃到肉的指甲，断为"三十年道、绕绳两圈、翻钱先问一句"，来人即结巴；结巴说他今日两头都来（一杆秤、后天三台的门），并抖出：后天侧门头一个排的名是周砚——棺材里那人身上没牌，册认牌，有人拿周砚的关防报第一个名，周砚落册之后第二个名额才排得上，第二个名额上写的是沈默；沈默把二十文一枚枚压在秤盘上"这一笔你们自己记"；出门见"收皮"木牌四角旧眼往里各差半寸、是拆来的新牌，绑法与陆九霄那十一斤麻绳同一路
- 章节: 第079章
  时间: 离山第十七日晌午（洛霞市口界石面摊，商队先生本人到场）
  摘要: 车队停在界石外三丈不进不出；钉铺无人炉已冷，短褂人拢袖站门口；结巴拎空罐来打水，劝他"别坐，坐了就算一头"，他坐中间；先生六十上下、外八字、左手托扁匣、右手虎口到腕一道旧痕，自陈拓过三回：影字令牌棱印、「沈渊」铜牌缺角、还有一只是一只按纸的手——"不是我，是我上家"，三十年前在糊册铺里他十九岁，师父叫记住这只手"往后有人来对"；他认下三件事：永泉驿牌槽上的"沈"是他凿的，一共凿三个字（永泉驿一个、沈默木牌上一个、第三个凿不下去），沈默离山那天他就在三步之内、替他掖过袖口那道开了的线；他摆出一杆截链的戥子，说规矩是"账不挂号不挂脸，挂在一杆秤上，哪头沉照哪头补"，两头放两张拓，盘平；沈默把自己那张老写法三字的拓压向令牌那一头，盘沉，说"沉了才对——我上头那个人三十年前欠的不是我是你"；先生记下三笔（岭口救孩子自己撞石=你赔了多少；东巷擦掉桌沿那道竖=你何时收回；今日这一放=赊，赊给谁不写）；临别给一张黄纸路引"陆沉·北籍·无印"，教他若被问痕就说压在左臂骨上，又说"这张东西我称你三回，往后跟到哪儿；有人拿这只手来对你，别忘了它不是你"；摊主插话：今日三拨人问过他，第三拨是一个抱孩子的，孩子脚上缠新布，留下一句"这人吃面先喝汤"；先生走后沈默验那张路引——纸角印是往左拧的拇指印（与第50-51章同），背面无字只有针尖孔与一圈描印的压痕；夜里他把从秤盒里捏来的那半两法码的刻痕记住，梦见门后第六块砖旁多出第六道痕、痕底点着米
- 章节: 第085章
  时间: 离山第十八日天未亮至晌午后（三台侧门揭旧页）
  摘要: 门前十九人，六个抱牌，后头是看灰的；沈默排第二，排第一的是岭口下第三村的人，背一段缺角井栏来报名，报的是"周砚"——理由是"井栏在，村名在"、"名字比人先到"，领了铁牌卅一；第一个人替死在山下的兄弟来留名，吏破例说"这一页我不烧"；沈默报"陆沉"，吏因木牌无名拒收，说"补名要拿你自己的牌子来"，背井栏的人替他作证"他有字，是他自己拿錾起掉的，起掉的是别人替他凿的字"；吏道出侧门铁规矩"册上的名是我们落的不是你烙的，你烙的那叫记号"，并说上一个问"我烧的时候我在不在灰里"的是个背人的、三十四岁、背到半路人死了；沈默收回木牌不交，改拿那张路引报名，年轻人验为"印是真的，纸是旧的"，册上落下"陆沉，蜕凡后期，北籍，无印"；揭下来的旧页被水淹过，泡开一角露出半个"默"字；沈默求取旧页被拒，最后用自己的烙铁压住那个"默"字替纸压平，火起后他数到第九下方才塌；灰堆边有人捞走一把灰攥着就走；结巴在歪树底下点破："陆沉不是你今日的名字，是你替一个死了的人办的事；这册子一日落两个死人的名，第三个是活人，活人那个是你自己"，并给他一只空陶罐（罐内有干蜡与黑铁屑）；往南第一批车开动，第四辆车帮上补的那块布他认得
- 章节: 第091章
  时间: 离山第十九日至二十日（南行道坡口、三台外岔路口）
  摘要: 沈默搭把头车队，井栏在第二辆车上；陆三追到坡口，要他把"陆沉"从死者那栏挪到活人这一页；他自陈凿不开井栏窝，求沈默动手；沈默起开泥与石灰（与桥头抹錾口同一种），见窝里那块被常年摩挲磨圆的石牌，正面三个老写法字、背面一个拇指按了三十年的凹；陆三捏他腕子内侧的筋，断"你不是我儿子——我儿子这根筋跳得像有人拿小槌敲"；陆三取出用井栏窝存了多年的左拇指末节指骨（北边寄回），把头劝他别带；陆三天亮前走，把井栏留下；三台界上小满卸车碰落一块泥，滚出白色碎屑，把头用鞋尖拨进草里叫他别带，沈默仍拈起来——是石牌崩下的石屑，边上带铜锈的绿；井栏窝里那块石牌被陆三按回去了，按回去时少了一个角
- 章节: 第097章
  时间: 离山第二十一日（三台渊坊、银铺、城南）
  摘要: 渊坊收脉桌"手上没东西不出单"，十一枚岭上渊烬按枚一纹；存照单正面填"陆沉"，背面"前名"一栏他自己写下"沈默"，铜签钉角；出票桌后的人点明"格子上头压着的不是钱，是有人替你记着数"；坊墙外磨刀妇人四十文买他的格子（她要替十九岁、没落下格子的儿子收），他拒；银铺按九折收毛口渊烬、得九文；王二现身，眼下发青，说山上有人在问"渊脉那趟谁背过谁、背人的那个手上力气多少"，转交一截带石灰的布条（岭上那个孩子的），自称十一斤绳是"我自己讨的"，沈默看他虎口斜到腕的墨痕识破他在替人抱绳；街心一个七八岁娃娃照旧压第二个关节来撞他看手，说给他两个饼的人是"姓收的"、铺子是从别处拆来的；沈默把九文全给他，叫那人来自己问；"收皮"牌四角新添绳磨痕，牌被解下又钉回；南门新告示：三县渊坊存照单下月初三换格式
- 章节: 第103章
  时间: 离山第二十二日（册房、夹道、城南大通铺、渊坊）
  摘要: 册房不划只封，封了格子仍在名下但连末子也无；沈默要求划掉的是上头"陆沉"那一栏、不是背面"沈默"——"我今日的名字往南还要用，我往北不能再有人用它"；印泥面上第五个指印纹路往左拧，上一个按印的是去年十月十九；他按印封格；夹道口穆春出现，说山上派的人不够、南边借两个石匠，如今他算南边的人，并坚持"你那天背人背了六十里，我数了两回"——"当初叫我报数的人不是今日叫我报数的人"；城南大通铺三更一条赤脚影子在第三张铺沿放下一枚铜签，编号与他那枚一模一样、麻线是被刀切齐的；他用邵伯的錾刮出签上重刻的痕迹：一枚签两个号，第二回烙时故意偏半分；小满去渊坊问出"没封——格子昨日已被人凭同一枚签领走，规矩是一签一格"；出票桌把存照单翻回正面，"沈默"下头多了一行浅色小字：借；南门脚店新井井台錾口同是往左带，打三个月没水、井栏配上了却没留绳；他把八天里所有"往左拧/往左带"排成一列，想到邵伯缺的是右手指——往左的不止一双
- 章节: 第109章
  时间: 离山第二十三日至二十四日（三台石亭、脚店、城南"收皮"铺、出南门二十里土岗）
  摘要: 石亭收状的不要"许沈默专呈"那句（"玄天宗许过的事都作数，我们这三县的状纸往哪儿递"），只肯在背面"前名·沈默·借"那一栏上盖一个歪了的"验"字，"算你来过"；脚店伙计转来一块木牌，正面"收"、背面倒贴如东巷回字，留话"申时往北走、看了牌子自己来"；夜里子时他绕街一圈确认无人跟踪，进铺见那娃娃膝上压着一张右手描本（指根两道茧、虎口斜茧、小指翘），描本背面折痕里嵌石灰；娃娃说铺子是从西边一座桥上拆来的桥板，他原在桥上"数人头"，数到第四个那人回头看了他一眼他就不数了，先生给他起的名字叫"第四"；先生留话：明日过关不要背东西、关上看痕不上名、他在关内等到日落；他把描本留在石亭桌上换一句实话，书吏追出来低声说"昨日领格子那只手，左虎口有一道斜茧"；土岗上他刮井栏窝里那块石牌，发现缺角是昨夜至今晨崩的、断面粉还未被手汗吃黑，从井栏底磕出那一角，角上留着半个老写法偏旁；盐车把式说今年石头也要报、因为南边渊眼抽水改了水线、北边要重凿井、背石头出关的人多；破窑里他打三个周天，地气薄、顶第二重回，按的时候手是抖的；窑外两组脚印，夜里那组前掌深脚跟浅
- 章节: 第115章
  时间: 离山第二十五日（南门关、关内第一村）
  摘要: 关比他想的小：一道石城两座门洞，六张桌（三验人、二验货、一立"等"字牌）；验人吏用竹签在无名木牌的槽里划三下，断出"凿过、起过、没填"；按册数到他与周砚两个名字挨着（周砚后有一个朱点），他说出"死人三月里背井栏到我面前"，吏只答"册按号不按名"；今年新加一栏"形"，要脱衣看背——他背上有两处：渊脉那一夜的旧隆与岭口的新青，吏用笔杆点了老的那块，纸上落"陆沉，蜕凡后期，北籍，无印，背有旧损一处、新损一处"，另起小字"与三台格内形对，未见异"；他把井栏那块白石角留在桌上，说"今年石头也报"，回手把吏问得没有再追；验货桌的话让他听见渊精三瓶起收、一瓶十分、半瓶不收（"半瓶说明你是拿别人的"）——他袖边那只赵元康的空玉瓶正是半瓶以下的东西，瓶底有张管事指甲划的记号；南域三县渊眼自三月初一禁私汲、违者以盗渊论，告示印往左拧；出关后茶棚下等着的是那伙计（不是短褂人），药秤仍在，先生说"过关过不去我就挑秤回北边"，留下一枚刻着他存照单编号的铜签，又传一句"要查就查那杆秤，秤上有多少人头他就数过多少回"；关内第一口井水线比岭口高，他把擦手这个小动作认给了自己
- 章节: 第121章
  时间: 离山第二十六日（浅洼，晌午到二更）
  摘要: 五里外车辙进深出浅、三口井两口收绳一口无绳（石板上压一枚背锉的制钱）；洼口两尺、禁汲木牌被剜去盖印那一角（茬口白，十日内）；赵元康的图是抄本，第三页圆圈旁两个他不认得的字，页脚四个针眼夹一小条纸——纸上是指甲刻的三道杠、一道比一道短，背面右上角一个墨点；下洼试探：三十步灯往脸上偏、再十步火苗直立不动不亮，空瓶倒悬二十下什么也没接到，只接到一层井壁式的凉；编筐妇人是柳条老人的儿媳，公公去年冬背着井栏往北追"按月收皮的人"没回来，她男人是六人下洼回来的那一个、回来后不说话只在烈阳看火；三日前一个左撇子拿一张盖左拧印的黄纸换绳子，下去时两条腿不能弯、上来自己走，问"数钱数到第几回才作数"；他守到二更，洼底响声一下一下间隔等宽像呼吸，断在洼口——灯边多一枚方孔朝上、孔里插烧过麻绳头的钱，有人从他身边走下洼去
- 章节: 第127章
  时间: 离山第二十六日至二十七日（洼口、砾石滩）
  摘要: 下洼规矩：五人腰上系绳、绳头留在洼口由押队的绕腕两圈拇指压着，"你三下我拉，你没三下我就当你不想上来"；上来五人加一口封蜡小缸；押队的正是乔三娘（渊脉同队、数钱必数三回、"我数三回回回三十二"），她认出他"名单上第四个，那时你脸上糊着泥"，自陈功折钱买骡、骡惊断腿卖七两、"我如今不给人做事，我给钱做事"；沈默替她数钱（廿五一停、第二回倒着数、第三回闭眼数），她变了脸色——"倒着数的人我在山上只见过一个，他死了"；她卖话：有人出一整瓶的价买一个已经落册八天的名字；劝他别把气开满，水道一路通到这里，起纹就有人替他数；三更他偏把吸纳放开一半，洼底起纹，半里外那人走十二步停一步、绕到上风、吸七口第八口没吐完就往北去；天亮瓶被开过又封、蜡比原先紧，瓶底一枚背锉的制钱（第五枚），乔三娘摆四枚钱说"有人替你把数数完了"
- 章节: 第133章
  时间: 离山第三十二日（烈阳城）
  摘要: 烈阳门上不查名查挑担——影子歪说明货里有渊物；日落收功、天一黑连卖饼的都没有；转市第五堆铭纹草，他先看不拿，指腹推叶背推出白粉、第二片纹裂，当场点出两堆并一堆、六片出粉；再替采药女人分三堆（阴干、晒过、蒸的），"晒的是死的干、阴的是活的干"、拿手折判断，得十文；摊主白送八片阴干的——"你今日在我摊上说了实话，我这摊往后三天得关门""药材上骗人骗的是拿命吃药的人"；采药女人正是洼下回来那六人中不说话者的妻，她说男人"白天看火、火往哪偏他知道风往哪来"；街尾管房的说那家租期三天、九文一枚一枚数、今日期满，四人中一个抱一口封蜡的缸往南去——"这一城往南去的都去炙息"，并托他带一句"疗愈馆门口那张纸年年换新，换了十一年"
- 章节: 第139章
  时间: 离山第三十三日（烈阳城渊坊、西墙根、巷口）
  摘要: 坊北卖渊石坊南卖渊烬、两队隔一道砖、竹竿点肩三下；这一季抽水五分（上月三分），背篓人把第九块石头放回兜里；北墙牌上写官价与"出水"（北边叫折旧、南边叫出水，换个说法听着就少一半）；有人卖半瓶渊精，众人答"半瓶不收"，他想到那口缸抬出来蜡要软三回、软一回漏一分；他以烙铁作保换查格；戴铜片眼的书吏"三台的印到我们这儿不算""领格子的人拿的是第三个名字"；东柜戴布指套的老人只给看一行不许读——三月初五领一格、格中十一枚渊烬末子七枚、凭签，押是一枚往左拧的拇指印，押左写着一个"沈"；他把东柜纸条的折与老人那一折并在一处（"纸上的折子就是人的手"），老人加看第二行：同日领一格、格中无物、凭印——"你的印在他手上"；两行之间那个右上角墨点与描本背面那个一模一样；画押的人"坐着把胳膊举到肩膀那么高才按得下去"；巷口拦住领格人：左撇子、左虎口斜茧、"我今日拿的是周砚，明日拿什么看人家给什么"、名字被爹划掉说"以后要用在别处"、二十五岁、右肩忽沉如压扁担；背身问"你掌根上有没有纹"，答没有之后他说"我们这一种人，掌根都是空的"
- 章节: 第145章
  时间: 离山第三十四日至四十日（南行三百里六天、炙息城）
  摘要: 红土药田不垒埂、四角插柳条系麻线分田；第五天小集只卖帘子（晒药怕日头过头，帘子最厚那家药最贵）；炙息城满街苦香，疗愈馆不收诊金、弟子手背全是余烬烫出的旧点；他以烙铁换续脉丹（原报三渊石两粒），换药的白发女人是炙息宗宗主赤霞子——她认这柄铁，因为她师父当年给人正骨后把铁放在病人胁下焐着"骨头怕凉"；她把铁还他、把四粒丹塞给他；前院挑担汉子肩脱臼，他先按住那只去够筐的手，托肘捏腕、抬到汉子吸气处停、数到三、掌心贴骨不贴肉，一次复位，又教他把药分两半、另一半用稠米汤冲可以多撑一夜；赤霞子翻他手掌，拇指按在掌根上按到自己皱眉——"你是第二个"：十一年前有个男人背着睡着的孩子从门前过，她拦下给半张饼，男人接饼时她看见掌根无纹；男人往北走山路，说把孩子放下就回来，没有回来；她看破他"顶回去两回"（右手小指那一下是收力收熟了），嘱破境七日别在洼边、往北三十里找有石头的地方；挑担汉子追出来回赠半包药；门房那张"不收诊金"的纸被风掀起，背面炭字写了又抹剩半句"北去三百里，有井无名"，窗棂上有一道平着走、收刀往下顿的刻痕
- 章节: 第151章
  时间: 离山第四十一日至四十二日（黑土桥、地听城）
  摘要: 桥北红土桥南黑土；地听城没有城墙，围一圈深沟，人顺绳从沟底门进出，城中不许大喊、买卖靠拍木片与放两枚钱还价；城心一口石井，井上架鼓、鼓面朝下，井壁铜钉挂麻线坠蜡丸；下井听三息，头一回他听见"半下"，第二回把呼吸放进两阵风中间，听出一口在很深地底吸进去没吐出来的气；三百多个下井的人头一回能听见的只有四个，他是第四个；他教抱孩子的夫妻"替孩子按住上头"，孩子哭出声，井壁麻线全抖；他替鼓房把断股井绳改成两圈对绞留活耳，鼓房人说这井上一百年只有一种绕法、是定规矩的人教的；石屋里十一年四百多张起沙的牛皮他不洗，第七张上前年三月十九扫出三道杠、一道比一道短——"数的人一天数一道，数完三张就不数了，第四张在明年"；十一年水线：南边三处洼一处渐深、一处三年没了、第三处图上无名却每年三月往里吸，今年长了一炷香；鼓架上钉着一枚铁钉，钉帽錾"永"，三十年前一个借宿的人从自己包袱上抽下来钉进活木、钳不出，那人留话说"往后有人来取鼓槌，凭这个"；鼓师不识字，把起出的沙痕拿给识字的人念，念出来是两个字："取槌"
- 章节: 第157章
  时间: 离山第四十三日至四十四日（灵枢城）
  摘要: 官板路牌末笔往左带；坊市分排卖路引图/矿图/水图，最后一排卖洼，"图不要钱，钱要的是你带路"；图上坊小吏袖上有墨、指甲缝里刮出石灰；灵脉图正中一角被撕走三年，撕的人左手在前右手在后，与焦纸、底单同一走法；小吏拒抄缺角图（"抄了叫人走进洼找不着路，这笔账挂我号上"）；沈默求"把一幅拓成两张"，第一张拓坏——他手心出汗黏住纸角，小吏让他把坏的那张带走当记号，第二张他改用掌根外侧走布（掌根无纹处皮厚不吃汗）；小吏从汗印看出他二十多天里下过洼、睡过坡、烤过火且刻意让右手凉着，说"纸上不写名字，写料"，又说掌根不长纹的人他这一辈子只在图上的字里见过一回；背拓针尖走到圆圈正中，发现那个点是拿针从背面顶出来的凹，"不在我的底子上"，而底本锁在石屋、两把锁、一把在坊正手里一把在他师父手里、师父死了六年；他在官图上"此地有问"的位置顶了一针，说"我只添一个记号，让拿图的人自己分清他找的是洼还是井"；出巷口晒纸绳上那张湿纸有一双大脚印与一双小脚印，小的踩着大的走，到绳尾分开
- 章节: 第163章
  时间: 离山第四十五日至四十六日（废窑并图、东行一百二十里、三口井）
  摘要: 废窑里两图并版：先看纸（撕口毛边、顺股纤维），再以指头盖的水抹在旧图右下角起棱处，浮出一块方棱与四个针眼，与背拓右下角对得上；旧图三圈一线（外圈洼边、中圈等宽小点、内圈一点墨），背拓三短竖各点米，把外圈压住横线后一条线从洼口往东穿过三短竖、到图边断在"井"字下半；他用井栏当尺，井栏窝底一个"三"对上三短竖；出发前在假洼把自己的脚踩湿、顺着先来者的脚印边走，再用井栏横拖把那双印压成一对更重、脚跟落地的假印；途中人家不让进屋，因为"洼上下来的人身上带灰，灰见不得灶火"，去年有一户让人进了灶房当夜烧了一间；粗面饼上按一个拇指印作为回程凭据；东行实地三口井：第一道缝有水带铁味、第二道缝干、第三道缝只有一圈十二块河石围成的空眼；他把井栏压上石眼，摸到井栏那道被绳磨塌三十年的旧槽——这口井没有绳，井栏是从别处井上拆来的；石眼里翻出一截烧过的顺股绳头；苇子里一个人按住他后颈，说"你晒脱了两回、背了三十天"，又说"这口井不要井栏，要的是有人站在井边上替它看着，别让人把它当成洼"；他一辈子被人按手腕、按掌心、捏筋，按后颈的是第一个
- 章节: 第169章
  时间: 离山第四十七日（洼外围土梁、换气窗）
  摘要: 梁上插柳条系麻线；查签人一眼看出铜签对、麻线不对——他的线是三股（北边用），洼上自绞两股；一个左手按布包的老人认下他"背井栏来洼上的人我只见过两个，头一个死在口子里，第二个在城里看火不说话"，把一截下截染红的香交给他"你拿进洼，出来给我，我给你一个名目"，等于给他一个不入册的名目；三条规矩：窗开一炷香（香点下风口，香尽窗闭，里头的人自己想办法）、灰要自己收（收不干净明年不许再进）、窗开时口上不许有人；跪着刮灰的把式教他灰分三层（浮白吹掉、带壳收斗、贴地黑粘手的收了会毁一整斗），他用手掌平推、签子放平、走一道起一层、手腕内收，把式说"你省了我半炷香，这半炷香记你名下"；窗开时浮土往里抿、耳朵里嗡得像有人往里灌水，他看见口子内壁上是一整排錾痕（起手重、走平、收尾往左带），錾缝里嵌着白石灰，最后三道收势散了——"凿窗的人凿了一整夜，天亮前没凿完，手滑了"；他把赵元康的空玉瓶倒悬在白气上，数到第十五下接到一分，轻得像有人往掌心呵了一口气；窗闭前口子上站着一个人，左手从怀里挪开、把腰上麻线绕两圈压在石头底下，往下丢了一枚背锉的制钱（第七枚）；上来后香灰被人收得干净，连烧黑的印都蹭散了；洗手的浑水里他掌心那层黑散成一丝一丝沉下去；女人数他说三句话没有一句是今日能办的事，他答"我不办今日"；出洼前他不知不觉用邵伯的錾在口子内壁上带出一新道、收势往左——他从未学过使錾，那一下是手腕自己找到位置的
- 章节: 第175章
  时间: 离山第四十八日（渊坊换灰、新册、窑）
  摘要: 外号"沈某人"三桩传闻各自走法：井（他肩上的绳印是斜的，说明井还在没卖）、手（他两句话断出一个人左手中指旧伤接歪过、另一人"手上没有活、是拿笔的、出来做事是这两月的事"，次日那人消失）、掌根（没人敢说破，问的人先低头）；渊坊换灰活灰两枚一纹、死灰不要，桌后女人故意喊"沈先生"试他，他应了，六个人里查签那个低头最快；乔三娘给他四枚钱、多给一枚，说有人出一整瓶的价买一个"沈某人"，瓶子已备好——黑瓶、半瓶（半瓶不收，所以那人不是买他是试他）；他去渊坊侧门新册在"记号"栏右上角偏半分画了一个圈，书吏说今日七人六个画正中、他是头一个画边上的，并露出旧纸上半个同位的圈——"去年也有一个人在边上画，画完把这一页撕走了"；窑门第四道杠出现在井栏木箍底下（位置极低，人得蹲或躺才能下刀），底下点米，痕里干的、外头下雨；他数梁上的人：三处火二、一、五（五里有一个从洼底上来的不说话者）、查签二、桌后一女、窑后一双鞋、井栏上一道新杠——四拨；回窑门槛下塞进一张纸，露出墨点与刀刻两字"取槌"，膝上横着一把鼓槌（柄上两处汗印一处合右手一处合左手，槌头裹膜皮、皮上有细沙）；他用鼓师的骨片在窑壁上刮出三道白痕，又抹掉最外那道，只留两道；纸上小字：槌在井上，井在洼东，三月十九，第五张皮
- 章节: 第181章
  时间: 离山第四十九日（洼东四十步的那口井）
  摘要: 井圈十二块河石、第九块是石阶上撬来的（削平的一面、底下的新泥）；守井人背上那道是"往里"受的（肩头进腰眼出，与周砚同进法），腰后还有一个被肉撑平的坑；两半石牌对上缺角、咬得极紧，他拒绝合副（"合上就是一个人名下的东西"）；三十一年前五个人下眼、回来两个，一个是背着井栏往北死在四十里的柳条老人，一个是他；眼是砌出来的，一级比一级窄，第三级要侧身；先前下来那六个只到第一级，不说话的便是在一级上被人提上来的；他守井凭的是那枚"永"字钉——三十年前那人说"往后有人拿同一把錾刻的字来，就是我换回来了"；那双踮着走、脚跟不落的布鞋不是五个人那一族（他们脚上都系绳），去年背着井栏来井边坐了一夜的人穿的就是它；石粒堆旁那半罐炒米上有盐粒
- 章节: 第187章
  时间: 离山第五十日（井、窑）
  摘要: 把空瓶伸进干井，三尺就有拖劲，瓶底那一分自己转成旋、旋心朝洼；钉与槌会朝洼偏、牌不动；井上的说"井朝洼、槌跟井、牌是死物，从底下带上来的才活"；量器规矩补全：号刻在底、一炉一副、三瓶起收看号、半瓶不收（半瓶说不清是漏还是换）、引有三规（不空放、不满放、不放别人手上），他三桩全犯；瓶底那道"张管事指甲划的记号"其实是錾口——起手重、收尾往左带、有人又补了一笔想伪成指甲痕；他试了三回倒不掉那一分，瓶子平放会自己转到瓶口朝洼；回窑发现鼓槌被人从井栏底下抽出、摆成槌头朝南、汗印朝上，土上无脚印（踩着井栏进来），槌头膜皮下用蜡贴着一枚背锉的制钱（第七枚）；他决定拿这二分去换"买名字的人"露面
- 章节: 第193章
  时间: 离山第五十一日至五十二日（北去三十里的塌窑石屋）
  摘要: 垫鞋用井上旧绳、算粮背水；石屋后山泉缝口塞着一段顺股两圈的旧绳（绕法是洼上这一路）；窑口那道缝他先塞窄留一线、又把井栏挪来挡风，靠听声报人；第三个周天不敢打，改走养气（气不进丹田口，绕四肢皮，药园晒药引水浇根那一手）；顶到第七息时那层膜反过来往里撞，他右手撑石、撑裂一只旧石臼，小指抖到第十息才停——全力输出的上限从三息、四息半、五息涨到十息；他没有硬破，理由是算清了一笔账：破境身上发热、石头会烫、瓶会转、洼底纹会散，等于替洼底那东西报一个"有个跟它掌根一样空的人到了"的信；窑顶裂缝上挂着一根麻线坠蜡丸（与地听城井壁那套一模一样），蜡丸往左偏一下回一下，他手掌悬在线底三寸、掌根朝上，蜡丸朝他掌心偏了半寸
- 章节: 第199章
  时间: 离山第五十三日（井圈）
  摘要: 井上的把井底石粉与石阶石粉并一堆拌米汤，补眼沿三道缝，一年宽一分、"补了三十一年"；补缝的人不数粉（"数粉的人会疑心自己补错"）；他扳不动第九块石；邵伯的錾被井上的顺杆摸到那个左手刻的小米点，他说"这一点是左手刻的"，又断"你把它拿反了——洼口内壁最上那道新痕是你带的，收势往左带，你不敢说你没学过使錾"；沈默承认自己在石头上走过一道而不自知，井上的说"你不知道才好，知道的人手会改，改了就跟他们不一样了"，并说出刻字的一族：五人里三个会刻，他手笨不刻，背井栏那个刻得最好、刻什么都往左带（右手拿錾却往左带，是在替左手的人做事）；钱背锉口分两路：沈默七枚锉左半、井上三枚锉右半，"一把锉两个人用，按钱的力大、推锉的细"，按钱的就是他自己；他说过为何不去北边找人——找着就要一枚一枚对上去，对上人家就知道这些钱是从眼睛里带出来的
- 章节: 第205章
  时间: 离山第五十四日晨（洼口）
  摘要: 井上的算出"三年一满、九月十九窗开三倍"，与地听城"前年三月十九起三道杠"是同一个日子的两种数法（北边拿牛皮数，这边拿窗数）；沈默不等九月：他在井栏窝底"三"字上添第四道又压浅半分（摸得出、看不清），拿鼓槌敲井栏旧槽——一槌浮土齐落，二槌石沿裂线冒白气，三槌拧窝底、木头断一线，洼里那口气整个翻了向，风冲出来把他鞋跟在干泥上犁出两道沟；女人喊"窗开一寸、你关回去"，他答"我要它这一寸开到我说话为止"，左手压在口沿最老那道錾痕上、掌根空处贴石，石头是热的；他报了自己有什么（掌根空、会往左带、半副石牌、替死人落名的路引），热忽然退净、白气收回、梁上那根香自己倒了；井上的说他敲的是井、"它听你敲不听你说"；他掌心印上一圈石纹恰好填满那块空，随后掌根上多出三道杠（一道比一道短）；回石屋他用那张拓坏的棉纸拓下自己的右手掌，纸右上角点了一个偏出半分的墨点，与先生那三张拓成对
- 章节: 第211章
  时间: 离山第五十五日（井、石阶两级）
  摘要: 井上的教三条：脚踩窝不踩边、手不扶壁（壁上有活浆）、听见石头往回咬就上；绳绕三圈（洼上那一路只绕两圈，绕三圈的人不在了）；下井只带錾、空瓶、一根缝鞋麻线；石阶窝间距一步半是最矮那人踩的；第一级有火塘、三枚烧裂石子摆成三角、排水沟、扣着的陶碗（碗底米汤壳、碗底窑号磨剩一半）、石缝里半截蜡（蜡心嵌铁屑）；石壁上五个号：一横到四道，第五行的粉还堆着没被吹散，前三行磨平——五人都下来过、有一个下来两回；第三级缝里的绳是绕三圈压石片，解开后石下是一个窝，窝里四个放钱的印、三个空；第九石上有新左手印，四指并、拇指刻意挪开、比沈默的手小半寸；鞋带上的麻线还在、鞋穿走了；井栏窝底"三"字旁他自刻第四道又压浅半分、拿鼓槌敲井换来一寸窗、瓶底那一分贴石自转朝第三级那缝；鼓槌被人从井栏下抽出摆回朝北、土上无脚印，井上自认"我手笨，搬得动石头摆不好槌"，右手小指甲断半片；末了他拿拓坏的棉纸压掌根，纸背留下一个长方无纹的空印
- 章节: 第217章
  时间: 离山第五十六日（渊兽上井）
  摘要: 渊兽从第三级往上撑、左眼白膜里一粒黑，"它认得槌、记住谁敲的"；沈默先布置：两口缸半埋松土做陷、把井栏挪到第九石与井圈那一步半（最矮那人的步子）、右手腕系麻线自缚测距；女人数他下去三十七寸上来三十七寸；十息打法——一息井栏顶鼻梁旧伤、二息甩麻线遮眼看清那黑是"从里头长出来的"、三息托颌按头、五到十息改用药园捆药的收腕不推不撞、七息嘴里有血、八息送肩让它仰头、九息把头按进冒白气的缝、十息人翻出去背撞井栏、石圈倒四块；兽自己下去了；埋缸的一人死、两人被救；他打了第三个麻线结记上限（三息→四息半→五息→十息）；女人劝他别把"没救着"算在心里、他改口要记死者的名与家、以三寸麻线做定钱换女人替他去寻那户人家，女人只讨一句"他家里若问他是为谁死的，说为采烬的，别说为你"；看火的火娃今日自己走完上来，一根根按他的手指，最后说"沈公子，你爹走的时候也是这个岁数"
- 章节: 第223章
  时间: 离山第五十六日至五十七日（洼口火堆、井栏量窗）
  摘要: 火娃是十一年前洼上人抬回井边的孩子，不吃热的（吃热的说胡话，说的全是石头）；他说出底下那一夜：石头往回咬时缝里往外挤一样东西、挤到一半缩回、缝口响三声一下比一下短，"今年它挤到第四下了"；他学沈默用井栏+石头+石片做量窗的架子（重的一头放窗那边），卯时窗闭时石片偏半分，他坐三步外数了四十回，比脚底多记一天；"看火的"这一路不止一个——昨夜梁上睡八人今晨九人，多出来的那个背对火、双手拢袖；有人二更从井边走过，把火娃那块石片翻成圈朝下——火娃说"不怕号的人不会把号翻过去"；火娃自陈去年见过背井栏来坐一夜的那个人，那人按他手背三下、一下比一下轻，留话"你记着这个，往后窗闭之前就这样"，还对他说"你脚底有窗""火别压死"；井上的自陈腰后那个坑从晌午起往里缩、方向与他带回来那年相反
- 章节: 第229章
  时间: 离山第五十八日（井圈、抢与死）
  摘要: 前一天先来一人"借钱"、摊掌心给人看（那双手没干过活），井上断为"数账的"，沈默说"没带家伙的人明日带的是别人的手"；第二来三人：左撇子（领格那一个）、双手拢袖的（数账、使短锥）、空手小伙（腕缠布条）；他们只要井底那一枚，不要瓶——沈默以"瓶有号、你们对不上"相拒；争斗里井上的托住被他推倒的井栏，第三个人从背后上手，伤从肩头进、腰眼出，与周砚一个进法；沈默以鼓槌砸其前臂、掉出一枚背锉右半的钱，把左撇子的手腕压进第九石那道三十年前留的楔口，挣开时半只手掌留在石缝里（指头还保持往下按的姿势）；拢袖的临走摊手回一句"你是数账的"；井上的临终说出第六个人——五人有号、第六人没有号、他在上头管窗、窗闭了他才走、他走了井栏就跟他走；话断在"你爹当年也——"；沈默把"永"字钉按进他手里让他握着，埋人在井圈东、水二尺，把从石阶撬来的那块（刻第五号）留在坑上不压；剖验腰后那粒已缩到豆大、色如第九石磨出的青粉，他用石片上刮下的蜡裹了，塞进玉瓶底崩口；数出掌根第四道杠（昨夜三道）
- 章节: 第235章
  时间: 离山第五十九日至六十日（追东行二十里、烈阳城渊坊）
  摘要: 他凭留在石缝里的半只手掌追东路人：读三组脚印（一组两脚等深、一组左深右浅=左手有劲、一组极浅=没了分量），以断腕肉蜷向推知"少一只手的人被架着往右偏"；火娃告知井上的一年只与他说过两句话（"火别压死""你脚底有窗"），据此确认去年背井栏来坐一夜者即井上所指的人；渊坊北墙桌后他先念错一次号（"渊坊"）逼出"坊里号是数目加色、不带渊字"，再请见东柜；戴布指套的老人认石粉（滴水散青）、认石阶、认量器：三日前有人报号"陆沉"领走量器一只，同日"退引"九分（押为往右的拇指、押右写"沈"），另有一行同日"凭印领走空格"；柜台取出第二只同号瓶，瓶底号被人拿錾改过、压了一笔往左带——那只才是被拿去退九分的家伙；东柜老人说清：量器是双联，一只出、另一只必须有东西回来，故沈默名下十九分（他瓶内十分+柜上九分），"满了它就不认路，引认空不认满"；探渊器当众跳两格，老人落一个右上角偏半分的点作记号，允他往后免上器；他留下半只手掌换一个"姓"，并当众在牌上圈外压一道月牙（收势往左带）说"哪天有人画一样的圈，你分得出谁先"；出坊得一句：退九分那人名下领走两样——一枚井底引、一张图上的一角；他回看灵枢城背拓，图正中圆圈里那针凹今日多了一道月牙收势往左
- 章节: 第241章
  时间: 离山第六十一日至六十三日（黑石嘴，七日之头三日）
  摘要: 选地两处：塌窑壁有三人坐出的坑与一只没砸的罐（有人坐过七日？），弃；黑石嘴石不返日头、缝里渗水、旧錾痕往左带（有人先来看过、没住）。他把井栏从洼东一路背着，横压门框；埋瓶在洞口左手黑石下，一寸深、瓶口朝下、压碎石抹泥撒青粉，粉上刻月牙在左下（与"右上角偏半分"反着来，留给会改记号的人）；自定三条：不点灯、不出洞、一天三口水（三口是数日子不是省水）；带的东西摆三回（晒药阵→倒过来→只留香绳石臼三样在一步内），石臼窝朝天、第七日要把右手放进去；井绳拆到第三圈发现自绞到第三道方向就随左手一致，停手不拆；顶法来自顶席与顶缸两件旧事（他爹：你按我顶，你手轻按得住；顶东西的人不能走得快→一天只顶一回）；第二日雨，水从他脚边分开绕过；乔三娘送盐与干菜，看烟知他没点火、看他在洞口站三息知他在数气，警告"三圈绳认三圈的人，你改成两圈，来收绳的一眼就知道这绳上过谁的手"；第三日改养气，觉出膜后那片往前挪一线；夜里北来马蹄二十歇即止；洞口湿泥上一枚往左拧的拇指印，比草鞋小半寸、脚跟不落，是第六回量这大小，且是头一回印在他门口——他到以前两日半就有人来过，替这处石头记了一笔
- 章节: 第247章
  时间: 离山第六十四日至六十五日（第四、五日）
  摘要: 重排规矩：不点灯改不背风（一炷香换一次身）、一口水一查（石臼扣底看汗）、井绳卷团压后颈；鼓槌换成石臼片抵胸口（牙上能数、皮上不能），槌放回井栏窝底压住；把井绳改成"绕两圈留一个耳、耳朝外"——外头摘耳即知里头是活人，他在里头摸耳在不在知外头来过人；第四日掌根底下开始跳（水起纹、绳在下游像被人拿指甲弹）；顶的疼他分三栏（能忍：腰以下麻钝；要摊晾：肋背一跳一跳；得扔：腕内那根筋——一进来就是第六回）；第五日火娃上来报：井上有人两个收了绳、把三圈改成两圈又改回三圈、问他"这绳谁拆过"；四把松枝火夜里过山嘴、井圈那块石头被翻；他叫火娃往后三日别来，教他"数到第四十九把火就把井圈石翻过来、往南跑到药田蹲在柳条线底下"；孩子临走说"你埋了一样东西在东边，你刻的那个弯我认得，洼口石壁上有整排"；夜里洞口撒粉压两枚印；石臼窝底一圈浅字：烧在模子里的两字右号——官家家伙的印，不是私物；石片吊在洞口拿日头挪，第三夜转七回（猫二、风二、他自己一回、一下说不清——那一下极慢，像有人站在洞口把手掌按进来，气到他掌根停一停又退出）；绳上按夜打结（二、四、七），第七结摸到时石片正在转
- 章节: 第253章
  时间: 离山第六十六日至六十七日（第六日、第七日前半夜）
  摘要: 他九回顶到第六回就散，散在每一回的第六回上——同一处力从外头按他腕内那根筋；把身上八样"名"摆出来一样一样压掌根测跳：铜签不跳、切过麻线的旧签不跳、路引跳一下、石亭收执不跳、回字铺厚页跳两下、灵枢背拓跳三下、他自己按在册页上那枚印的拓跳得最响；推出结论：跳不跳不看纸记的是谁，看这纸上有几处"往左"的记——他顶不动的不是膜，是别人替他记的那几笔；抄领货单念斤两到第三十七担，想起当年"回丰栈"少抄一个"栈"被罚重抄、他抄完在册沿指甲划了一道往左带、后来那册被抽走一页——他头一回疑心那一页是他自己抽的；第七个时辰他把石片压井栏、鼓槌横膝抵胸口，只念斤两不念药名；外头来一人（左脚轻右脚重，是南门外跛腿那一路），说井今日叫人填了、三圈绳留在井沿、绳头朝外压在石片底下，叫他"去看"；他不去，并说出：你要我出去就别填井，去把我埋的瓶挖出来——一寸深是留给会改记号的人的，你挖就得露出那只往左带的手，我要的是那只手不是瓶；反将一军：三台揭页那天你在灰堆边捞过一把灰，两回合起来才是一个字，你捞两回说明你认不出那半个字、你不敢拿是因为拿回去要交、你交不出；那人退到第十一步回头丢一句"你爹那一夜，也是从第六回散的头"；天快亮洞外留一只鞋（补在底沿、与火塘那只补在帮上的不是一双，是两只凑成一对摆给他看）、还有他自己折在梁上那截染红的香——香上有井水腥与黑石的晒透凉味，两处被人走过一遍
- 章节: 第259章
  时间: 离山第六十八日（改往下走）至当夜（破铭纹前期）
  摘要: 第七日他改往下走：把膜松开一寸，顺那一寸下去；疼从骨头缝里一节一节排（腕肘肩脊椎腰膝），像拿錾沿骨凿浅槽、不敲只压；他咬鼓槌换成咬石臼片，咬穿下唇用腥气退腿麻，左手按进石缝凉水裡；头两日他记外三样（井绳颤七回→十四回、水线由往南偏到直、石臼扣底沙往南/东/后半夜往北＝他把气收回）；第五日险废：气退到第六日的位置、水堵在腰，他靠顶腭散气与咬穿唇退回半寸；第七日血滴在石缝旧錾痕的沟里，血顺沟走到月牙停住再渗进石；出来三件事：单手提起井栏（从前两手抱肩顶）、掌根多出一道纹（掌根起、斜上到腕内筋边三分处分叉，一叉往拇指、一叉半路齐口断）、走二里回岭口对自己背撞出的旧坑砸一拳（石不碎、坑往里塌一寸、指节破皮血冒得慢）；试气：第十一息断、两招能连第三招接不上——与蜕凡后期最后试出的数一样，不同的是不再灼痛、不必躺一天；踏水他只走四步就陷（设定三十丈，他诚实记下自己不行）；回井圈看填井与三圈绳（不改绳、把绳头按深半分）；半夜挖瓶：瓶在、原蜡未二次化、青灰蜡裹还在、十分渊精晃起来沉如半罐水且不再偏哪一边；他明白会来找瓶的人不看记号只看号；解掉绳上七个结一日一回、最后把耳重绞成两圈与一圈都舍不下、对绞第四道留耳、耳朝外
- 章节: 第265章
  时间: 离山第七十一日至七十五日（北返再到炙息城州衙换存照）
  摘要: 路上两处药田：第二处换新的四角柳条与线、旧线自绞两股拴在第四根上（洼上一路手法、动手的人手生）；炙息城晒场扩一倍、帘子不够拿旧席顶，疗愈馆弟子认出他"正骨的那个"、说宗主提过他；州衙书办六年一格、六张桌一色新墨，去年那格"蜕凡后期"不是他（他报"陆沉"、书办说"去年你二十七"）；玉尺贴掌根，尺里一层纹从掌根起、三分处分叉、一叉齐口断——书办"六年里跳过两回的七个、纹乱的十九个，断的你头一个"；尺底一行小字被人指甲抠圆：两字右号，与渊坊那两只量器同号；问四枚往左拧的印：头一枚十一年前冬月（大人背睡着的孩子、名号不落、验毕另册只落号）、第二枚去年三月（册上原有抽出来对一回又贴回）、第三枚今年三月是书办自己按的（"我这格六年没见过往左的纹，我怕往后认不出"，他的往右）；旧册一行不是他的字：笔锋一笔带过、横起手重收尾轻，十一年前冬月，名号"陆沉·北籍·蜕凡后期"，小字"掌纹分叉，未断。验毕，另册存"——另册不在这一格；沈默按印落册，纹路往左拧，书办脸上是"终于确认了自己早疑心的事"的神气；赤霞子在阶下等他：说出他掌根那道纹不是没长全、是叫人收走一段，凭在另一人手里（往左拧的那只手），并指"井边坐着那个人三十年前替我们馆里挑过水、左手缺半截指头"——对上邵伯；井栏窝底刻着自己的数、城南旧井栏挪来压帘子；出城北行二十里，官板路牌末笔又往左带，牌后一行浅刻"正骨先生留步"，石墩薄苔未倒——留字的人站着刻、手上没有活或不肯把活弄脏；他把井栏横在石墩上，坐到井栏后头，面朝北
- 章节: 第271章
  时间: 离山第八十余日至开春前（炙息城疗愈馆帮工第二十日）
  摘要: 玄天宗三人入城，带灰布新册与南域蓝布存照并置；书办被问三句（陆沉几时落册、去年在不在南域、去年册上境界哪一格），答不了"两本谁也不服谁"，北边回话是"南域替一个人存了两本账"并抬出"另册存"；沈默在馆里做下的三件小事（反铺泡雨的席、给挑水汉子正肩只换一句换肩、拒答名号"报了名就要按名派活"）；小满转述灰册夹一根麻线（两圈压耳、耳朝外，他师叔会四种、其中一种是捆尸）、掀纸者手上有旧烫点、不穿号衣那位先看正面"陆沉"、拢袖那位始终不碰纸；他把南域存照压在井栏下、叫小满蹲街对面看谁先掀；夜里去州衙见书办：灰册昨夜已走、留一张抄件，抄者手轻笔尖打滑（与那封"错字信"的淡墨同人），抄件背面右下角另有一枚右上角偏半分的圈（正面那枚是他按的）——两本册各有一个圈；北边那本的圈不在纸上，在夹麻线那道缝里，书办末了带话"你们这格六年跳两格的有七个，他往后要一个一个来问"；当夜他把井栏搬进馆院，压在柴堆下、门槛外一寸，风动柴先响，第二夜响七下、第八下停在半空
- 章节: 第277章
  时间: 离山第八十余日（承96之后数日）
  摘要: 三台脚店孩子送陆九霄的信；孩子右手虎口一道新割口子（不贴草纸，说贴了手滑绳系不紧），沈默认得这个看手法的路数；信纸是州衙外头卖的粗纸、字硬毫，两处"某某"深墨收急、淡墨水多，两个人同抄一封信；孩子自报今年十五，先生（商队先生）叫他数了三回；"你如今还坐门槛？""我坐三家"；替谁抄信——"那家不坐人，我坐钉掌铺门口，钉掌的不钉掌了，改教人"（邵瘸子出狱一线）；信中另有一行数目："十一斤麻绳托人捎给你，别拿它上吊也别拿它捆人，一根整的，割断就不成数"，那一行笔肚压毛、"斤"字末竖往左带，写的人自己愣了一下顿了一个点；孩子腕内侧一道新包的手是从左往右缠（左撇子替右撇子包），他说是"那先生"包的、包时叫他数到二十；沈默把信纸对着灯照草筋，与疗愈馆"不收诊金"那张纸同一筋——信是在南边写的；他把两处反字（幕／暮）逆光看笔势：挑的是替抄的人、压的是写信的人；回信不写字，卷一截两圈留耳的井绳，内裹稠石灰、一枚背锉右半的钱、一段烧过的麻绳头，各代表抹平的、按数的、下过眼的，末了一句"我在北边等他一春，暮春不是幕春"；此后他在井边数火，数到第二十九把；小满在镇口截他，说疗愈馆门房那张"不收诊金"叫人揭了、换了新纸，揭纸三人中有一个右手整日拢在袖里
- 章节: 第283章
  时间: 开春前后（黑石嘴洞口）
  摘要: 商队先生本人下车前，沈默先摆三样：拓纸在下、描本在中、焦页在上，各以铜钱压角，右手小指不抖（他自己留意到）；先生摊出一页三栏账（岭口一笔、东巷一笔、三台一笔），沈默还回去"三笔不是账是三件事，事只有前后"，并把三笔并一条：撕页的人先撕过青岩城那一册，手法左手在前右手在后；帘后伸手——掌心掌根也是一片空，"我不是你这一族的，我这半截是三十一年前在井边上留下的，你手上那口井上的是我兄弟，他守井守到去年"；车辕布上六条浅槽五枚背锉钱、第六条空，"你数过六回"——先生自认第五回是他自己、第六回是他兄弟；先生把沈默那枚挂账钱给他，他反手放进本来没有槽的第七条："这一枚不叫还账叫挂账"；先生摸出第三块石牌，三块缺角互相咬得上，一副牌五块分三段，剩下两块"一块在井上，一块在窗上"；沈默把三块分开、两块归己一块推回，并说出"他不管了，因为有人替他数完了"；先生给第三笔：西域堂三字，并说追验之令出在南域换册那一日起；车走，小满问先生叫什么，"他没叫，他这一辈子只有名没有姓"；当夜沈默用邵伯的錾在井栏底面刻四笔（岭口、东巷、三台、井人没），抹平木刺如合账；小满回报空缸又叫人挑回北边，挑缸者前掌落地、扁担两头空、一步半间距与黑石井圈同宽，他在井圈边按了一按石头却没往黑石嘴来；沈默交代下一句：问他"一副牌五块，你手上那块缺哪一角"
- 章节: 第289章
  时间: 开春前后（炙息城河堤晒场）
  摘要: 周砚案里剩下的活人（当年疯了抬回北边那一位）如今在河堤翻帘子，只会这一样、做别的会砸，治了一半：会答话不主动说、认人不认名；他握住沈默的手腕说"你手上的茧一道斜，我在纸上描过一只手，描了三回，第三回他说别再描了，描一回他要来一次"；描手的人是"从井上来的"，给他两个饼，他拿回去给描手的那位，那位不吃、说"饼你吃了这一笔就算立住了"（与61章娃娃两个饼同路）；他自陈有两个名，一个是娘给的念不出、一个自己描的描完就不认得，"我一念，那个从井上来的就按住我手，说今日先别念"；西域堂三人（新号衣、汗巾、拢袖者）在堤下二十步站了半个时辰，看影子、看柜里那层灰；沈默反手设局：他把一张只写了一个姓"沈"和一枚右上角偏半分的圈的纸压在药柜灰底下，推柜到三人脚边，"你们要就抬回去，抬回去要开柜，开柜要念那两个字，念一次你们那本灰册上就多一行——一行换两个字，你们算算贵不贵"；三人未抬柜；他教翻帘子的"往后他们说你是翻帘子的，你娘给的那个自己收着，别给人念也别替人念；再要你描手你就描，描完问他这一只手值几个饼"；疗愈馆弟子转述宗主那句"掌根上空着的人我这一路见过四个"（死了两个、一个疯了就是堤上这位、剩一个往北去了没回来）；两只凑不成对的鞋他用自己那截两圈留耳的绳系住交给馆里，托带给那位往南的人，说"他穿一双走三百里穿得住"；出城他在门房新纸前站了半刻，这回背面什么都没有
- 章节: 第295章
  时间: 开春（三年之期未尽，离山约二百六十日）
  摘要: 雪线开、南门关换新册，从三月起认印不认名：北来者按纹入册，往南者"印留在我们这本上就行，往南没人来对"——沈默在关上册上头一回也是最后一回落这枚往左拧的印；出关二里把井栏立在关内道边废堆上，与三只塌半边的井圈合成一副，窝底"五"露在外头，往后有人数到六会找到这儿；往南第一处苍桢辖地有人试土（赤脚中年人按三下看脚底、拿薄石记一笔），说底下的脉在挪、一年一根头发的宽，去年北边三条沟干、今年轮到南边洼，并警告"脉挪走不是空着走，是拿东西换；它带走水留下一样沉的，沉的埋在石底，谁拿錾凿它，它就认谁的手"；他在石亭遇见背药篓的老太太，老太太绕井栏一圈看窝底数，说"井栏在哪儿，井就在哪儿塌过；你背它走，前头人一眼知道你从塌过井的地方来"，又问"那你为什么还背"，他答"它替我按住过一个人"；岔口两块牌（苍桢往南、玄天宗辖往北），灰布牌上新刻三字"沈默，追验"，落笔一笔带过、横起手重收尾轻；他吐掉那口气转身往南，走二里回头一次，岔口无人，木柱影横道；往南第二日遇迁井八人，领队的把井栏上那道绳结往里按到看不见，劝他"别拿这口做样，我们这儿的井按脉打；你答得出井在哪儿塌过，就得带人去；答不出，就得自己一个人去"——他把绳结按回露在外头，答"我答得出来，我就是为这个往南走"；镇上卖井圈的石匠给他刻了一片自己的样（两道叉一个断口），"你没样，你刻出来的是别人"，他把石片与那枚往右锉的钱并排塞进烙铁铜缝；往南第一夜在塌亭里把气放满从头数到尾：第十一息断、两招能连、第三招收不住，三个结打在绳中段不在两头；第五日有人在道边喊"翻帘子的"，他回过一次头，随即改了主意——那两个字是他给出去的，给出去就归别人用；出镇那晨风起自南，他背包袱、右手空着，走三十步没有回头
